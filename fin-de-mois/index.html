  /* ================= Feuilles ================= */
  function openSheet(inner, label) {
    if (!sheetHost.innerHTML) lastFocus = document.activeElement;
    sheetHost.innerHTML = `<div class="scrim" data-act="closeSheet"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><span class="grab" aria-hidden="true"></span>${inner}</section></div>`;
    const f = sheetHost.querySelector(".sheet input:not([type=hidden]), .sheet select, .sheet button");
    if (f) f.focus({ preventScroll: true });
  }
  function closeSheet() {
    const s = sheetHost.querySelector(".scrim");
    if (!s) return;
    const done = () => { if (sheetHost.contains(s)) sheetHost.innerHTML = ""; if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus({ preventScroll: true }); };
    if (reduced()) return done();
    s.classList.add("closing");
    setTimeout(done, 150);
  }

  function txSheet(id) {
    const t = state.tx.find((x) => x.id === id);
    if (!t) return;
    const k = classify(t);
    const s = k === null ? suggest(t) : null;
    const order = t.amount > 0 ? ["revenu", "enveloppe", "fixe"] : ["enveloppe", "fixe", "revenu"];
    const groups = order.map((kind) => {
      const list = state.categories.filter((c) => c.kind === kind);
      if (!list.length) return "";
      return `<p class="grp">${KIND[kind]}</p>` + list.map((c) => `<label class="choice"><input type="radio" name="txCat" value="${esc(c.id)}" ${k === c.id || (s && s.id === c.id) ? "checked" : ""}>${esc(c.name)}${s && s.id === c.id ? `<span class="why">Suggéré, ${esc(s.why)}</span>` : ""}</label>`).join("");
    }).join("");
    const canRule = t.label && t.source !== "manuel";
    const same = canRule ? state.tx.filter((x) => x !== t && norm(x.label) === norm(t.label)).length : 0;
    openSheet(`<h2>${esc(t.label || "Sans libellé")}</h2>
      <p class="meta">${dayLabel(t.date)}, <span class="num">${sgn(t.amount)}</span>${t.orig ? ` (relevé : ${sgn(t.orig.amount)})` : ""}</p>
      <div class="choices" role="radiogroup" aria-label="Catégorie">${groups}<p class="grp">Autre</p>
        <label class="choice"><input type="radio" name="txCat" value="hors" ${k === "hors" ? "checked" : ""}>Non comptée (virement entre comptes, aide ponctuelle)</label></div>
      ${canRule ? `<label class="check"><input type="checkbox" id="txRule" checked><span>Classer de la même façon ${same ? `les ${same + 1} opérations « ${esc(t.label)} »` : `les prochaines opérations « ${esc(t.label)} »`}</span></label>` : ""}
      <div class="field"><label for="txNote">Note</label><input type="text" id="txNote" value="${esc(t.note || "")}" placeholder="Ex. : resto avec Julien"></div>
      <details class="more-opts"><summary>Modifier le montant, la date ou répartir</summary><div>
        <div class="grid2"><div class="field"><label for="txAmt">Montant</label><div class="money-in"><input id="txAmt" inputmode="decimal" value="${esc(amountText(Math.abs(t.amount)))}"><span aria-hidden="true">€</span></div></div>
          <div class="field"><label for="txDate">Date</label><input type="date" id="txDate" value="${esc(t.date)}"></div></div>
        <div class="field"><label for="txLabel">Libellé</label><input type="text" id="txLabel" value="${esc(t.label)}"></div>
        <div class="field"><span class="flabel">Répartir sur une autre catégorie</span><div class="grid2">
          <div class="money-in"><input id="txSplitAmt" inputmode="decimal" placeholder="0" aria-label="Part à déplacer"><span aria-hidden="true">€</span></div>
          <select class="input" id="txSplitCat" aria-label="Catégorie de la part">${state.categories.filter((c) => c.kind !== "revenu").map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select></div>
          <p class="hint">Ex. : 20 € de ce ticket étaient des sorties. La part est retirée de cette opération et classée à part.</p></div>
        <p class="err" id="txErr" hidden></p>
        ${t.orig ? `<button class="btn secondary" data-act="restoreTx" data-id="${esc(t.id)}">Revenir au montant du relevé</button>` : ""}
      </div></details>
      ${t.source === "manuel" || t.parent ? `<button class="btn danger" data-act="askDelTx" data-id="${esc(t.id)}">Supprimer cette opération</button>` : ""}
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Annuler</button><button class="btn primary" data-act="saveTx" data-id="${esc(t.id)}">Enregistrer</button></div>`, "Opération");
  }

  function groupSheet(key) {
    const list = state.tx.filter((t) => classify(t) === null && (norm(t.label) || "(sans libellé)") === key);
    if (!list.length) return;
    const s = suggest(list[0]);
    const choices = ["enveloppe", "fixe", "revenu"].map((kind) => `<p class="grp">${KIND[kind]}</p>` + state.categories.filter((c) => c.kind === kind).map((c) =>
      `<label class="choice"><input type="radio" name="grpCat" value="${esc(c.id)}" ${s && s.id === c.id ? "checked" : ""}>${esc(c.name)}${s && s.id === c.id ? `<span class="why">Suggéré</span>` : ""}</label>`).join("")).join("");
    openSheet(`<h2>${esc(list[0].label)}</h2><p class="meta">${list.length} opération${list.length > 1 ? "s" : ""}, ${eur(list.reduce((a, t) => a - t.amount, 0))}</p>
      <div class="choices" role="radiogroup" aria-label="Catégorie">${choices}<p class="grp">Autre</p><label class="choice"><input type="radio" name="grpCat" value="hors">Non comptée</label></div>
      <p class="hint">Le choix s'applique à ces opérations et aux prochaines qui portent ce libellé.</p>
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Annuler</button><button class="btn primary" data-act="saveGroup" data-k="${esc(key)}">Classer</button></div>`, "Classer un commerce");
  }

  function addRule(label, catId) {
    const kw = String(label).trim();
    for (const c of state.categories) c.kw = (c.kw || []).filter((k) => norm(k) !== norm(kw));
    cat(catId).kw.push(kw);
  }
  function applyGroup(key, v) {
    const list = state.tx.filter((t) => classify(t) === null && (norm(t.label) || "(sans libellé)") === key);
    if (!list.length) return 0;
    if (v === "hors") list.forEach((t) => (t.manualCat = "hors"));
    else addRule(list[0].label, v);
    return list.length;
  }

  function confirmSheet(title, text, okLabel, okAct, extra = "") {
    openSheet(`<h2>${esc(title)}</h2><p class="hint">${text}</p>
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Annuler</button><button class="btn danger" data-act="${okAct}" ${extra}>${esc(okLabel)}</button></div>`, title);
  }

  /* ================= Sauvegarde ================= */
  const backupPayload = () => JSON.stringify({ app: APP_ID, version: 2, exportedAt: new Date().toISOString(), state }, null, 1);
  async function doBackup() {
    const data = backupPayload();
    const name = `fin-de-mois-sauvegarde-${todayISO()}.json`;
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: name, data }); state.settings.lastBackup = new Date().toISOString(); save(); render(); toast("Sauvegarde créée"); return; }
      catch (e) {
        if (e && e.code === "declined") { toast("Sauvegarde annulée"); return; }
        if (e && e.code === "rate_limited") { toast("Une demande est déjà ouverte, réessaie dans un instant"); return; }
      }
    }
    if (!IN_CLAUDE) {
      try {
        const file = new File([data], name, { type: "application/json" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: "Sauvegarde Fin de mois" });
          state.settings.lastBackup = new Date().toISOString(); save(); render(); toast("Sauvegarde créée"); return;
        }
        const a = document.createElement("a");
        a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        state.settings.lastBackup = new Date().toISOString(); save(); render(); toast("Sauvegarde téléchargée"); return;
      } catch (e) { if (e && e.name === "AbortError") { toast("Sauvegarde annulée"); return; } }
    }
    openSheet(`<h2>Copier la sauvegarde</h2><p class="hint">L'enregistrement de fichier n'est pas disponible ici. Copie ce texte et colle-le dans une note ou un fichier que tu gardes.</p>
      <div class="field"><label for="bkText">Contenu de la sauvegarde</label><textarea id="bkText" readonly>${esc(data)}</textarea></div>
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Fermer</button><button class="btn primary" data-act="copyBackup">Copier</button></div>`, "Copier la sauvegarde");
  }
  function openRestore() {
    openSheet(`<h2>Restaurer une sauvegarde</h2><p class="hint">Choisis le fichier, ou colle son contenu. Tes données actuelles seront remplacées.</p>
      <button class="btn primary" data-act="pickBackup">Choisir le fichier</button>
      <div class="field"><label for="rsText">Ou colle le contenu ici</label><textarea id="rsText"></textarea><p class="err" id="rsErr" hidden></p></div>
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Annuler</button><button class="btn primary" data-act="restorePasted">Restaurer</button></div>`, "Restaurer une sauvegarde");
  }
  function applyBackup(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return "Ce texte n'est pas une sauvegarde lisible. Vérifie que tu as copié tout le contenu."; }
    const s = obj && obj.app === APP_ID ? obj.state : obj;
    if (!validState(s)) return "Ce fichier n'est pas une sauvegarde de Fin de mois.";
    state = migrate(s); save(); closeSheet(); viewYM = ymNow(); heroShown = null; go("mois"); toast(`Sauvegarde restaurée (${state.tx.length} opérations)`);
    return null;
  }

  /* ================= Rendu ================= */
  function go(v) {
    if (!VIEWS.includes(v)) v = "mois";
    const run = () => {
      view = v;
      if (location.hash !== "#" + v) { try { window.history.replaceState(null, "", "#" + v); } catch (e) {} }
      render(); window.scrollTo(0, 0);
    };
    if (document.startViewTransition && !reduced() && state) document.startViewTransition(run); else run();
  }
  function render() {
    if (!state) { tabs.hidden = true; renderOnboarding(); return; }
    tabs.hidden = false;
    const tab = PARENT[view] || view;
    for (const a of tabs.querySelectorAll("a")) { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }
    const n = state.tx.filter((t) => classify(t) === null).length;
    const badge = document.getElementById("badge");
    badge.hidden = !n; badge.textContent = n > 99 ? "99+" : String(n);
    ({ mois: renderMois, simuler: renderSimuler, ajouter: renderAjouter, operations: renderOperations, plus: renderPlus, evenements: renderEvenements,
       objectifs: renderObjectifs, voitures: renderVoitures, projection: renderProjection, budget: renderBudget, sauvegarde: renderSauvegarde, iphone: renderIphone }[view] || renderMois)();
  }
  const scen = (sid) => scenarios.find((s) => s.id === sid);
  const val = (id) => { const e = document.getElementById(id); return e ? e.value : ""; };
  const showErr = (id, msg) => { const e = document.getElementById(id); if (e) { e.textContent = msg; e.hidden = false; } };

  /* ================= Événements ================= */
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    if (act === "closeSheet" && el.classList.contains("scrim") && e.target !== el) return;
    switch (act) {
      case "go": go(el.dataset.v); break;
      case "prev": viewYM = ymShift(viewYM, -1); render(); break;
      case "next": viewYM = ymShift(viewYM, 1); render(); break;
      case "closeSheet": closeSheet(); break;
      case "heroDetail": heroDetailSheet(); break;
      case "goUncl": opsFilter = "commerces"; go("operations"); break;
      case "chartSel": chartSel[el.dataset.chart] = Number(el.dataset.i); render(); break;

      case "scenQuick": { const s = scen(el.dataset.sid); s.amount = el.dataset.v; const i = document.getElementById("sa-" + s.id); if (i) i.value = s.amount; updateSim(); break; }
      case "scenWhen": { const s = scen(el.dataset.sid); s.when = el.dataset.v; if (s.when === "date" && !s.date) s.date = todayISO(); renderSimuler(); break; }
      case "addScen": scenarios.push(newScen(scenarios.length + 1)); renderSimuler(); break;
      case "delScen": scenarios = scenarios.filter((s) => s.id !== el.dataset.sid); scenarios.forEach((s, i) => (s.name = `Dépense ${i + 1}`)); renderSimuler(); break;
      case "scenSave": {
        const s = scen(el.dataset.sid);
        const a = parseAmount(s.amount);
        if (!(a > 0)) { const i = document.getElementById("sa-" + s.id); if (i) i.focus(); toast("Indique d'abord un montant"); break; }
        const date = scenDate(s);
        const catId = s.cat === "__hors" ? null : s.cat;
        if (ymOf(date) > ymNow()) {
          state.events.push({ id: uid(), label: catId ? `${cat(catId).name} prévue` : "Dépense imprévue", type: "out", ym: ymOf(date), amount: round2(a), done: false });
          toast(`Ajoutée aux dépenses prévues de ${monthName(ymOf(date))}`);
        } else {
          state.tx.unshift({ id: uid(), date, label: catId ? cat(catId).name : "Dépense imprévue", amount: -round2(a), source: "manuel", manualCat: catId });
          sortTx(); toast("Dépense enregistrée");
        }
        save(); s.amount = ""; renderSimuler(); break;
      }

      case "addType": addForm.type = el.dataset.v; addForm.cat = ""; renderAjouter(); break;
      case "filter": opsFilter = el.dataset.v; renderOperations(); break;
      case "importCsv": csvInput.value = ""; csvInput.click(); break;
      case "closeImport": lastImport = null; renderOperations(); break;
      case "openTx": txSheet(el.dataset.id); break;
      case "openGroup": groupSheet(el.dataset.k); break;
      case "acceptSugg": { const n = applyGroup(el.dataset.k, el.dataset.c); save(); render(); toast(`${n} opération${n > 1 ? "s" : ""} classée${n > 1 ? "s" : ""} dans ${cat(el.dataset.c).name}`); break; }
      case "saveGroup": {
        const sel = sheetHost.querySelector('input[name="grpCat"]:checked');
        if (!sel) { toast("Choisis une catégorie"); break; }
        const n = applyGroup(el.dataset.k, sel.value); save(); closeSheet(); render();
        toast(sel.value === "hors" ? `${n} opération${n > 1 ? "s" : ""} non comptée${n > 1 ? "s" : ""}` : `${n} opération${n > 1 ? "s" : ""} classée${n > 1 ? "s" : ""} dans ${cat(sel.value).name}`);
        break;
      }
      case "saveTx": {
        const t = state.tx.find((x) => x.id === el.dataset.id);
        if (!t) { closeSheet(); break; }
        const sel = sheetHost.querySelector('input[name="txCat"]:checked');
        const amt = parseAmount(val("txAmt"));
        const date = val("txDate");
        const splitRaw = val("txSplitAmt").trim();
        const split = splitRaw ? parseAmount(splitRaw) : 0;
        if (!(amt > 0)) { showErr("txErr", "Indique un montant, par exemple 12,50."); sheetHost.querySelector("details.more-opts").open = true; break; }
        if (!date) { showErr("txErr", "Indique une date."); sheetHost.querySelector("details.more-opts").open = true; break; }
        if (splitRaw && !(split > 0 && split < amt)) { showErr("txErr", `La part à répartir doit être entre 0 et ${eur(amt)}.`); sheetHost.querySelector("details.more-opts").open = true; break; }
        const sign = t.amount < 0 ? -1 : 1;
        const newAmt = round2(sign * amt), newLabel = val("txLabel").trim() || t.label;
        if ((newAmt !== t.amount || date !== t.date || newLabel !== t.label) && t.source !== "manuel" && !t.orig) t.orig = { amount: t.amount, date: t.date, label: t.label };
        const oldLabel = t.label;
        t.amount = newAmt; t.date = date; t.label = newLabel; t.note = val("txNote").trim();
        if (sel) {
          const v = sel.value, rule = sheetHost.querySelector("#txRule");
          if (rule && rule.checked && v !== "hors") { addRule(oldLabel, v); delete t.manualCat; if (t.label !== oldLabel) t.manualCat = v; }
          else if (rule && rule.checked && v === "hors") { for (const x of state.tx) if (norm(x.label) === norm(oldLabel)) x.manualCat = "hors"; }
          else t.manualCat = v;
        }
        if (split > 0) {
          t.amount = round2(t.amount - sign * split);
          state.tx.push({ id: uid(), date: t.date, label: `${t.label} (part)`, amount: round2(sign * split), source: "manuel", parent: t.id, manualCat: val("txSplitCat") });
        }
        sortTx(); save(); closeSheet(); render(); toast("Opération enregistrée"); break;
      }
      case "restoreTx": {
        const t = state.tx.find((x) => x.id === el.dataset.id);
        if (t && t.orig) { Object.assign(t, t.orig); delete t.orig; sortTx(); save(); closeSheet(); render(); toast("Montant du relevé rétabli"); }
        break;
      }
      case "askDelTx": confirmSheet("Supprimer cette opération ?", "Elle ne comptera plus dans ton budget.", "Supprimer", "delTx", `data-id="${esc(el.dataset.id)}"`); break;
      case "delTx": {
        const t = state.tx.find((x) => x.id === el.dataset.id);
        if (t && t.parent) { const p = state.tx.find((x) => x.id === t.parent); if (p) p.amount = round2(p.amount + t.amount); }
        state.tx = state.tx.filter((x) => x.id !== el.dataset.id); save(); closeSheet(); render(); toast("Opération supprimée"); break;
      }

      case "editEvent": eventSheet(el.dataset.id); break;
      case "evType": { document.getElementById("evTypeVal").value = el.dataset.v; for (const b of el.parentElement.children) b.setAttribute("aria-pressed", String(b === el)); break; }
      case "saveEvent": {
        const label = val("evLabel").trim(), ym = val("evYm"), a = parseAmount(val("evAmt"));
        if (!label) { showErr("evErr", "Donne un nom, par exemple « prime de décembre »."); break; }
        if (!/^\d{4}-\d{2}$/.test(ym)) { showErr("evErr", "Choisis le mois."); break; }
        if (!(a > 0)) { showErr("evErr", "Indique un montant, par exemple 800."); break; }
        const id = el.dataset.id;
        const data = { label, ym, amount: round2(a), type: val("evTypeVal") === "in" ? "in" : "out", done: !!(document.getElementById("evDone") || {}).checked };
        if (id) Object.assign(state.events.find((x) => x.id === id), data); else state.events.push({ id: uid(), ...data });
        save(); closeSheet(); render(); toast("Enregistré"); break;
      }
      case "delEvent": state.events = state.events.filter((x) => x.id !== el.dataset.id); save(); closeSheet(); render(); toast("Supprimé"); break;

      case "editGoal": goalSheet(el.dataset.id); break;
      case "saveGoal": {
        const name = val("gName").trim(), target = parseAmount(val("gTarget")), savedRaw = val("gSaved").trim(), saved = savedRaw ? parseAmount(savedRaw) : 0, ym = val("gDate");
        if (!name) { showErr("gErr", "Donne un nom à l'objectif."); break; }
        if (!(target > 0)) { showErr("gErr", "Indique le montant visé, par exemple 1500."); break; }
        if (!isFinite(saved) || saved < 0) { showErr("gErr", "Le montant déjà de côté est illisible."); break; }
        if (!/^\d{4}-\d{2}$/.test(ym)) { showErr("gErr", "Choisis le mois visé."); break; }
        const data = { name, target: round2(target), saved: round2(saved), date: `${ym}-01` };
        const id = el.dataset.id;
        if (id) Object.assign(state.goals.find((x) => x.id === id), data); else state.goals.push({ id: uid(), ...data });
        save(); closeSheet(); render(); toast("Objectif enregistré"); break;
      }
      case "delGoal": state.goals = state.goals.filter((x) => x.id !== el.dataset.id); save(); closeSheet(); render(); toast("Objectif supprimé"); break;

      case "editCar": carSheet(el.dataset.id); break;
      case "saveCar": {
        const name = val("cName").trim(), rent = parseAmount(val("cRent")), depRaw = val("cDep").trim(), dep = depRaw ? parseAmount(depRaw) : 0;
        const months = parseInt(val("cMonths"), 10), km = parseInt(String(val("cKm")).replace(/\s/g, ""), 10);
        if (!name) { showErr("cErr", "Donne le nom de la voiture."); break; }
        if (!(rent > 0)) { showErr("cErr", "Indique le loyer par mois, par exemple 320."); break; }
        if (!isFinite(dep) || dep < 0) { showErr("cErr", "L'apport est illisible."); break; }
        const data = { name, rent: round2(rent), deposit: round2(dep), months: months > 0 ? months : 0, km: km > 0 ? km : 0 };
        const id = el.dataset.id;
        if (id) Object.assign(state.cars.find((x) => x.id === id), data); else state.cars.push({ id: uid(), ...data });
        save(); closeSheet(); render(); toast("Offre enregistrée"); break;
      }
      case "useCar": { const c = state.cars.find((x) => x.id === el.dataset.id); const v = cat("voiture"); if (c && v) { v.budget = c.rent; save(); closeSheet(); render(); toast(`Voiture du budget : ${eur0(c.rent)} par mois (toujours non comptée tant que tu ne l'actives pas)`); } break; }
      case "delCar": state.cars = state.cars.filter((x) => x.id !== el.dataset.id); scenarios.forEach((s) => { if (s.car === "car:" + el.dataset.id) s.car = ""; }); save(); closeSheet(); render(); toast("Offre supprimée"); break;

      case "addCat": {
        const kind = el.dataset.kind;
        const c = { id: "c" + uid(), name: kind === "revenu" ? "Nouvelle rentrée" : kind === "fixe" ? "Nouvelle charge" : "Nouvelle enveloppe", kind, budget: 0, kw: [], active: true };
        state.categories.push(c); save(); renderBudget();
        const d = app.querySelector(`details[data-id="${c.id}"]`); if (d) { d.open = true; const n = d.querySelector('[data-edit="name"]'); if (n) { n.focus(); n.select(); } }
        break;
      }
      case "delCat": {
        const c = cat(el.dataset.id);
        const used = state.tx.filter((t) => classify(t) === c.id).length;
        confirmSheet(`Supprimer « ${c.name} » ?`, used ? `${used} opération(s) classées ici repasseront « À classer ».` : "Aucune opération n'est classée ici.", "Supprimer", "delCatOk", `data-id="${esc(c.id)}"`);
        break;
      }
      case "delCatOk": {
        const id = el.dataset.id;
        for (const t of state.tx) if (t.manualCat === id) delete t.manualCat;
        state.categories = state.categories.filter((c) => c.id !== id);
        scenarios.forEach((s) => { if (s.cat === id) s.cat = "__hors"; });
        save(); closeSheet(); renderBudget(); toast("Catégorie supprimée"); break;
      }

      case "backup": doBackup(); break;
      case "importJournal": journalInput.value = ""; journalInput.click(); break;
      case "budgetSugg": go("budget"); break;
      case "applySugg": { const c = cat(el.dataset.id); c.budget = Number(el.dataset.v); save(); render(); toast(`${c.name} : budget passé à ${eur0(c.budget)}`); break; }
      case "ignoreSugg": state.settings.ignoredSugg.push(el.dataset.k); save(); render(); break;
      case "makeFixed": {
        const x = recurring().find((r) => r.key === el.dataset.k);
        if (!x) break;
        const c = { id: "c" + uid(), name: x.label, kind: "fixe", budget: Math.round(x.avg * 100) / 100, kw: [x.label], active: true };
        for (const o of state.categories) o.kw = (o.kw || []).filter((k) => norm(k) !== norm(x.label));
        state.categories.push(c); save(); render(); toast(`${x.label} ajouté aux charges fixes`); break;
      }
      case "copy": {
        const node = document.getElementById(el.dataset.t);
        const txt = node ? node.textContent : "";
        try { navigator.clipboard.writeText(txt).then(() => toast("Copié"), () => toast("Sélectionne le texte puis copie-le")); } catch (err) { toast("Sélectionne le texte puis copie-le"); }
        break;
      }
      case "copyBackup": {
        const ta = document.getElementById("bkText");
        const done = () => { state.settings.lastBackup = new Date().toISOString(); save(); toast("Sauvegarde copiée"); };
        const fallback = () => { ta.focus(); ta.select(); toast("Sélectionne le texte puis copie-le"); };
        try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (err) { fallback(); }
        break;
      }
      case "restore": openRestore(); break;
      case "pickBackup": backupInput.value = ""; backupInput.click(); break;
      case "restorePasted": { const t = val("rsText").trim(); const msg = t ? applyBackup(t) : "Colle d'abord le contenu de la sauvegarde."; if (msg) showErr("rsErr", msg); break; }
      case "wipe": confirmSheet("Effacer toutes les données ?", "Ton budget et tes opérations seront supprimés de cet appareil. Crée une sauvegarde avant si tu veux pouvoir les récupérer.", "Tout effacer", "wipeOk"); break;
      case "wipeOk": try { localStorage.removeItem(KEY); } catch (err) {} state = null; onb = { step: 1, vals: {} }; heroShown = null; closeSheet(); render(); break;

      case "onbBack": onbCollect(); onb.step = Math.max(1, onb.step - 1); renderOnboarding(); window.scrollTo(0, 0); break;
    }
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.sf === "amount") { scen(t.dataset.sid).amount = t.value; updateSim(); }
    else if (t.id === "opsQuery") { opsQuery = t.value; const box = document.getElementById("opsList"); if (box) box.innerHTML = opsList(computeMonth(viewYM)); }
    else if (t.id === "addAmount") { addForm.amount = t.value; if (t.getAttribute("aria-invalid") === "true") { t.removeAttribute("aria-invalid"); document.getElementById("addAmountErr").hidden = true; } }
    else if (t.id === "addLabel") addForm.label = t.value;
    else if (t.id === "addNote") addForm.note = t.value;
    else if (t.closest && t.closest(".money-in")) t.closest(".money-in").classList.remove("invalid");
    if (t.closest && t.closest(".sheet")) { const er = t.closest(".sheet").querySelector(".err"); if (er) er.hidden = true; }
  });
  document.addEventListener("focusin", (e) => {
    if (e.target.id === "addAmount" && e.target.getAttribute("aria-invalid") === "true") { e.target.removeAttribute("aria-invalid"); document.getElementById("addAmountErr").hidden = true; }
  });
  document.addEventListener("focusout", (e) => {
    if (e.target.id === "addAmount") {
      addForm.touched = true;
      if (e.target.value.trim() && !(parseAmount(e.target.value) > 0)) { e.target.setAttribute("aria-invalid", "true"); document.getElementById("addAmountErr").hidden = false; }
    }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.sf && t.dataset.sf !== "amount") { const s = scen(t.dataset.sid); s[t.dataset.sf] = t.value; updateSim(); return; }
    if (t.id === "projCar") { projCar = t.value; renderProjection(); return; }
    if (t.name === "addCat") { addForm.cat = t.value; return; }
    if (t.id === "addDate") { addForm.date = t.value; return; }
    if (t.id === "estOn") { state.settings.estimate = t.checked; save(); toast(t.checked ? "Estimation activée" : "Estimation désactivée"); return; }
    if (t.id === "alertPct") { state.settings.alertPct = Number(t.value); save(); toast("Enregistré"); return; }
    if (t.id === "goal" && state) { const v = parseAmount(t.value || "0"); state.settings.goal = isFinite(v) && v > 0 ? round2(v) : 0; save(); renderObjectifs(); toast("Épargne mensuelle enregistrée"); return; }
    const ed = t.dataset && t.dataset.edit;
    if (ed && state) {
      const c = cat(t.dataset.id); if (!c) return;
      if (ed === "name") c.name = t.value.trim() || c.name;
      else if (ed === "budget") { const v = parseAmount(t.value || "0"); if (!isFinite(v) || v < 0) { t.closest(".money-in").classList.add("invalid"); toast("Montant illisible, par exemple 450 ou 12,50"); return; } c.budget = round2(v); }
      else if (ed === "kw") c.kw = t.value.split(",").map((s) => s.trim()).filter(Boolean);
      else if (ed === "active") c.active = t.checked;
      save();
      const open = t.closest("details") && t.closest("details").dataset.id;
      renderBudget();
      if (open) { const d = app.querySelector(`details[data-id="${open}"]`); if (d) d.open = true; }
      toast("Enregistré");
    }
  });

  document.addEventListener("submit", (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.id === "onbForm") {
      onbCollect();
      let bad = null;
      for (const inp of f.querySelectorAll('input[id^="o-"]')) {
        const raw = inp.value.trim(), v = raw ? parseAmount(raw) : 0;
        if (!isFinite(v) || v < 0) { inp.closest(".money-in").classList.add("invalid"); bad = bad || inp; }
      }
      if (onb.step === 1 && !(parseAmount(onb.vals.salaire) > 0)) { const si = document.getElementById("o-salaire"); si.closest(".money-in").classList.add("invalid"); document.getElementById("onbErr").hidden = false; bad = bad || si; }
      if (bad) { bad.focus(); return; }
      if (onb.step < 4) { onb.step++; renderOnboarding(); window.scrollTo(0, 0); const first = app.querySelector('input[id^="o-"]'); if (first) first.focus({ preventScroll: true }); return; }
      const cats = defaultCategories();
      for (const c of cats) { const v = parseAmount(onb.vals[c.id] || "0"); c.budget = isFinite(v) && v > 0 ? round2(v) : 0; }
      const g = parseAmount(onb.vals.goal || "0");
      state = migrate({ v: 2, categories: cats, tx: [], settings: { goal: isFinite(g) && g > 0 ? round2(g) : 0, lastBackup: null, createdAt: new Date().toISOString() } });
      save(); go("mois"); toast("Budget enregistré");
      return;
    }
    if (f.id === "addForm") {
      addForm.touched = true;
      const a = parseAmount(addForm.amount);
      if (!(a > 0)) { renderAjouter(); const i = document.getElementById("addAmount"); i.focus(); i.setAttribute("aria-invalid", "true"); document.getElementById("addAmountErr").hidden = false; return; }
      const date = addForm.date || todayISO();
      const c = cat(addForm.cat);
      if (ymOf(date) > ymNow()) {
        state.events.push({ id: uid(), label: addForm.label.trim() || (c ? c.name : "Prévu"), type: addForm.type, ym: ymOf(date), amount: round2(a), done: false });
        save(); addForm = { type: addForm.type, amount: "", cat: "", label: "", date: todayISO(), note: "", touched: false };
        viewYM = ymOf(date); go("mois"); toast(`Ajouté aux prévisions de ${monthName(ymOf(date))}`); return;
      }
      state.tx.push({ id: uid(), date, label: addForm.label.trim() || (c ? c.name : ""), note: addForm.note.trim(), amount: addForm.type === "out" ? -round2(a) : round2(a), source: "manuel", manualCat: addForm.cat || null });
      sortTx(); save();
      const word = addForm.type === "out" ? "Dépense enregistrée" : "Rentrée enregistrée";
      viewYM = ymOf(date);
      addForm = { type: addForm.type, amount: "", cat: "", label: "", date: todayISO(), note: "", touched: false };
      go("mois"); toast(word);
    }
  });

  document.addEventListener("keydown", (e) => {
    if (!sheetHost.innerHTML) return;
    if (e.key === "Escape") { closeSheet(); return; }
    if (e.key === "Tab") {
      const f = [...sheetHost.querySelectorAll(".sheet button, .sheet input:not([type=hidden]), .sheet select, .sheet textarea, .sheet summary")].filter((x) => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("rect.hit")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
  });

  csvInput.addEventListener("change", () => {
    const file = csvInput.files && csvInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const r = importRevolut(String(reader.result || ""));
        save(); lastImport = r;
        if (r.months.length && !r.months.includes(viewYM)) viewYM = r.months[r.months.length - 1];
        opsFilter = "toutes"; go("operations");
        toast(r.added ? `${r.added} opération${r.added > 1 ? "s" : ""} ajoutée${r.added > 1 ? "s" : ""}` : "Aucune nouvelle opération");
      } catch (err) {
        lastImport = null; renderOperations();
        openSheet(`<h2>Import impossible</h2><p class="hint">${esc(err.message || "Le fichier n'a pas pu être lu.")}</p><div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Fermer</button></div>`, "Import impossible");
      }
    };
    reader.onerror = () => toast("Le fichier n'a pas pu être lu");
    reader.readAsText(file, "utf-8");
  });
  journalInput.addEventListener("change", () => {
    const file = journalInput.files && journalInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const r = importJournal(String(reader.result || ""));
      r.journal = true; save(); lastImport = r; opsFilter = "toutes"; viewYM = ymNow(); go("operations");
      toast(r.added ? `${r.added} paiement${r.added > 1 ? "s" : ""} ajouté${r.added > 1 ? "s" : ""}` : "Aucun nouveau paiement");
    };
    reader.readAsText(file, "utf-8");
  });
  backupInput.addEventListener("change", () => {
    const file = backupInput.files && backupInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { const msg = applyBackup(String(reader.result || "")); if (msg) { if (document.getElementById("rsErr")) showErr("rsErr", msg); else toast(msg); } };
    reader.readAsText(file, "utf-8");
  });
  window.addEventListener("hashchange", () => {
    if (receiveFromHash()) { render(); return; }
    const h = location.hash.replace("#", "");
    if (VIEWS.includes(h) && h !== view) { if (sheetHost.innerHTML) sheetHost.innerHTML = ""; go(h); }
  });

  const h0 = location.hash.replace("#", "");
  if (VIEWS.includes(h0)) view = h0;
  const received = receiveFromHash();
  render();

  // Accès pour les tests automatisés, sans effet pour l'utilisateur
  if (received) render();
  window.__finDeMois = { get bsBlocked() { return budgetSuggestions.blocked; }, coverage, avgDaily, unseen, pace, budgetSuggestions, recurring, importJournal, computeMonth, simulate, importRevolut, classify, suggest, parseAmount, freeToSpend, savingTarget, goalNeed, projection, history, planEnd, applyGroup, merchantGroups, get state() { return state; } };
})();
</script>
