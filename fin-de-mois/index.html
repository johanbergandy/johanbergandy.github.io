<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1118" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fin de mois</title>
</head>
<body>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fin de mois">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Layout : une colonne façon iPhone (max 480px), barre d'onglets fixe en bas.
   L'élément fort : le bloc « fin du mois », dont la couleur dit la situation (à l'aise, juste, dans le rouge).
   Tout le reste est calme : listes groupées, chiffres alignés, une seule couleur d'action. */
:root {
  --bg: #F2F3F5;
  --surface: #FFFFFF;
  --surface-2: #F5F6F8;
  --ink: #0E1726;
  --muted: #5B6474;
  --line: #DCE0E6;
  --accent: #1D3FBF;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4E9FB;
  --calm: #0F5C45;
  --tight: #9A5800;
  --red: #A3221C;
  --hero-ink: #FFFFFF;
  --good: #0F7A4A;
  --good-soft: #DDF1E6;
  --bad: #B42318;
  --bad-soft: #FBE4E1;
  --warn: #8A5200;
  --warn-soft: #FBEFD9;
  --bar: #0E1726;
  --bar-2: #A9B2C0;
  --scrim: rgba(14, 23, 38, .40);
  --font-fig: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r-panel: 18px;
  --r-ctl: 12px;
  --tabbar-h: 58px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1118; --surface: #151B25; --surface-2: #1B2230; --ink: #E9EDF3; --muted: #98A2B3; --line: #283142;
    --accent: #8FA6FF; --accent-ink: #0C1118; --accent-soft: #1E2947;
    --calm: #145C47; --tight: #855000; --red: #8E211B; --hero-ink: #F4F7FA;
    --good: #5FD39A; --good-soft: #123326; --bad: #FF8A7A; --bad-soft: #3A1915; --warn: #F2B860; --warn-soft: #33260F;
    --bar: #E9EDF3; --bar-2: #4A5568; --scrim: rgba(0, 0, 0, .58);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1118; --surface: #151B25; --surface-2: #1B2230; --ink: #E9EDF3; --muted: #98A2B3; --line: #283142;
  --accent: #8FA6FF; --accent-ink: #0C1118; --accent-soft: #1E2947;
  --calm: #145C47; --tight: #855000; --red: #8E211B; --hero-ink: #F4F7FA;
  --good: #5FD39A; --good-soft: #123326; --bad: #FF8A7A; --bad-soft: #3A1915; --warn: #F2B860; --warn-soft: #33260F;
  --bar: #E9EDF3; --bar-2: #4A5568; --scrim: rgba(0, 0, 0, .58);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.4;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; }

.app {
  max-width: 480px; margin-inline: auto; padding-inline: 16px;
  padding-block: 8px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 28px);
  display: flex; flex-direction: column; gap: 22px;
}

/* En-têtes */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 4px; min-height: 52px; }
.top h1 { margin: 0; font-family: var(--font-fig); font-stretch: 80%; font-size: 28px; font-weight: 750; letter-spacing: -.005em; line-height: 1.05; }
.top p { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 6px 0 0; border: 0; background: none; color: var(--accent); font-size: 16px; font-weight: 500; }
.back svg { width: 20px; height: 20px; }
.mnav { display: flex; gap: 6px; }
.iconbtn { min-width: 44px; min-height: 44px; display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 50%; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn[disabled] { opacity: .35; cursor: default; }

/* Bloc fin du mois */
.hero {
  width: 100%; border: 0; text-align: left; color: var(--hero-ink); background: var(--calm);
  border-radius: 24px; padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px;
  transition: background .35s var(--ease);
}
.hero[data-mood="tight"] { background: var(--tight); }
.hero[data-mood="red"] { background: var(--red); }
.hero .row1 { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.hero .lead { margin: 0; font-size: 15px; opacity: .9; }
.hero .mood { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.18); white-space: nowrap; }
.big {
  margin: 2px 0 0; font-family: var(--font-fig); font-stretch: 62%; font-weight: 780; font-size: clamp(72px, 24vw, 108px);
  line-height: .9; letter-spacing: -.01em; font-variant-numeric: tabular-nums lining-nums;
}
.hero .split { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 14px; opacity: .92; }
.hero .split b { font-weight: 650; font-variant-numeric: tabular-nums; }
.hero .more { font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; margin-top: 4px; }

/* Libre à dépenser */
.free { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; background: var(--surface); border-radius: var(--r-panel); padding: 14px 16px; border: 0; width: 100%; text-align: left; }
.free .t { font-size: 14px; color: var(--muted); }
.free .v { font-family: var(--font-fig); font-stretch: 72%; font-weight: 750; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.free .s { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
.free svg { width: 18px; height: 18px; color: var(--muted); }

/* Réglette du mois */
.ruler { position: relative; height: 46px; }
.ruler .track { position: absolute; left: 0; right: 0; top: 20px; height: 6px; border-radius: 3px; background: var(--line); }
.ruler .done { position: absolute; left: 0; top: 20px; height: 6px; border-radius: 3px; background: var(--ink); }
.ruler .pin { position: absolute; top: 16px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid var(--ink); background: var(--bg); }
.ruler .pin.paid { background: var(--ink); }
.ruler .pin b { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; color: var(--muted); }
.ruler .daylbl { position: absolute; top: 31px; font-size: 11px; color: var(--muted); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.ruler .today { position: absolute; top: 12px; width: 3px; height: 22px; margin-left: -1.5px; border-radius: 2px; background: var(--accent); }

/* Fraîcheur des données */
.fresh { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); padding: 2px 2px 0; }
.fresh b { color: var(--ink); }
.fresh.late span { color: var(--warn); }
.fresh.ok { grid-template-columns: 1fr; }
.sub.pace-over { color: var(--warn); font-weight: 600; }
.guide ol, .guide ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.guide ul { margin-top: 6px; gap: 6px; }
.guide code, .hint code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; overflow-wrap: anywhere; }
.copyline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }

/* Sections et listes */
.section { display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-title { margin: 0; font-family: var(--font-fig); font-stretch: 85%; font-size: 20px; font-weight: 720; }
.section-head span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hint { margin: 0; font-size: 14px; color: var(--muted); }
.rows { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-panel); overflow: hidden; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; align-items: center;
  padding: 12px 16px; border: 0; border-top: 1px solid var(--line); min-height: 56px; text-align: left; background: transparent; width: 100%;
}
.rows > .row:first-child, .rows > :first-child { border-top: 0; }
.row.lead-icon { grid-template-columns: 40px minmax(0, 1fr) auto; }
.row .name { font-size: 16px; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.row .sub { font-size: 13px; color: var(--muted); grid-column: 1; min-width: 0; overflow-wrap: anywhere; }
.row.lead-icon .sub { grid-column: 2; }
.row .amt { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row .amt.in { color: var(--good); }
.row .amt.muted { color: var(--muted); font-weight: 500; }
.row .state { font-size: 13px; text-align: right; white-space: nowrap; }
.row .chev { width: 16px; height: 16px; color: var(--muted); }
.state.paid { color: var(--good); }
.state.todo { color: var(--muted); }
.state.over { color: var(--bad); font-weight: 600; }
.state.near { color: var(--warn); font-weight: 600; }
.daybox {
  width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center; font-family: var(--font-fig); font-stretch: 75%; font-weight: 750; font-size: 18px; font-variant-numeric: tabular-nums; grid-row: span 2;
}
.daybox small { display: block; font-family: var(--font-ui); font-size: 9px; font-weight: 600; color: var(--muted); margin-top: -4px; text-transform: lowercase; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
.bar i.near { background: var(--warn); }
.bar i.over { background: var(--bad); }
.tag { font-size: 13px; color: var(--muted); }
.tag.todo { color: var(--warn); font-weight: 600; }
.tag.sugg { color: var(--accent); font-weight: 600; }
.daygroup { font-size: 13px; font-weight: 600; color: var(--muted); padding: 12px 4px 6px; }
.note { font-size: 13px; color: var(--muted); font-style: italic; }

.callout {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 16px; min-height: 52px;
  border-radius: 14px; background: var(--warn-soft); color: var(--ink); border: 0; width: 100%; text-align: left; font-size: 15px;
}
.callout.bad { background: var(--bad-soft); }
.callout b { font-weight: 650; }
.callout svg { width: 18px; height: 18px; color: var(--muted); }
.banner { padding: 12px 14px; border-radius: 14px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--warn-soft); }
.banner.bad { background: var(--bad-soft); }
.banner .btn { min-height: 40px; width: auto; align-self: flex-start; font-size: 15px; }

/* Panneaux et champs */
.panel { background: var(--surface); border-radius: var(--r-panel); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.panel h2, .panel h3 { margin: 0; font-size: 17px; font-weight: 700; }
.amount-field { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); padding-bottom: 2px; }
.amount-field:focus-within { border-color: var(--accent); }
.amount-field input {
  flex: 1; min-width: 0; border: 0; background: transparent; outline: none; padding: 0;
  font-family: var(--font-fig); font-stretch: 75%; font-weight: 720; font-size: 44px; line-height: 1.1; font-variant-numeric: tabular-nums;
}
.amount-field input::placeholder { color: var(--line); }
.amount-field .cur { font-family: var(--font-fig); font-stretch: 75%; font-size: 30px; font-weight: 600; color: var(--muted); }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  position: relative; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line);
  background: var(--surface-2); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center;
}
.chip[aria-pressed="true"], .chip:has(input:checked) { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip.sugg { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .flabel { font-size: 14px; font-weight: 600; }
.field input[type="text"], .field input[type="search"], .field input[type="date"], .field input[type="month"], .field select, .field textarea, .input {
  min-height: 44px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface-2);
  padding: 10px 12px; font-size: 16px; width: 100%; min-width: 0;
}
.field textarea { min-height: 96px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.field .err, .err { margin: 0; font-size: 14px; color: var(--bad); }
[aria-invalid="true"] { border-color: var(--bad) !important; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.switch span { font-size: 15px; }
.switch small { display: block; color: var(--muted); font-size: 13px; }
.switch input {
  appearance: none; -webkit-appearance: none; flex: none; width: 51px; height: 31px; border-radius: 16px;
  background: var(--line); position: relative; transition: background .2s;
}
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s var(--ease); }
.switch input:checked { background: var(--good); }
.switch input:checked::after { transform: translateX(20px); }
.money-in { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface-2); min-height: 44px; padding-right: 10px; }
.money-in input { width: 100%; min-width: 0; border: 0; background: transparent; padding: 10px; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; outline: none; }
.money-in span { color: var(--muted); }
.money-in:focus-within { border-color: var(--accent); }
.money-in.invalid { border-color: var(--bad); }
.money-row { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 10px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--line); min-height: 56px; }
.rows > .money-row:first-child { border-top: 0; }
.money-row label { font-size: 16px; overflow-wrap: anywhere; }
.money-row label small { display: block; font-size: 13px; color: var(--muted); }

.btn {
  min-height: 48px; border-radius: 14px; border: 1px solid transparent; padding: 0 18px; width: 100%;
  font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .12s var(--ease);
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.secondary { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.link { background: transparent; color: var(--accent); min-height: 44px; width: auto; padding: 0 4px; }
.btn.small { min-height: 40px; width: auto; font-size: 15px; padding: 0 14px; }
.btn-row { display: flex; gap: 10px; }
.btn-row > * { flex: 1; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { min-height: 40px; border: 0; border-radius: 9px; background: transparent; font-size: 14px; font-weight: 600; color: var(--muted); padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }

.summary { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 12px; font-size: 15px; margin: 0; }
.summary dt { color: var(--muted); min-width: 0; }
.summary dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.summary .total { color: var(--ink); font-weight: 700; border-top: 1px solid var(--line); padding-top: 8px; }
.summary dd.total { font-family: var(--font-fig); font-stretch: 75%; font-size: 22px; }
.summary .grp { grid-column: 1 / -1; font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 6px; }

/* Simulateur */
.answer { background: var(--ink); color: var(--bg); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.answer .t { margin: 0; font-size: 15px; opacity: .85; }
.answer .v { margin: 0; font-family: var(--font-fig); font-stretch: 62%; font-weight: 780; font-size: clamp(60px, 20vw, 88px); line-height: .92; font-variant-numeric: tabular-nums; }
.answer .s { margin: 0; font-size: 14px; opacity: .85; }
.scen { border: 1px solid var(--line); }
.scen-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.scen-head h3 { font-family: var(--font-fig); font-stretch: 85%; font-size: 19px; }
.scen-res { background: var(--surface-2); border-radius: var(--r-ctl); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.scen-res .l { margin: 0; font-size: 14px; color: var(--muted); }
.scen-res .f { margin: 0; font-family: var(--font-fig); font-stretch: 70%; font-weight: 760; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.scen-res .f.neg { color: var(--bad); }
.flag { margin: 0; font-size: 14px; font-weight: 600; padding: 8px 10px; border-radius: 10px; }
.flag.ok { background: var(--good-soft); color: var(--good); }
.flag.ko { background: var(--bad-soft); color: var(--bad); }
.flag.info { background: var(--accent-soft); color: var(--ink); font-weight: 500; }

/* Barres horizontales (comparaisons) */
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; }
.hbar .k { font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.hbar .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hbar .v.neg { color: var(--bad); }
.hbar .track { grid-column: 1 / -1; height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.hbar .track i { display: block; height: 100%; border-radius: 5px; background: var(--bar); transition: width .3s var(--ease); }
.hbar.base .track i { background: var(--bar-2); }
.hbar.neg .track i { background: var(--bad); }

/* Graphique en colonnes */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--muted); stroke-width: 1; }
.chart .lbl { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); }
.chart .val { fill: var(--ink); font-size: 12px; font-weight: 700; font-family: var(--font-ui); }
.chart .colbar { fill: var(--bar); }
.chart .colbar.neg { fill: var(--bad); }
.chart .colbar.dim { fill: var(--bar-2); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit:focus-visible { outline: none; stroke: var(--accent); stroke-width: 2; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-weight: 600; color: var(--muted); font-size: 13px; padding: 6px 0; }
.table th:not(:first-child), .table td:not(:first-child) { text-align: right; }
.table td { padding: 8px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.table td.neg { color: var(--bad); }
.table td.pos { color: var(--good); }

<script>
(function () {
  "use strict";

  /* ================= Utilitaires ================= */
  const KEY = "fin-de-mois.v1";
  const APP_ID = "fin-de-mois";
  const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const MONTHS_S = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  const DAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  const fmt2 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
  const fmt0 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0, minimumFractionDigits: 0 });
  const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
  const eur = (n) => fmt2.format(round2(n));
  const eur0 = (n) => fmt0.format(Math.round(n));
  const sgn = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + eur(Math.abs(n));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const pad = (n) => String(n).padStart(2, "0");
  const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = () => isoOf(new Date());
  const ymOf = (iso) => String(iso).slice(0, 7);
  const ymNow = () => ymOf(todayISO());
  const ymShift = (ym, k) => { let [y, m] = ym.split("-").map(Number); m += k; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; };
  const ymDiff = (a, b) => { const [ya, ma] = a.split("-").map(Number); const [yb, mb] = b.split("-").map(Number); return (yb - ya) * 12 + (mb - ma); };
  const daysIn = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
  const monthName = (ym) => { const [y, m] = ym.split("-").map(Number); return `${MONTHS[m - 1]} ${y}`; };
  const monthShort = (ym) => MONTHS_S[Number(ym.slice(5)) - 1];
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const dayLabel = (iso) => { const [y, m, d] = iso.split("-").map(Number); const dt = new Date(y, m - 1, d); return `${cap(DAYS[dt.getDay()])} ${d} ${MONTHS[m - 1]}`; };
  const shortDate = (iso) => { const [, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]}`; };
  const reduced = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };

  function parseAmount(v) {
    if (typeof v === "number") return isFinite(v) ? v : NaN;
    let s = String(v ?? "").replace(/eur/gi, "").replace(/[\s  €]/g, "");
    if (!s) return NaN;
    if (s.includes(",") && s.includes(".")) {
      if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", ".");
      else s = s.replace(/,/g, "");
    } else s = s.replace(",", ".");
    if (!/^[+-]?\d*\.?\d+$/.test(s)) return NaN;
    return Number(s);
  }
  const amountText = (n) => (n ? String(round2(n)).replace(".", ",") : "");

  /* ================= Données ================= */
  function defaultCategories() {
    return [
      { id: "salaire", name: "Salaire", kind: "revenu", budget: 0, kw: [], active: true },
      { id: "loyer", name: "Loyer et charges", kind: "fixe", budget: 0, kw: [], active: true },
      { id: "edf", name: "EDF", kind: "fixe", budget: 0, kw: ["EDF"], active: true },
      { id: "sport", name: "Salle de sport", kind: "fixe", budget: 0, kw: [], active: true },
      { id: "gmf", name: "GMF", kind: "fixe", budget: 0, kw: ["Gmf"], active: true },
      { id: "revolut", name: "Revolut", kind: "fixe", budget: 0, kw: ["abonnement Metal"], active: true },
      { id: "voiture", name: "Voiture (LLD)", kind: "fixe", budget: 0, kw: [], active: false },
      { id: "nourriture", name: "Nourriture", kind: "enveloppe", budget: 0, kw: ["Intermarché"], active: true },
      { id: "essence", name: "Essence", kind: "enveloppe", budget: 0, kw: ["Total", "Esso"], active: true },
      { id: "sorties", name: "Sorties et loisirs", kind: "enveloppe", budget: 0, kw: [], active: true },
      { id: "especes", name: "Espèces", kind: "enveloppe", budget: 0, kw: ["Retrait d'espèces"], active: true },
    ];
  }

  let storageOK = true;
  let state = load();

  function validState(s) {
    return s && typeof s === "object" && Array.isArray(s.categories) && Array.isArray(s.tx) && s.settings && typeof s.settings === "object";
  }
  function migrate(s) {
    if (!Array.isArray(s.events)) s.events = [];
    if (!Array.isArray(s.goals)) s.goals = [];
    if (!Array.isArray(s.cars)) s.cars = [];
    if (typeof s.settings.goal !== "number") s.settings.goal = 0;
    if (typeof s.settings.alertPct !== "number") s.settings.alertPct = 0.8;
    if (typeof s.settings.estimate !== "boolean") s.settings.estimate = true;
    if (!Array.isArray(s.settings.ignoredSugg)) s.settings.ignoredSugg = [];
    s.v = 2;
    return s;
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return validState(s) ? migrate(s) : null;
    } catch (e) { storageOK = false; return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; }
    catch (e) { storageOK = false; }
    try { if (navigator.storage && navigator.storage.persist && !save._asked) { save._asked = true; navigator.storage.persist().catch(() => {}); } } catch (e) {}
  }

  const cat = (id) => (state ? state.categories.find((c) => c.id === id) : null);
  const KIND = { revenu: "Rentrées", fixe: "Charges fixes", enveloppe: "Enveloppes" };

  /* ================= Classement ================= */
  function ruleMatch(label) {
    const l = norm(label);
    let best = null, len = 0;
    for (const c of state.categories) for (const k of c.kw || []) {
      const nk = norm(k);
      if (nk && l.includes(nk) && nk.length > len) { best = c.id; len = nk.length; }
    }
    return best;
  }
  function classify(tx) {
    if (tx.manualCat !== undefined && tx.manualCat !== null && (tx.manualCat === "hors" || cat(tx.manualCat))) return tx.manualCat;
    const r = ruleMatch(tx.label);
    if (r) return r;
    if (tx.amount > 0) return "hors";
    return null;
  }

  // Suggestions : d'abord ce que tu as déjà classé, ensuite des mots courants
  const DICT = {
    nourriture: ["supermarche", "supermarket", "carrefour", "auchan", "leclerc", "lidl", "aldi", "franprix", "monoprix", "intermarche", "coccinelle", "super u", "hyper u", "boulangerie", "mie caline", "primeur", "prim o", "fruits", "picard", "biocoop", "netto", "grand frais", "epicerie", "boucherie", "g20", "spar", "proxi"],
    essence: ["totalenergies", "total", "esso", "shell", "avia", "carburant", "agip"],
    sorties: ["restaurant", "resto", "cafe", "brasserie", "pizz", "kebab", "burger", "mcdonald", "kfc", "uber eats", "deliveroo", "cinema", "bowling", "bistro", "sushi", "creperie"],
  };
  const wordStart = (hay, needle) => new RegExp("(^|[^a-z0-9])" + needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(hay);
  function suggest(tx) {
    const l = norm(tx.label);
    const first = l.split(/[^a-z0-9]+/).find((w) => w.length >= 4);
    if (first) {
      const other = state.tx.find((o) => o !== tx && o.amount < 0 && wordStart(norm(o.label), first) && (() => { const k = classify(o); return k && k !== "hors"; })());
      if (other) return { id: classify(other), why: "comme « " + other.label + " »" };
    }
    for (const [id, words] of Object.entries(DICT)) {
      if (!cat(id)) continue;
      if (words.some((w) => wordStart(l, w))) return { id, why: "mot courant" };
    }
    return null;
  }

  function usualDay(c) {
    let latest = null;
    for (const t of state.tx) if (classify(t) === c.id && t.amount < 0 && (!latest || t.date > latest)) latest = t.date;
    return latest ? Number(latest.slice(8, 10)) : null;
  }

  /* ================= Calculs ================= */
  // carMonthly : loyer d'une voiture simulée, ajouté au mois si la voiture du budget n'est pas encore comptée
  const LIVE = ["manuel", "applepay"];
  // Dernier jour couvert par un relevé Revolut importé
  function coverage() {
    let last = null;
    for (const t of state.tx) if (t.source === "revolut" && (!last || t.date > last)) last = t.date;
    return last;
  }
  // Mois complets (salaire reçu) : la base des moyennes
  function completeMonths(max = 3) {
    const months = [...new Set(state.tx.map((t) => ymOf(t.date)))].filter((ym) => ym < ymNow()).sort();
    return months.filter((ym) => computeMonth(ym, { raw: true }).lines.some((l) => l.c.kind === "revenu" && l.actual > 0)).slice(-max);
  }
  // Dépense courante moyenne par jour (enveloppes + non classé), hors charges fixes
  function avgDaily() {
    const ms = completeMonths();
    if (!ms.length) return null;
    const per = ms.map((ym) => { const m = computeMonth(ym, { raw: true }); const env = m.lines.filter((l) => l.c.kind === "enveloppe").reduce((a, l) => a + l.actual, 0); return (env + m.uncl) / daysIn(ym); });
    return round2(per.reduce((a, b) => a + b, 0) / per.length);
  }
  function unseen() {
    const ym = ymNow();
    const last = coverage();
    const avg = avgDaily();
    if (!last) return { last: null, avg, days: 0, est: 0, logged: 0 };
    const today = todayISO();
    if (last >= today) return { last, avg, days: 0, est: 0, logged: 0 };
    const start = last >= `${ym}-01` ? last : `${ymShift(ym, -1)}-${pad(daysIn(ymShift(ym, -1)))}`;
    const days = Math.max(0, Math.round((new Date(today) - new Date(start)) / 864e5));
    const logged = round2(state.tx.filter((t) => LIVE.includes(t.source) && t.date > last && ymOf(t.date) === ym && t.amount < 0 && (() => { const k = classify(t); return k !== "hors" && !(cat(k) && cat(k).kind === "fixe"); })()).reduce((a, t) => a - t.amount, 0));
    const est = avg === null || state.settings.estimate === false ? 0 : round2(Math.max(0, avg * days - logged));
    return { last, avg, days, est, logged };
  }

  function computeMonth(ym, opts = {}) {
    const now = ymNow();
    const mode = ym < now ? "past" : ym === now ? "current" : "future";
    const txs = state.tx.filter((t) => ymOf(t.date) === ym);
    const per = {}, has = {};
    let uncl = 0, unclCount = 0, hors = 0;
    for (const t of txs) {
      const k = classify(t);
      if (k === "hors") { hors += t.amount; continue; }
      if (k === null) { uncl += -t.amount; unclCount++; continue; }
      per[k] = (per[k] || 0) + t.amount; has[k] = true;
    }
    const lines = state.categories.map((c) => {
      const raw = per[c.id] || 0;
      const actual = round2(c.kind === "revenu" ? raw : -raw);
      const plan = c.active ? c.budget : 0;
      let counted, basis;
      if (mode === "past") { counted = actual; basis = "réel"; }
      else if (c.kind === "enveloppe") { counted = Math.max(actual, plan); basis = actual > plan ? "réel" : "prévu"; }
      else if (has[c.id]) { counted = actual; basis = "réel"; }
      else { counted = plan; basis = "prévu"; }
      return { c, actual, plan, counted: round2(counted), has: !!has[c.id], basis };
    });
    const events = mode === "past" ? [] : state.events.filter((e) => e.ym === ym && !e.done);
    const evIn = round2(events.filter((e) => e.type === "in").reduce((a, e) => a + e.amount, 0));
    const evOut = round2(events.filter((e) => e.type === "out").reduce((a, e) => a + e.amount, 0));
    const sum = (k) => round2(lines.filter((l) => l.c.kind === k).reduce((a, l) => a + l.counted, 0));
    const inc = round2(sum("revenu") + evIn);
    const fix = sum("fixe"), env = sum("enveloppe");
    const car = mode !== "past" && opts.carMonthly ? round2(opts.carMonthly) : 0;
    // Dépenses probablement faites mais pas encore importées : elles remplissent d'abord ce qui reste dans les enveloppes
    let est = null, estOver = 0;
    if (mode === "current" && !opts.raw) {
      est = unseen();
      const rooms = lines.filter((l) => l.c.kind === "enveloppe").reduce((a, l) => a + Math.max(0, l.plan - l.actual), 0);
      estOver = round2(Math.max(0, est.est - rooms));
    }
    const out = round2(fix + env + uncl + evOut + car + estOver);
    return { ym, mode, txs, lines, events, evIn, evOut, inc, fix, env, uncl: round2(uncl), unclCount, hors: round2(hors), car, est, estOver, out, end: round2(inc - out) };
  }

  function pace(m, l) {
    if (m.mode !== "current" || !(l.actual > 0)) return null;
    const day = new Date().getDate();
    if (day < 5) return null;
    return round2((l.actual / day) * daysIn(m.ym));
  }
  function budgetSuggestions() {
    const ms = completeMonths();
    if (!ms.length) return [];
    const months = ms.map((ym) => computeMonth(ym, { raw: true }));
    const spent = months.reduce((a, m) => a + m.lines.filter((l) => l.c.kind !== "revenu").reduce((x, l) => x + l.actual, 0) + m.uncl, 0);
    const uncl = months.reduce((a, m) => a + m.uncl, 0);
    budgetSuggestions.blocked = spent > 0 && uncl / spent > 0.2 ? { uncl: round2(uncl), share: uncl / spent } : null;
    if (budgetSuggestions.blocked) return [];
    const out = [];
    for (const c of state.categories) {
      if (c.kind === "revenu" || !c.active) continue;
      const vals = months.map((m) => m.lines.find((l) => l.c.id === c.id)).filter(Boolean);
      if (c.kind === "fixe" && vals.filter((l) => l.has).length < 2) continue;
      const avg = round2(vals.reduce((a, l) => a + l.actual, 0) / vals.length);
      if (c.kind === "enveloppe" && avg === 0) continue;
      const diff = round2(avg - c.budget);
      if (Math.abs(diff) < Math.max(10, c.budget * 0.1)) continue;
      const key = `${c.id}:${Math.round(avg)}`;
      if (state.settings.ignoredSugg.includes(key)) continue;

  function recurring() {
    const g = new Map();

      const k = classify(t);
      if (k === "hors" || (cat(k) && cat(k).kind === "fixe")) continue;
      const key = norm(t.label);
      if (!key) continue;
      if (!g.has(key)) g.set(key, { label: t.label, months: new Map() });

      if (avg < 5 || vals.some((v) => Math.abs(v - avg) > avg * 0.05)) continue;

    }
    return out;
  }

  function planEnd() {
    const s = (k) => state.categories.filter((c) => c.kind === k && c.active).reduce((a, c) => a + c.budget, 0);

  function goalNeed(g) {

    if ((t > 0 && m.end < t) || (t === 0 && m.inc > 0 && m.end < m.inc * 0.1)) return { key: "tight", label: "Juste" };

  // Effet d'une dépense : une enveloppe absorbe ce qui lui reste, le surplus réduit la fin du mois

    const impact = round2(a - inside);
    return { a, impact, inside: round2(inside), room: room === null ? null : round2(room), end: round2(m.end - impact) };

  function carOptions() {

  /* ================= Import Revolut ================= */
  function parseCSV(text) {
    text = text.replace(/^﻿/, "");
    const first = text.split(/\r?\n/)[0] || "";
    const counts = { ",": (first.match(/,/g) || []).length, ";": (first.match(/;/g) || []).length, "\t": (first.match(/\t/g) || []).length };
    const sep = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === sep) { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows.filter((r) => r.some((c) => c.trim() !== ""));
  }
  const HEAD = {
    date: ["date de debut", "started date", "date de fin", "completed date", "date"],
    label: ["description", "libelle"], amount: ["montant", "amount"], fee: ["frais", "fee"], status: ["etat", "state", "statut"],
  };
  function parseDate(s) {
    s = String(s || "").trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);
    if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    return null;
  }
  function importRevolut(text) {
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error("Le fichier ne contient aucune opération.");
    const head = rows[0].map(norm);
    const idx = {};
    for (const [k, names] of Object.entries(HEAD)) idx[k] = names.map((n) => head.indexOf(n)).find((i) => i >= 0);
    if (idx.label === undefined || idx.amount === undefined || idx.date === undefined)
      throw new Error("Ce fichier ne ressemble pas à un relevé Revolut : les colonnes Description, Montant et Date sont introuvables.");
    const known = new Set(state.tx.map((t) => t.key).filter(Boolean));
    const res = { read: 0, added: 0, dup: 0, reverted: 0, pending: 0, unreadable: 0, other: 0, merged: 0, months: new Set() };
    const added = [];
    for (const r of rows.slice(1)) {
      res.read++;
      const status = idx.status !== undefined ? norm(r[idx.status]) : "termine";
      const rawDate = (r[idx.date] || "").trim();
      const date = parseDate(rawDate);
      const amt = parseAmount(r[idx.amount]);
      const fee = idx.fee !== undefined && String(r[idx.fee] ?? "").trim() !== "" ? parseAmount(r[idx.fee]) : 0;
      if (["renvoye", "reverted", "annule", "declined", "refuse"].includes(status)) { res.reverted++; continue; }
      if (status === "en attente" || status === "pending") { res.pending++; continue; }
      if (status !== "termine" && status !== "completed") { res.other++; continue; }
      if (!date || !isFinite(amt) || !isFinite(fee)) { res.unreadable++; continue; }
      const label = (r[idx.label] || "").trim();
      const key = `${rawDate}|${label}|${r[idx.amount]}|${idx.fee !== undefined ? r[idx.fee] : ""}`;
      if (known.has(key)) { res.dup++; continue; }
      known.add(key);
      added.push({ id: uid(), date, label, amount: round2(amt - fee), source: "revolut", key });
      res.months.add(ymOf(date));
    }
    for (const t of added) {
      const twin = state.tx.find((m) => LIVE.includes(m.source) && !m._used && Math.abs(m.amount - t.amount) < 0.005 && Math.abs((new Date(m.date) - new Date(t.date)) / 864e5) <= 3);
      if (twin) {
        twin._used = true;
        const k = classify(t);
        if ((k === null || k === "hors") && twin.manualCat) t.manualCat = twin.manualCat;
        if (twin.note) t.note = twin.note;
        res.merged++;
      }
    }
    state.tx = state.tx.filter((m) => !m._used).concat(added);
    sortTx();
    if (added.length) state.settings.lastImportAt = new Date().toISOString();
    res.added = added.length;
    res.months = [...res.months].sort();
    return res;
  }
  // Une ligne du journal : 2026-10-08|14:32|Intermarché|12,50 €
  function addApplePay(date, time, label, amountRaw, known) {
    const a = parseAmount(amountRaw);
    const d = parseDate(date) || null;
    if (!d || !isFinite(a) || a === 0 || !label) return "bad";
    const key = `ap|${d}|${time || ""}|${norm(label)}|${Math.abs(a).toFixed(2)}`;
    if (known.has(key)) return "dup";
    known.add(key);
    const covered = coverage();
    state.tx.push({ id: uid(), date: d, label: label.trim(), amount: -round2(Math.abs(a)), source: "applepay", key, time: time || "" });
    return covered && d <= covered ? "old" : "ok";
  }
  function importJournal(text) {
    const known = new Set(state.tx.map((t) => t.key).filter(Boolean));
    const res = { read: 0, added: 0, dup: 0, unreadable: 0, old: 0 };
    for (const raw of String(text).replace(/^\ufeff/, "").split(/\r?\n/)) {
      const line = raw.trim();
      if (!line) continue;
      res.read++;
      const parts = line.split("|").map((x) => x.trim());
      let d, tm, lab, am;
      if (parts.length >= 4) [d, tm, lab, am] = parts; else if (parts.length === 3) [d, lab, am] = parts; else { res.unreadable++; continue; }
      const r = addApplePay(d, tm, lab, am, known);
      if (r === "bad") res.unreadable++; else if (r === "dup") res.dup++; else { res.added++; if (r === "old") res.old++; }
    }
    // Les paiements déjà couverts par un relevé importé seraient comptés deux fois : on les retire
    if (res.old) {
      const covered = coverage();
      const before = state.tx.length;
      state.tx = state.tx.filter((t) => !(t.source === "applepay" && t.date <= covered && state.tx.some((r) => r.source === "revolut" && Math.abs(r.amount - t.amount) < 0.005 && Math.abs((new Date(r.date) - new Date(t.date)) / 864e5) <= 3)));

    }

    return res;
  }

      else sub = p.day ? (p.day < dayNow ? "Pas encore passé, d'habitude le " + p.day : "Date habituelle") : "Date inconnue, elle s'affichera après un import";
      return `<div class="row lead-icon"><span class="daybox">${p.day ? `${p.day}<small>${monthShort(m.ym)}</small>` : "?"}</span>
      <span class="name">${esc(p.c.name)}</span><span class="amt num">${eur(p.amount)}</span><span class="sub">${sub}</span></div>`;
    }).join("");
    const desc = `Jour ${dayNow} sur ${dim}. ${pins.filter((p) => p.paid).length} charges payées, ${upcoming.length} à venir.`;
    return `<section class="section" aria-label="Charges fixes du mois">
      <div class="ruler" role="img" aria-label="${esc(desc)}"><span class="track"></span><span class="done" style="width:${(dayNow / dim) * 100}%"></span>${marks}<span class="today" style="left:${pct(dayNow)}%"></span>${ticks}</div>
      <div class="section-head"><h2 class="section-title">Charges fixes</h2><span>${upcoming.length ? `${eur0(total)} encore à passer` : "toutes passées"}</span></div>${rows ? `<div class="rows">${rows}</div>` : ""}
    </section>`;
  }

  function renderFreshness(m) {
    const u = m.est;
    if (!u || !u.last) return `<div class="fresh"><span>Aucun relevé importé. Les chiffres ne comptent que ce que tu as saisi.</span><button class="btn small secondary" data-act="importCsv">Importer</button></div>`;
    const lastTxt = `Relevé importé jusqu'au ${shortDate(u.last)}`;
    if (!u.days) return `<div class="fresh ok"><span>${lastTxt}. Tout est à jour.</span></div>`;
    let t = `${lastTxt}, il y a ${u.days} jour${u.days > 1 ? "s" : ""}.`;
    if (u.avg === null) t += " Pas encore de mois complet pour estimer ce qui manque.";
    else if (state.settings.estimate === false) t += " Estimation désactivée dans Budget et catégories.";
    else t += ` Dépenses probables depuis : <b>${eur0(u.est)}</b> (${eur(u.avg)} par jour en moyenne${u.logged ? `, moins ${eur(u.logged)} déjà saisis` : ""})${m.estOver ? `, dont ${eur0(m.estOver)} au-delà de tes enveloppes` : ", couvertes par tes enveloppes"}.`;
    return `<div class="fresh ${u.days > 7 ? "late" : ""}"><span>${t}</span><button class="btn small secondary" data-act="importCsv">Importer</button></div>`;
  }

  function renderAlerts(m) {
    let html = "";
    if (m.mode === "current") {
      const pct = state.settings.alertPct || 0.8;
      for (const l of m.lines) {
        if (l.c.kind !== "enveloppe" || !(l.plan > 0)) continue;
        const pc = pace(m, l);
        if (l.actual > l.plan) html += `<div class="callout bad"><span><b>${esc(l.c.name)}</b> : enveloppe dépassée de ${eur(l.actual - l.plan)}. Le dépassement réduit ta fin de mois.</span></div>`;
        else if (l.actual >= l.plan * pct) html += `<div class="callout"><span><b>${esc(l.c.name)}</b> : ${Math.round((l.actual / l.plan) * 100)} % de l'enveloppe utilisés, il reste ${eur(l.plan - l.actual)}.</span></div>`;
        else if (pc && pc > l.plan * 1.05) html += `<div class="callout"><span><b>${esc(l.c.name)}</b> : à ce rythme, tu finiras le mois à ${eur0(pc)} pour ${eur0(l.plan)} prévus.</span></div>`;
      }
      const bs = budgetSuggestions();
      if (bs.length) html += `<button class="callout" style="background:var(--accent-soft)" data-act="budgetSugg"><span><b>${bs.length} budget${bs.length > 1 ? "s" : ""} ne colle${bs.length > 1 ? "nt" : ""} pas à tes dépenses réelles.</b> Voir les montants proposés.</span>${ICON.chev}</button>`;
    }
    if (m.unclCount) html += `<button class="callout" data-act="goUncl"><span><b>${m.unclCount} opération${m.unclCount > 1 ? "s" : ""} à classer</b> pour ${eur(m.uncl)}. Elles comptent déjà dans tes dépenses.</span>${ICON.chev}</button>`;
    return html;
  }

  function renderEcarts(m) {
    const rows = m.lines.filter((l) => l.plan > 0 || l.actual !== 0).map((l) => {
      const d = l.c.kind === "revenu" ? round2(l.actual - l.plan) : round2(l.plan - l.actual);
      return `<tr><td>${esc(l.c.name)}</td><td>${eur0(l.plan)}</td><td>${eur0(l.actual)}</td><td class="${d < 0 ? "neg" : d > 0 ? "pos" : ""}">${d === 0 ? "=" : sgn(d)}</td></tr>`;
    }).join("");
    const unc = m.uncl ? `<tr><td>Non classé</td><td>${eur0(0)}</td><td>${eur0(m.uncl)}</td><td class="neg">${sgn(-m.uncl)}</td></tr>` : "";
    const plan = planEnd();
    const d = round2(m.end - plan);
    return `<section class="section"><div class="section-head"><h2 class="section-title">Prévu et réel</h2><span>${d >= 0 ? "+" : "−"}${eur0(Math.abs(d))} sur le reste</span></div>
      <div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Poste</th><th>Prévu</th><th>Réel</th><th>Écart</th></tr></thead><tbody>${rows}${unc}
      <tr><td><b>Reste du mois</b></td><td><b>${eur0(plan)}</b></td><td><b>${eur0(m.end)}</b></td><td class="${d < 0 ? "neg" : "pos"}"><b>${sgn(d)}</b></td></tr></tbody></table></div>
      <p class="hint">Écart positif : mieux que prévu. Le prévu reprend ton budget actuel.</p></div></section>`;
  }

  function renderEnvelopes(m) {
    const envs = m.lines.filter((l) => l.c.kind === "enveloppe" && (l.plan > 0 || l.actual !== 0));
    if (!envs.length) return "";
    const pctA = state.settings.alertPct || 0.8;
    const rows = envs.map((l) => {
      const b = l.plan, over = b > 0 && l.actual > b, near = !over && b > 0 && l.actual >= b * pctA;
      const pct = b > 0 ? Math.min(100, (l.actual / b) * 100) : (l.actual > 0 ? 100 : 0);
      const st = b <= 0 ? `<span class="state todo">sans budget</span>` : over ? `<span class="state over">dépassé de ${eur(l.actual - b)}</span>` : `<span class="state ${near ? "near" : "todo"}">reste ${eur(b - l.actual)}</span>`;
      const pc = pace(m, l);
      const sub = !l.has ? "Rien de dépensé" : pc ? `À ce rythme : ${eur0(pc)} fin du mois` : "";
      return `<div class="row"><span class="name">${esc(l.c.name)}</span><span class="amt num">${eur(l.actual)}${b > 0 ? ` <span class="tag">/ ${eur0(b)}</span>` : ""}</span>
        <div class="bar" aria-hidden="true"><i class="${over ? "over" : near ? "near" : ""}" style="width:${pct}%"></i></div><span class="sub ${pc && b > 0 && pc > b ? "pace-over" : ""}">${sub}</span>${st}</div>`;
    }).join("");
    return `<section class="section"><div class="section-head"><h2 class="section-title">Enveloppes</h2><span>dépensé / prévu</span></div><div class="rows">${rows}</div></section>`;
  }

  function renderFixed(m) {
    const fix = m.lines.filter((l) => l.c.kind === "fixe" && (l.c.active || l.has) && (l.plan > 0 || l.has));
    if (!fix.length) return "";
    const rows = fix.map((l) => {
      let st;
      if (l.has) st = `<span class="state paid">Payé le ${Number(m.txs.filter((t) => classify(t) === l.c.id).map((t) => t.date).sort().pop().slice(8))}</span>`;
      else if (m.mode === "past") st = `<span class="state over">Non payé</span>`;
      else { const d = usualDay(l.c); st = `<span class="state todo">${d ? `vers le ${d}` : "à venir"}</span>`; }
      const diff = l.has && l.plan > 0 ? round2(l.actual - l.plan) : 0;
      return `<div class="row"><span class="name">${esc(l.c.name)}</span><span class="amt num">${eur(l.has ? l.actual : l.plan)}</span>
        <span class="sub">${l.has && Math.abs(diff) >= 0.01 ? `Prévu ${eur(l.plan)}, ${diff > 0 ? "+" : "−"}${eur(Math.abs(diff))}` : l.has ? "Comme prévu" : "Prévu"}</span>${st}</div>`;
    }).join("");
    return `<section class="section"><div class="section-head"><h2 class="section-title">Charges fixes</h2><span>${eur0(m.fix)}</span></div><div class="rows">${rows}</div></section>`;
  }

  function renderEvents(m) {
    const evs = state.events.filter((e) => e.ym === m.ym);
    if (!evs.length) return "";
    const rows = evs.map((e) => `<button class="row" data-act="editEvent" data-id="${esc(e.id)}"><span class="name">${esc(e.label)}</span>
      <span class="amt num ${e.type === "in" ? "in" : ""} ${e.done ? "muted" : ""}">${e.type === "in" ? "+" : "−"}${eur(e.amount)}</span>
      <span class="sub">${e.done ? "Arrivé, ne compte plus ici" : e.type === "in" ? "Rentrée prévue" : "Dépense prévue"}</span></button>`).join("");
    return `<section class="section"><div class="section-head"><h2 class="section-title">Prévu ce mois-ci</h2><span>${sgn(m.evIn - m.evOut)}</span></div><div class="rows">${rows}</div>
      ${m.mode === "current" ? `<p class="hint">Quand une rentrée ou une dépense prévue apparaît dans tes opérations, marque-la comme arrivée pour ne pas la compter deux fois.</p>` : ""}</section>`;
  }

  function heroDetailSheet() {
    const m = computeMonth(viewYM);
    const grp = (kind) => m.lines.filter((l) => l.c.kind === kind && (l.counted !== 0 || l.has)).map((l) => {
      let why;
      if (m.mode === "past") why = "réel";
      else if (kind === "enveloppe") why = l.actual > l.plan ? `dépensé, au-dessus des ${eur0(l.plan)} prévus` : l.actual > 0 ? `prévu, dont ${eur(l.actual)} déjà dépensés` : "prévu";
      else why = l.has ? (kind === "revenu" ? "reçu" : "payé") : "prévu, pas encore passé";
      return `<dt>${esc(l.c.name)} <span class="tag">(${why})</span></dt><dd>${eur(l.counted)}</dd>`;
    }).join("");
    let html = `<h2>${m.mode === "past" ? "Le reste" : "La fin du mois"} de ${monthName(m.ym)}</h2>
      <p class="meta">${m.mode === "past" ? "Uniquement les opérations réelles." : "Ce qui est passé compte pour son vrai montant, le reste pour ce que tu as prévu."}</p>
      <dl class="summary"><span class="grp">Rentrées</span>${grp("revenu")}${m.events.filter((e) => e.type === "in").map((e) => `<dt>${esc(e.label)} <span class="tag">(prévu)</span></dt><dd>${eur(e.amount)}</dd>`).join("")}
      <span class="grp">Charges fixes</span>${grp("fixe")}
      <span class="grp">Enveloppes</span>${grp("enveloppe")}
      ${m.uncl || m.estOver ? `<span class="grp">Autres</span>` : ""}${m.uncl ? `<dt>À classer (${m.unclCount})</dt><dd>${eur(m.uncl)}</dd>` : ""}
      ${m.estOver ? `<dt>Dépenses probables non importées <span class="tag">(au-delà des enveloppes)</span></dt><dd>${eur(m.estOver)}</dd>` : ""}
      ${m.events.filter((e) => e.type === "out").map((e) => `<dt>${esc(e.label)} <span class="tag">(prévu)</span></dt><dd>${eur(e.amount)}</dd>`).join("")}
      <dt class="total">Rentrées moins dépenses</dt><dd class="total">${eur(m.end)}</dd></dl>
      ${m.hors ? `<p class="hint">${eur(m.hors)} de virements reçus ne sont pas comptés (aides, virements entre comptes).</p>` : ""}
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Fermer</button></div>`;
    openSheet(html, "Détail de la fin du mois");
  }

  /* ================= Vue : Simuler ================= */
  function weekendISO() {
    const d = new Date();
    const wd = d.getDay();
    if (wd === 6 || wd === 0) return isoOf(d);
    d.setDate(d.getDate() + (6 - wd));
    return isoOf(d);
  }
  function scenDate(s) { return s.when === "today" ? todayISO() : s.when === "weekend" ? weekendISO() : (s.date || todayISO()); }

  function renderSimuler() {
    const m = computeMonth(ymNow());
    const f = freeToSpend(m);
    const dim = daysIn(ymNow());
    let html = topBar("Simuler", "Avant de dépenser, vois ce qu'il te restera");
    html += `<section class="answer" aria-label="Réponse rapide"><p class="t">Tu peux encore dépenser</p><p class="v">${eur0(f.total)}</p>
      <p class="s">d'ici le ${dim} ${MONTHS[Number(ymNow().slice(5)) - 1]}, ${f.target > 0 ? `sans toucher aux ${eur0(f.target)} que tu veux mettre de côté` : "sans finir le mois dans le rouge"}.${f.room > 0 ? ` Dont ${eur(f.room)} déjà prévus dans ${esc(f.roomName)}.` : ""}</p>
      ${f.target > 0 && f.margin < 0 ? `<p class="s"><b>Ton épargne prévue est déjà entamée de ${eur(-f.margin)} ce mois-ci.</b></p>` : ""}
      ${f.target === 0 ? `<p class="s">Fixe un objectif d'épargne dans Plus pour le protéger dans ce calcul.</p>` : ""}</section>`;
    html += `<section class="section" aria-label="Comparaison"><div class="section-head"><h2 class="section-title">Comparer</h2><span>fin du mois</span></div><div class="panel"><div class="hbars" id="cmp"></div></div></section>`;
    html += scenarios.map((s, i) => renderScenario(s, i)).join("");
    if (scenarios.length < 3) html += `<button class="btn secondary" data-act="addScen">Ajouter une dépense à comparer</button>`;
    app.innerHTML = html;
    updateSim();
  }

  function renderScenario(s, i) {
    const envs = state.categories.filter((c) => c.kind === "enveloppe");
    const cars = carOptions();
    const opts = envs.map((c) => `<option value="${esc(c.id)}" ${s.cat === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("") + `<option value="__hors" ${s.cat === "__hors" ? "selected" : ""}>Imprévu, hors enveloppe</option>`;
    return `<section class="panel scen" data-sid="${esc(s.id)}" aria-label="${esc(s.name)}">
      <div class="scen-head"><h3>${esc(s.name)}</h3>${scenarios.length > 1 ? `<button class="iconbtn" data-act="delScen" data-sid="${esc(s.id)}" aria-label="Retirer ${esc(s.name)}">${ICON.close}</button>` : ""}</div>
      <div class="amount-field"><label for="sa-${esc(s.id)}" class="sr">Montant de ${esc(s.name)}</label><input id="sa-${esc(s.id)}" data-sf="amount" data-sid="${esc(s.id)}" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(s.amount)}"><span class="cur" aria-hidden="true">€</span></div>
      <div class="quick" role="group" aria-label="Montants rapides">${[20, 50, 100, 200].map((n) => `<button class="chip" data-act="scenQuick" data-sid="${esc(s.id)}" data-v="${n}">${n} €</button>`).join("")}</div>
      <div class="field"><span class="flabel">Quand</span><div class="seg" role="group" aria-label="Quand">
        <button data-act="scenWhen" data-sid="${esc(s.id)}" data-v="today" aria-pressed="${s.when === "today"}">Aujourd'hui</button>
        <button data-act="scenWhen" data-sid="${esc(s.id)}" data-v="weekend" aria-pressed="${s.when === "weekend"}">Ce week-end</button>
        <button data-act="scenWhen" data-sid="${esc(s.id)}" data-v="date" aria-pressed="${s.when === "date"}">Autre date</button></div>
        ${s.when === "date" ? `<label for="sd-${esc(s.id)}" class="sr">Date</label><input type="date" class="input" id="sd-${esc(s.id)}" data-sf="date" data-sid="${esc(s.id)}" value="${esc(s.date || todayISO())}" min="${todayISO()}">` : ""}</div>
      <div class="field"><label for="sc-${esc(s.id)}">Enveloppe</label><select id="sc-${esc(s.id)}" data-sf="cat" data-sid="${esc(s.id)}">${opts}</select></div>
      ${cars.length ? `<div class="field"><label for="sv-${esc(s.id)}">Voiture</label><select id="sv-${esc(s.id)}" data-sf="car" data-sid="${esc(s.id)}"><option value="">Sans changement</option>${cars.map((o) => `<option value="${esc(o.id)}" ${s.car === o.id ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select></div>` : ""}
      <div class="scen-res" id="res-${esc(s.id)}" aria-live="polite"></div>
      <button class="btn primary" data-act="scenSave" data-sid="${esc(s.id)}">Enregistrer cette dépense</button>
    </section>`;
  }

  function scenResult(s) {
    const date = scenDate(s);
    const ym = ymOf(date);
    const base = computeMonth(ym);
    const m = s.car ? computeMonth(ym, { carMonthly: carMonthlyOf(s.car) }) : base;
    const r = simulate(m, parseAmount(s.amount), s.cat === "__hors" ? null : s.cat);
    return { date, ym, base, m, r, active: r.a > 0 || !!s.car };
  }

  function updateSim() {
    const target = savingTarget();
    const results = scenarios.map((s) => ({ s, x: scenResult(s) }));
    const now = ymNow();
    for (const { s, x } of results) {
      const box = document.getElementById("res-" + s.id);
      if (!box) continue;
      const mName = MONTHS[Number(x.ym.slice(5)) - 1];
      let h;
      if (!x.active) h = `<p class="l">Tape un montant pour voir ce qu'il te restera fin ${mName}.</p>`;
      else {
        const diff = round2(x.base.end - x.r.end);
        h = `<p class="l">Fin ${mName}, il te resterait</p><p class="f ${x.r.end < 0 ? "neg" : ""}">${eur0(x.r.end)}</p>
          <p class="l">${diff > 0 ? `${eur(diff)} de moins que les ${eur0(x.base.end)} prévus` : `autant que prévu (${eur0(x.base.end)})`}</p>`;
        if (x.r.room !== null && x.r.a) {
          const c = cat(s.cat);
          if (x.r.impact === 0) h += `<p class="flag info">Elle tient dans ton enveloppe ${esc(c.name)}, où il reste ${eur(x.r.room)}. Ta fin de mois ne bouge pas.</p>`;
          else if (x.r.inside > 0) h += `<p class="flag info">${eur(x.r.inside)} passent dans ${esc(c.name)}, ${eur(x.r.impact)} la dépassent.</p>`;
        }
        if (x.m.car) h += `<p class="flag info">La voiture ajoute ${eur(x.m.car)} ce mois-ci.</p>`;
        if (target > 0) {
          const margin = round2(x.r.end - target);
          if (margin >= 0) h += `<p class="flag ok">Épargne de ${eur0(target)} tenue. Marge restante : ${eur(margin)}${x.ym === now ? `, soit ${eur(margin / daysLeftFrom(x.ym, x.date))} par jour` : ""}.</p>`;
          else h += `<p class="flag ko">Épargne de ${eur0(target)} manquée de ${eur(-margin)}.</p>`;
        }
      }
      box.innerHTML = h;
      const btn = app.querySelector(`[data-act="scenSave"][data-sid="${s.id}"]`);
      if (btn) btn.textContent = x.ym > ymNow() ? `Ajouter aux dépenses prévues de ${MONTHS[Number(x.ym.slice(5)) - 1]}` : "Enregistrer cette dépense";
    }
    // Comparaison
    const cmp = document.getElementById("cmp");
    if (!cmp) return;
    const act = results.filter((r) => r.x.active);
    const months = new Set(act.map((r) => r.x.ym));
    const items = [];
    const baseYm = act.length ? act[0].x.ym : now;
    if (months.size <= 1) items.push({ k: `Sans rien dépenser de plus`, v: computeMonth(baseYm).end, base: true });
    else for (const ym of [...months].sort()) items.push({ k: `Sans rien de plus, ${monthName(ym)}`, v: computeMonth(ym).end, base: true });
    for (const { s, x } of act) items.push({ k: `${s.name} : ${eur0(x.r.a)}${s.car ? " + voiture" : ""}${months.size > 1 ? `, ${monthName(x.ym)}` : ""}`, v: x.r.end });
    if (!act.length) { cmp.innerHTML = `<p class="hint">Les dépenses que tu tapes ci-dessous apparaissent ici, côte à côte.</p>` + hbars(items); return; }
    cmp.innerHTML = hbars(items);
  }

  function hbars(items) {
    const max = Math.max(1, ...items.map((i) => Math.abs(i.v)));
    return items.map((i) => `<div class="hbar ${i.base ? "base" : ""} ${i.v < 0 ? "neg" : ""}"><span class="k">${esc(i.k)}</span><span class="v num ${i.v < 0 ? "neg" : ""}">${eur0(i.v)}</span>
      <span class="track" aria-hidden="true"><i style="width:${Math.max(2, (Math.abs(i.v) / max) * 100)}%"></i></span></div>`).join("");
  }

  /* ================= Vue : Ajouter ================= */
  function renderAjouter() {
    const cats = addForm.type === "out"
      ? state.categories.filter((c) => c.kind === "enveloppe").concat(state.categories.filter((c) => c.kind === "fixe"))
      : state.categories.filter((c) => c.kind === "revenu");
    if (!addForm.cat || !cats.find((c) => c.id === addForm.cat)) addForm.cat = cats[0] ? cats[0].id : "";
    const err = addForm.touched && !(parseAmount(addForm.amount) > 0);
    let html = topBar("Ajouter", "Une dépense ou une rentrée hors relevé");
    html += `<form class="panel" id="addForm" novalidate>
      <div class="seg" role="group" aria-label="Type"><button type="button" data-act="addType" data-v="out" aria-pressed="${addForm.type === "out"}">Dépense</button><button type="button" data-act="addType" data-v="in" aria-pressed="${addForm.type === "in"}">Rentrée</button></div>
      <div class="field"><div class="amount-field"><label for="addAmount" class="sr">Montant</label><input id="addAmount" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(addForm.amount)}" ${err ? 'aria-invalid="true"' : ""} aria-describedby="addAmountErr"><span class="cur" aria-hidden="true">€</span></div>
        <p class="err" id="addAmountErr" ${err ? "" : "hidden"}>Indique un montant, par exemple 12,50.</p></div>
      <div class="field"><span class="flabel" id="addCatLbl">Catégorie</span><div class="quick" role="radiogroup" aria-labelledby="addCatLbl">
        ${cats.map((c) => `<label class="chip"><input type="radio" name="addCat" value="${esc(c.id)}" ${addForm.cat === c.id ? "checked" : ""}>${esc(c.name)}</label>`).join("")}</div></div>
      <div class="grid2"><div class="field"><label for="addDate">Date</label><input type="date" id="addDate" value="${esc(addForm.date)}"></div>
        <div class="field"><label for="addLabel">Libellé</label><input type="text" id="addLabel" value="${esc(addForm.label)}" placeholder="Facultatif" autocomplete="off"></div></div>
      <div class="field"><label for="addNote">Note</label><input type="text" id="addNote" value="${esc(addForm.note)}" placeholder="Facultatif" autocomplete="off"></div>
      <button class="btn primary" type="submit">${addForm.type === "out" ? "Enregistrer la dépense" : "Enregistrer la rentrée"}</button>
      <p class="hint">Payée avec Revolut ? L'import du relevé la retrouvera et ne la comptera pas deux fois. Une date dans un mois à venir l'ajoute aux dépenses prévues de ce mois-là.</p>
    </form>`;

  /* ================= Vue : Opérations ================= */
  function renderOperations() {
    const m = computeMonth(viewYM);
    const allUncl = state.tx.filter((t) => classify(t) === null);
    let html = topBar(cap(monthName(viewYM)), `${m.txs.length} opération${m.txs.length > 1 ? "s" : ""}`, { months: true });
    html += `<div class="btn-row"><button class="btn primary" data-act="importCsv">Importer le relevé Revolut</button></div><button class="btn link" data-act="importJournal">Importer le journal Apple Pay</button>`;
    if (lastImport) html += renderImportSummary(lastImport);
    html += `<div class="seg" role="group" aria-label="Affichage">
      <button data-act="filter" data-v="toutes" aria-pressed="${opsFilter === "toutes"}">Toutes</button>
      <button data-act="filter" data-v="classer" aria-pressed="${opsFilter === "classer"}">À classer (${m.unclCount})</button>
      <button data-act="filter" data-v="commerces" aria-pressed="${opsFilter === "commerces"}">Par commerce</button></div>`;
    if (opsFilter === "commerces") { app.innerHTML = html + renderMerchants(allUncl); return; }
    html += `<div class="field"><label for="opsQuery" class="sr">Rechercher</label><input type="search" id="opsQuery" placeholder="Rechercher un commerce, une note, un montant" value="${esc(opsQuery)}" autocomplete="off"></div>`;
    html += `<div id="opsList">${opsList(m)}</div>`;
    app.innerHTML = html;
  }

  function opsList(m) {
    let list = m.txs.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    if (opsFilter === "classer") list = list.filter((t) => classify(t) === null);
    const q = norm(opsQuery);
    if (q) {
      const qa = parseAmount(opsQuery);
      list = list.filter((t) => norm(t.label).includes(q) || norm(t.note).includes(q) || (cat(classify(t)) && norm(cat(classify(t)).name).includes(q)) || (isFinite(qa) && Math.abs(Math.abs(t.amount) - Math.abs(qa)) < 0.005));
    }
    if (!list.length) {
      if (q) return `<p class="hint">Aucune opération ne correspond à « ${esc(opsQuery)} » en ${monthName(m.ym)}.</p>`;
      if (opsFilter === "classer") return `<div class="empty"><b>Tout est classé pour ${monthName(m.ym)}.</b></div>`;
      return `<div class="empty"><b>Aucune opération en ${monthName(m.ym)}.</b><p>Dans l'application Revolut, ouvre Relevés, choisis le format CSV et la période, puis importe le fichier ici.</p></div>`;
    }
    let html = "", cur = "", block = "", dayTotal = 0;
    const flush = () => { if (block) html += `<div><div class="daygroup">${dayLabel(cur)}</div><div class="rows">${block}</div></div>`; block = ""; dayTotal = 0; };
    for (const t of list) {
      if (t.date !== cur) { flush(); cur = t.date; }
      const k = classify(t);
      let tag;
      if (k === null) { const s = suggest(t); tag = `<span class="tag todo">À classer</span>${s ? ` <span class="tag sugg">${esc(cat(s.id).name)} ?</span>` : ""}`; }
      else if (k === "hors") tag = `<span class="tag">Non comptée</span>`;
      else tag = `<span class="tag">${esc(cat(k).name)}${t.source === "manuel" ? ", saisie à la main" : t.source === "applepay" ? ", Apple Pay" : ""}${t.orig ? ", modifiée" : ""}</span>`;
      block += `<button class="row" data-act="openTx" data-id="${esc(t.id)}"><span class="name">${esc(t.label || (cat(k) ? cat(k).name : "Sans libellé"))}</span>
        <span class="amt num ${k === "hors" ? "muted" : t.amount > 0 ? "in" : ""}">${t.amount > 0 ? "+" : "−"}${eur(Math.abs(t.amount))}</span>
        <span class="sub">${tag}${t.note ? `<br><span class="note">${esc(t.note)}</span>` : ""}</span></button>`;
    }
    flush();
    return html;
  }

  function merchantGroups(list) {
    const g = new Map();
    for (const t of list) {
      const k = norm(t.label) || "(sans libellé)";
      if (!g.has(k)) g.set(k, { key: k, label: t.label || "Sans libellé", count: 0, total: 0, tx: [] });
      const x = g.get(k); x.count++; x.total = round2(x.total - t.amount); x.tx.push(t);
    }
    return [...g.values()].sort((a, b) => b.total - a.total);
  }

  function renderMerchants(allUncl) {
    if (!allUncl.length) return `<div class="empty"><b>Plus rien à classer.</b><p>Toutes tes opérations ont une catégorie.</p></div>`;
    const groups = merchantGroups(allUncl);
    const rows = groups.map((g) => {
      const s = suggest(g.tx[0]);
      return `<div class="row" style="grid-template-columns:minmax(0,1fr) auto">
        <button class="name" data-act="openGroup" data-k="${esc(g.key)}" style="all:unset;cursor:pointer;font-size:16px;font-weight:500;overflow-wrap:anywhere">${esc(g.label)}</button>
        <span class="amt num">${eur(g.total)}</span>
        <span class="sub">${g.count} opération${g.count > 1 ? "s" : ""}</span>
        <span class="state">${s ? `<button class="chip sugg" data-act="acceptSugg" data-k="${esc(g.key)}" data-c="${esc(s.id)}">${esc(cat(s.id).name)}</button>` : `<button class="chip" data-act="openGroup" data-k="${esc(g.key)}">Choisir</button>`}</span></div>`;

    return `<p class="hint">${allUncl.length} opérations à classer, tous mois confondus, regroupées par commerce. Une catégorie choisie ici s'applique à tout le groupe et aux prochains imports. Les boutons bleus sont des suggestions : touche-les pour les accepter.</p><div class="rows">${rows}</div>`;

  function colChart(id, data, opts = {}) {
    const W = 340, H = 170, padL = 4, padR = 4, padT = 24, padB = 22;
    const vals = data.map((d) => d.v);
    const max = Math.max(0, ...vals), min = Math.min(0, ...vals);
    const span = max - min || 1;
    const y = (v) => padT + ((max - v) / span) * (H - padT - padB);
    const n = data.length, slot = (W - padL - padR) / n, bw = Math.min(30, slot * 0.56);
    const sel = chartSel[id] ?? (opts.defaultSel ?? n - 1);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "")}">`;
    const step = niceStep(span);
    for (let g = Math.ceil(min / step) * step; g <= max + 0.001; g += step) s += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y(g)}" y2="${y(g)}"/>`;
    s += `<line class="base" x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}"/>`;
    data.forEach((d, i) => {
      const cx = padL + slot * i + slot / 2, x = cx - bw / 2;
      const y0 = y(0), y1 = y(d.v), h = Math.abs(y1 - y0);
      const r = Math.min(4, h);
      const cls = `colbar ${d.v < 0 ? "neg" : ""} ${d.dim ? "dim" : ""}`;
      if (d.v >= 0) s += `<path class="${cls}" d="M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 + r} V${y0} Z"/>`;
      else s += `<path class="${cls}" d="M${x},${y0} V${y1 - r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 - r} V${y0} Z"/>`;
      s += `<text class="lbl" x="${cx}" y="${H - 6}" text-anchor="middle">${esc(d.k)}</text>`;
      if (i === sel) s += `<text class="val" x="${Math.min(W - 30, Math.max(30, cx))}" y="${d.v >= 0 ? y1 - 6 : y1 + 14}" text-anchor="middle">${eur0(d.v)}</text>`;
      s += `<rect class="hit" x="${padL + slot * i}" y="0" width="${slot}" height="${H}" tabindex="0" role="button" aria-label="${esc(d.k)} : ${eur0(d.v)}" data-act="chartSel" data-chart="${id}" data-i="${i}"/>`;
    });
    return s + "</svg>";
  }
  function niceStep(span) { const raw = span / 3; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p; }

    html += `<section class="section"><div class="section-head"><h2 class="section-title">Reste chaque mois</h2><span>touche une colonne</span></div><div class="panel">
      ${colChart("proj", p.map((x) => ({ k: monthShort(x.ym), v: x.end })), { label: "Reste prévu sur 6 mois", defaultSel: 0 })}

      <p class="hint">Le mois en cours compte tes dépenses réelles. Les suivants reprennent ton budget et tes dépenses ou rentrées prévues.</p></div></section>`;

    const h = hAll.filter((x) => x.full);
    html += `<section class="section"><div class="section-head"><h2 class="section-title">Mois passés</h2><span>reste réel</span></div>`;
    if (!h.length) html += `<div class="empty"><b>Pas encore de mois terminé complet.</b><p>Les mois importés apparaîtront ici, comparés à ton budget.</p></div>`;
    else {
      const avg = h.reduce((a, x) => a + x.end, 0) / h.length;
      html += `<div class="panel">${colChart("hist", h.map((x) => ({ k: monthShort(x.ym), v: x.end })), { label: "Reste réel des mois passés" })}
        <div class="table-wrap"><table class="table"><thead><tr><th>Mois</th><th>Prévu</th><th>Réel</th><th>Écart</th></tr></thead><tbody>
        ${h.map((x) => `<tr><td>${cap(monthShort(x.ym))} ${x.ym.slice(2, 4)}</td><td>${eur0(x.plan)}</td><td>${eur0(x.end)}</td><td class="${x.diff < 0 ? "neg" : "pos"}">${sgn(x.diff)}</td></tr>`).join("")}</tbody></table></div>
        <p class="hint">Moyenne : ${eur0(avg)} par mois. Le prévu reprend ton budget actuel. Les opérations encore à classer comptent dans le réel.${hAll.length > h.length ? ` Mis de côté car incomplets (aucun salaire reçu) : ${hAll.filter((x) => !x.full).map((x) => monthName(x.ym)).join(", ")}.` : ""}</p></div>`;
    }
    app.innerHTML = html + "</section>";
  }

      { kind: "revenu", title: "Ce qui rentre", text: "Ton salaire net, tel qu'il arrive sur ton compte." },
      { kind: "fixe", title: "Tes charges fixes", text: "Ce qui part chaque mois, à montant connu. Laisse vide ce qui ne te concerne pas." },

      <form id="onbForm" class="section" novalidate>
