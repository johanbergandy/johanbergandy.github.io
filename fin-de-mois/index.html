<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fin de mois</title>
</head>
<body>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fin de mois">
<style>
/* Fin de mois, v5 : une app iPhone, pas une page web.
   Conventions d'Apple : police système (chiffres en SF Rounded), grand titre qui se range dans une barre
   translucide, listes groupées façon Réglages, feuilles qui montent du bas et font reculer l'écran,
   couleurs système. L'élément fort : le montant « Tu peux dépenser », seul en grand, sans carte autour.
   Bleu système pour tout ce qui se touche ; vert, orange et rouge réservés à l'état du budget. */
:root {
  --bg: #F2F2F7;
  --surface: #FFFFFF;
  --surface-2: #FFFFFF;
  --fill: rgba(118, 118, 128, .12);
  --fill-2: rgba(118, 118, 128, .2);
  --press: #D1D1D6;
  --ink: #000000;
  --muted: rgba(60, 60, 67, .6);
  --faint: rgba(60, 60, 67, .3);
  --line: rgba(60, 60, 67, .29);
  --accent: #007AFF;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(0, 122, 255, .1);
  --green: #34C759;
  --orange: #FF9500;
  --red: #FF3B30;
  --good: #248A3D;
  --warn: #C93400;
  --bad: #D70015;
  --warn-soft: rgba(255, 149, 0, .14);
  --bad-soft: rgba(255, 59, 48, .12);
  --good-soft: rgba(52, 199, 89, .14);
  --bar: #000000;
  --chrome: rgba(249, 249, 249, .82);
  --chrome-solid: #F9F9F9;
  --hair: rgba(0, 0, 0, .3);
  --toast: rgba(28, 28, 30, .94);
  --scrim: rgba(0, 0, 0, .32);
  --tab-cut: #F9F9F9;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --r-list: 14px;
  --tabbar-h: 50px;
  --ios: cubic-bezier(.32, .72, 0, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .36); --press: #3A3A3C;
    --ink: #FFFFFF; --muted: rgba(235, 235, 245, .6); --faint: rgba(235, 235, 245, .3); --line: rgba(84, 84, 88, .65);
    --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .18);
    --green: #30D158; --orange: #FF9F0A; --red: #FF453A; --good: #30D158; --warn: #FF9F0A; --bad: #FF6961;
    --warn-soft: rgba(255, 159, 10, .18); --bad-soft: rgba(255, 69, 58, .2); --good-soft: rgba(48, 209, 88, .18);
    --bar: #FFFFFF; --chrome: rgba(22, 22, 23, .8); --chrome-solid: #161617; --hair: rgba(255, 255, 255, .16);
    --toast: rgba(58, 58, 60, .96); --scrim: rgba(0, 0, 0, .5); --tab-cut: #161617;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .36); --press: #3A3A3C;
  --ink: #FFFFFF; --muted: rgba(235, 235, 245, .6); --faint: rgba(235, 235, 245, .3); --line: rgba(84, 84, 88, .65);
  --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .18);
  --green: #30D158; --orange: #FF9F0A; --red: #FF453A; --good: #30D158; --warn: #FF9F0A; --bad: #FF6961;
  --warn-soft: rgba(255, 159, 10, .18); --bad-soft: rgba(255, 69, 58, .2); --good-soft: rgba(48, 209, 88, .18);
  --bar: #FFFFFF; --chrome: rgba(22, 22, 23, .8); --chrome-solid: #161617; --hair: rgba(255, 255, 255, .16);
  --toast: rgba(58, 58, 60, .96); --scrim: rgba(0, 0, 0, .5); --tab-cut: #161617;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
html { background: var(--bg); transition: background .35s var(--ios); }
body { margin: 0; background: transparent; color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.29; letter-spacing: -.01em; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
svg { flex: none; }

.app { max-width: 480px; min-height: 100vh; margin-inline: auto; padding-inline: 16px; padding-block: 0 calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 32px); display: flex; flex-direction: column; gap: 22px; background: var(--bg); overflow-x: clip; view-transition-name: page; transition: transform .38s var(--ios), border-radius .38s var(--ios); }

/* ---------- Barre de navigation et grand titre ---------- */
.nav { position: sticky; top: 0; z-index: 15; margin-inline: -16px; margin-bottom: -22px; height: 44px; padding: 0 8px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: .5px solid transparent; transition: background .2s, border-color .2s; }
.nav.scrolled { background: var(--chrome-solid); border-bottom-color: var(--hair); }
@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .nav.scrolled { background: var(--chrome); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
}
.nav-l { justify-self: start; display: flex; }
.nav-r { justify-self: end; display: flex; gap: 2px; }
.nav-t { font-size: 17px; font-weight: 600; opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56vw; }
.nav.scrolled .nav-t { opacity: 1; transform: none; }
.navback { display: inline-flex; align-items: center; gap: 0; min-height: 44px; padding: 0 8px 0 0; border: 0; background: none; color: var(--accent); font-size: 17px; }
.navback svg { width: 24px; height: 24px; stroke-width: 2.4; margin-right: -2px; }
.navback:active, .navbtn:active { opacity: .35; }
.navbtn { position: relative; min-width: 44px; min-height: 44px; display: inline-grid; place-items: center; border: 0; background: none; color: var(--accent); padding: 0; }
.navbtn svg { width: 24px; height: 24px; }
.navbtn[disabled] { color: var(--faint); cursor: default; }
.navbtn .dot { position: absolute; top: 9px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); border: 2px solid var(--bg); }
.mnav { display: flex; }
.lt { padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.lt h1 { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: .011em; }
.lt-top { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: -.01em; }
.lt-sub { font-size: 15px; color: var(--muted); margin-top: 2px; }

/* ---------- Le montant ---------- */
.hero { display: flex; flex-direction: column; gap: 14px; margin-top: -4px; }
.hero-main { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 0; border: 0; background: none; text-align: left; color: inherit; border-radius: 14px; transition: opacity .15s; }
.hero-main:active { opacity: .55; }
.h-label { display: inline-flex; align-items: center; gap: 2px; font-size: 17px; font-weight: 600; color: var(--muted); }
.h-label svg { width: 16px; height: 16px; color: var(--faint); stroke-width: 2.6; }
.hero .big { font-family: var(--round); font-weight: 700; font-size: clamp(64px, 20vw, 88px); line-height: .95; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.hero .per { display: flex; align-items: baseline; gap: 8px; font-size: 15px; color: var(--muted); }
.hero .per b { font-weight: 600; color: var(--ink); }
.hero .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); flex: none; transform: translateY(1px); }
.hero[data-mood="tight"] .dot { background: var(--orange); }
.hero[data-mood="red"] .dot { background: var(--red); }
.hero[data-mood="red"] .big { color: var(--bad); }
.today { display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: var(--muted); }
.today b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.today i { display: block; height: 4px; border-radius: 2px; background: var(--fill-2); overflow: hidden; }
.today i b { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .5s var(--ios); }
.today.over i b { background: var(--red); }
.today.over span { color: var(--bad); }
.month { position: relative; height: 8px; border-radius: 4px; background: var(--fill-2); }
.month i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--green); transition: width .6s var(--ios); }
.hero[data-mood="tight"] .month i { background: var(--orange); }
.hero[data-mood="red"] .month i { background: var(--red); }
.month b { position: absolute; top: -3px; width: 3px; height: 14px; margin-left: -1.5px; border-radius: 1.5px; background: var(--ink); opacity: .35; }
.hero-next { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0; border: 0; background: none; text-align: left; font-size: 15px; color: var(--muted); min-height: 32px; }
.hero-next b { color: var(--ink); font-weight: 600; }
.hero-next svg { width: 14px; height: 14px; color: var(--faint); stroke-width: 2.6; }
.hero-next:active { opacity: .5; }

/* ---------- Pavé « Et si je paie » ---------- */
.pad { background: var(--surface); border-radius: 22px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.pad .q { font-size: 15px; font-weight: 600; color: var(--muted); text-align: center; }
.pad .amt { font-family: var(--round); font-weight: 700; font-size: 52px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; min-height: 52px; display: flex; align-items: baseline; justify-content: center; gap: 4px; }
.pad .amt.blank { color: var(--faint); }
.pad .amt .cur { font-size: 34px; color: var(--muted); font-weight: 600; }
.verdict { min-height: 50px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; }
.verdict .v1 { font-size: 17px; font-weight: 600; }
.verdict .v1 b { font-family: var(--round); font-size: 20px; font-weight: 700; }
.verdict .v2 { font-size: 15px; color: var(--muted); }
.verdict .v3 { font-size: 15px; font-weight: 600; color: var(--warn); margin-top: 2px; }
.verdict .ok { color: var(--good); }
.verdict .ko { color: var(--bad); }
.verdict .mid { color: var(--warn); }
.cats { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.cat { flex: none; min-height: 34px; padding: 0 14px; border-radius: 17px; border: 0; background: var(--fill); font-size: 15px; font-weight: 500; color: var(--ink); transition: background .15s, color .15s, transform .1s; }
.cat:active { transform: scale(.96); }
.cat[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 8px; margin-inline: -4px; }
.key { min-height: 54px; border: 0; border-radius: 14px; background: transparent; font-family: var(--round); font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; transition: background .25s; touch-action: manipulation; }
.key:active, .key.down { background: var(--fill-2); transition: none; }
.key svg { width: 28px; height: 28px; vertical-align: middle; stroke-width: 1.7; }
.catpick { position: relative; display: flex; justify-content: center; }
.catbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px 0 16px; border: 0; border-radius: 18px; background: var(--fill); font-size: 15px; color: var(--ink); }
.catbtn .for { color: var(--muted); }
.catbtn b { font-weight: 600; color: var(--accent); }
.catbtn svg { width: 15px; height: 15px; color: var(--accent); }
.catbtn:active { opacity: .6; }
.menu { position: absolute; top: calc(100% + 8px); left: 50%; z-index: 12; min-width: 250px; transform: translateX(-50%); transform-origin: 50% 0; background: var(--surface); border-radius: 14px; box-shadow: 0 12px 44px rgba(0, 0, 0, .22), 0 0 0 .5px var(--hair); overflow: hidden; display: flex; flex-direction: column; animation: menuin .3s var(--ios); }
:root[data-theme="dark"] .menu { background: #2C2C2E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .menu { background: #2C2C2E; } }
.menu[hidden] { display: none; }
.mi { position: relative; display: grid; grid-template-columns: 22px 1fr; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px 0 12px; border: 0; background: transparent; text-align: left; font-size: 17px; color: var(--ink); }
.mi + .mi::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: .5px; background: var(--line); }
.mi svg { width: 17px; height: 17px; stroke-width: 2.6; visibility: hidden; }
.mi[aria-checked="true"] svg { visibility: visible; }
.mi:active, .mi:focus-visible { background: var(--press); outline: none; }
@keyframes menuin { from { opacity: 0; transform: translateX(-50%) scale(.85); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.acts .btn { white-space: nowrap; }

/* ---------- Boutons ---------- */
.btn { min-height: 50px; border-radius: 25px; border: 0; padding: 0 20px; width: 100%; font-size: 17px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--fill); color: var(--accent); transition: transform .12s var(--ios), opacity .12s; }
.btn:active { transform: scale(.97); opacity: .8; }
.btn.primary, .btn.dark { background: var(--accent); color: var(--accent-ink); }
.btn.secondary { background: var(--fill); color: var(--accent); }
.btn.danger { background: var(--fill); color: var(--red); }
.btn.link { background: transparent; color: var(--accent); min-height: 44px; width: auto; padding: 0 4px; font-weight: 400; }
.btn.small { min-height: 34px; width: auto; font-size: 15px; padding: 0 14px; border-radius: 17px; }
.btn[aria-disabled="true"], .btn[disabled] { opacity: .35; }
.btn-row { display: flex; gap: 10px; }
.btn-row > * { flex: 1; }

/* ---------- Sections et listes groupées ---------- */
.section { display: flex; flex-direction: column; gap: 8px; }
.sh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-inline: 2px; }
.sh h2 { font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: .02em; }
.sh span { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hint { font-size: 13px; line-height: 18px; color: var(--muted); padding-inline: 4px; }
.panel .hint, .sheet .hint, .tri .hint { padding-inline: 0; font-size: 15px; line-height: 20px; }
.rows { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-list); overflow: hidden; }
.row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 11px 16px; border: 0; min-height: 44px; text-align: left; background: transparent; width: 100%; transition: background .3s; }
.rows > * + *::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--line); }
.rows > * { position: relative; }
button.row:active { background: var(--press); transition: none; }
.row .name { font-size: 17px; min-width: 0; overflow-wrap: anywhere; }
.row .sub { font-size: 15px; color: var(--muted); grid-column: 1; min-width: 0; overflow-wrap: anywhere; }
.row .amt { font-size: 17px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row .amt.in { color: var(--good); }
.row .amt.muted { color: var(--muted); }
.row .st { font-size: 15px; text-align: right; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .st.over { color: var(--bad); font-weight: 600; }
.row .st.near { color: var(--warn); font-weight: 600; }
.row .st.paid { color: var(--good); }
.row svg.chev { width: 14px; height: 14px; color: var(--faint); stroke-width: 2.8; justify-self: end; }
.row:has(.tile) { grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 14px; }
.rows > .row:has(.tile) + *::before { left: 60px; }
.row:has(.tile) .sub { grid-column: 2; }
.tile { grid-row: span 2; width: 30px; height: 30px; border-radius: 7px; background: var(--tile); color: #FFFFFF; display: grid; place-items: center; }
.tile svg { width: 19px; height: 19px; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--fill-2); overflow: hidden; position: relative; margin-block: 4px 2px; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; transition: width .5s var(--ios); }
.bar i.near { background: var(--orange); }
.bar i.done { background: var(--green); }
.row .sub b { color: var(--ink); font-weight: 600; }
.row .sub b.pos { color: var(--good); }
.row .sub b.neg { color: var(--bad); }
.money-row input[type="month"] { min-height: 40px; padding: 8px 10px; font-size: 15px; }
.bar i.over { background: var(--red); }
.bar u { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .3; text-decoration: none; }
.tag { font-size: 15px; color: var(--muted); }
.tag.todo { color: var(--warn); font-weight: 600; }
.tag.sugg { color: var(--accent); }
.note { font-size: 15px; color: var(--muted); font-style: italic; }
.daygroup { font-size: 13px; color: var(--muted); padding: 14px 16px 6px; }
.panel { background: var(--surface); border-radius: var(--r-list); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.callout { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 13px 16px; min-height: 44px; border-radius: var(--r-list); background: var(--surface); border: 0; width: 100%; text-align: left; font-size: 15px; line-height: 20px; color: var(--ink); transition: background .3s; }
button.callout:active { background: var(--press); transition: none; }
.callout.warn { background: var(--warn-soft); }
.callout.bad { background: var(--bad-soft); }
.callout.accent { background: var(--accent-soft); }
.callout svg { width: 14px; height: 14px; color: var(--faint); stroke-width: 2.8; }
.callout b { font-weight: 600; }

/* ---------- Le point : tri ---------- */
.fresh { display: flex; flex-direction: column; gap: 4px; }
.tri { background: var(--surface); border-radius: 22px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; touch-action: pan-y; }
.tri .prog { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tri .prog i { flex: 1; height: 4px; border-radius: 2px; background: var(--fill-2); margin-left: 12px; position: relative; overflow: hidden; }
.tri .prog i b { position: absolute; inset: 0 auto 0 0; background: var(--accent); transition: width .4s var(--ios); }
.tri .who { font-size: 28px; line-height: 34px; font-weight: 700; overflow-wrap: anywhere; }
.tri .what { font-size: 15px; color: var(--muted); margin-top: 2px; }
.tri .what b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.tri .guess { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 14px; background: var(--accent-soft); }
.tri .guess span { font-size: 13px; color: var(--muted); }
.tri .guess b { display: block; font-size: 17px; font-weight: 600; color: var(--ink); }
.tri .grid { display: flex; flex-wrap: wrap; gap: 8px; }
.tri .grid .cat { flex: 0 1 auto; }
.tri .grp { font-size: 13px; color: var(--muted); width: 100%; margin-top: 2px; }
.tri.leave { animation: slideout .22s var(--ios) forwards; }
.tri.enter { animation: slidein .32s var(--ios); }
.tri .btn-row .btn { white-space: nowrap; }
details.tri-more { width: 100%; margin-top: 2px; border-top: .5px solid var(--line); }
details.tri-more > div.grid { flex-direction: row; flex-wrap: wrap; gap: 8px; }

/* ---------- Bilan : une liste, pastilles d'icônes ---------- */
.facts { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-list); overflow: hidden; }
.fact { position: relative; padding: 12px 16px; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 14px; align-items: start; }
.fact + .fact::before { content: ""; position: absolute; top: 0; left: 60px; right: 0; height: .5px; background: var(--line); }
.fact .ic { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; background: #8E8E93; color: #FFFFFF; }

@keyframes push-in { from { transform: translateX(100%); } }
@keyframes push-out { to { transform: translateX(-30%); opacity: .6; } }
@keyframes pop-in { from { transform: translateX(-30%); opacity: .6; } }
@keyframes pop-out { to { transform: translateX(100%); } }
::view-transition-old(root), ::view-transition-new(root) { animation: none; }
::view-transition-group(tabbar) { animation: none; }
::view-transition-old(page) { animation: fadeout .14s ease-in both; }
::view-transition-new(page) { animation: fade .2s ease-out both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }

}

<script>
(function () {
  "use strict";

  /* ================= Utilitaires ================= */
  const KEY = "fin-de-mois.v1";
  const APP_ID = "fin-de-mois";
  const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const MONTHS_S = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  const DAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  const fmt2 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
  const fmt0 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0, minimumFractionDigits: 0 });
  const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
  const eur = (n) => fmt2.format(round2(n));
  const eur0 = (n) => fmt0.format(Math.round(n));
  const sgn = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + eur(Math.abs(n));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const pad = (n) => String(n).padStart(2, "0");
  const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = () => isoOf(new Date());
  const ymOf = (iso) => String(iso).slice(0, 7);
  const ymNow = () => ymOf(todayISO());
  const ymShift = (ym, k) => { let [y, m] = ym.split("-").map(Number); m += k; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; };
  const ymDiff = (a, b) => { const [ya, ma] = a.split("-").map(Number); const [yb, mb] = b.split("-").map(Number); return (yb - ya) * 12 + (mb - ma); };
  const daysIn = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
  const monthName = (ym) => { const [y, m] = ym.split("-").map(Number); return `${MONTHS[m - 1]} ${y}`; };
  const monthShort = (ym) => MONTHS_S[Number(ym.slice(5)) - 1];
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const dayLabel = (iso) => { const [y, m, d] = iso.split("-").map(Number); const dt = new Date(y, m - 1, d); return `${cap(DAYS[dt.getDay()])} ${d} ${MONTHS[m - 1]}`; };
  const shortDate = (iso) => { const [, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]}`; };
  const reduced = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };

  function parseAmount(v) {
    if (typeof v === "number") return isFinite(v) ? v : NaN;
    let s = String(v ?? "").replace(/eur/gi, "").replace(/[\s  €]/g, "");
    if (!s) return NaN;
    if (s.includes(",") && s.includes(".")) {
      if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", ".");
      else s = s.replace(/,/g, "");
    } else s = s.replace(",", ".");
    if (!/^[+-]?\d*\.?\d+$/.test(s)) return NaN;
    return Number(s);
  }
  const amountText = (n) => (n ? String(round2(n)).replace(".", ",") : "");

  /* ================= Données ================= */
  function defaultCategories() {
    return [
      { id: "salaire", name: "Salaire", kind: "revenu", budget: 0, kw: [], active: true },
      { id: "loyer", name: "Loyer et charges", kind: "fixe", budget: 0, kw: [], active: true },
      { id: "edf", name: "EDF", kind: "fixe", budget: 0, kw: ["EDF"], active: true },
      { id: "sport", name: "Salle de sport", kind: "fixe", budget: 0, kw: [], active: true },
      { id: "gmf", name: "GMF", kind: "fixe", budget: 0, kw: ["Gmf"], active: true },
      { id: "revolut", name: "Revolut", kind: "fixe", budget: 0, kw: ["abonnement Metal"], active: true },
      { id: "abonnements", name: "Abonnements", kind: "fixe", budget: 0, kw: ["IONOS", "iCloud", "Netflix", "Spotify", "Deezer"], active: true },
      { id: "voiture", name: "Voiture (LLD)", kind: "fixe", budget: 0, kw: [], active: false },
      { id: "nourriture", name: "Courses", kind: "enveloppe", budget: 0, kw: ["Intermarché", "Grand Frais", "Carrefour", "Leclerc", "Auchan", "Lidl", "Aldi", "Franprix", "Monoprix", "Coccinelle", "Boulangerie", "Marie Blachère", "Mie Câline", "Super U", "Hyper U"], active: true },
      { id: "sorties", name: "Restos et sorties", kind: "enveloppe", budget: 0, kw: ["Tabac", "McDonald", "Burger King", "KFC", "Five Guys", "Subway", "Gaumont", "UGC", "Pathé", "Brasserie", "Pizza"], active: true },
      { id: "livraisons", name: "Livraisons de repas", kind: "enveloppe", budget: 0, kw: ["Uber Eats", "Deliveroo"], active: true },
      { id: "especes", name: "Espèces", kind: "enveloppe", budget: 0, kw: ["Retrait d'espèces"], active: true },
      { id: "essence", name: "Essence", kind: "enveloppe", budget: 0, kw: ["Total", "Esso", "Station-service", "Shell", "Avia"], active: true },
      { id: "auto", name: "Voiture : péages, entretien", kind: "enveloppe", budget: 0, kw: ["Sanef", "Norauto", "Feu Vert", "Speedy", "Midas", "Indigo", "PayByPhone", "Station Lavage", "Air Serv"], active: true },
      { id: "sportplus", name: "Sport : séances, matériel", kind: "enveloppe", budget: 0, kw: ["Decathlon", "Intersport", "Sport 2000", "Nutrition"], active: true },
      { id: "soins", name: "Soins et santé", kind: "enveloppe", budget: 0, kw: ["Pharmacie", "Sephora", "Coiffure"], active: true },
      { id: "shopping", name: "Shopping et maison", kind: "enveloppe", budget: 0, kw: ["Amazon", "Temu", "Ikea", "Darty", "Uniqlo", "H&M", "Zara", "Stradivarius", "Chaussea", "Laverie", "leboncoin", "Nespresso"], active: true },
      { id: "imprevus", name: "Imprévus et gros achats", kind: "enveloppe", budget: 0, kw: ["Booking.com", "Airbnb"], active: true },
    ];
  }

  let storageOK = true;
  let state = load();

  function validState(s) {
    return s && typeof s === "object" && Array.isArray(s.categories) && Array.isArray(s.tx) && s.settings && typeof s.settings === "object";
  }
  function migrate(s) {
    if (!Array.isArray(s.events)) s.events = [];
    if (!Array.isArray(s.goals)) s.goals = [];

  /* ---------- Familles et couleurs : le même code partout ----------
     Revenus en vert, factures en indigo, indispensable en bleu-vert, plaisir en rose, imprévus en jaune, épargne en violet.
     Chaque catégorie a sa nuance de la couleur de sa famille et son icône. Vert, orange et rouge seuls disent si ça va. */
  const FAM = {
    revenu: { name: "Revenus", color: "#34C759" },
    fixe: { name: "Factures", color: "#5856D6" },
    ess: { name: "Indispensable", color: "#0FA3B1" },
    plaisir: { name: "Plaisir", color: "#FF2D55" },
    imprevu: { name: "Imprévus", color: "#F2A900" },
    epargne: { name: "Épargne", color: "#AF52DE" },
  };
  const FAM_ENV = ["ess", "plaisir", "imprevu"];
  const CAT_META = {
    salaire: ["revenu", "#34C759", "in"],
    loyer: ["fixe", "#5856D6", "home"], edf: ["fixe", "#5856D6", "bolt"], sport: ["fixe", "#5856D6", "dumbbell"], gmf: ["fixe", "#5856D6", "shield"],
    revolut: ["fixe", "#5856D6", "card"], abonnements: ["fixe", "#5856D6", "cloud"], voiture: ["fixe", "#5856D6", "car"],
    nourriture: ["ess", "#0FA3B1", "cart"], essence: ["ess", "#0B7F8A", "fuel"], auto: ["ess", "#3CB9C6", "car"], soins: ["ess", "#086B75", "cross"],
    sorties: ["plaisir", "#FF2D55", "glass"], livraisons: ["plaisir", "#FF6584", "scooter"], especes: ["plaisir", "#C9184A", "cash"], sportplus: ["plaisir", "#FF8FA8", "dumbbell"], shopping: ["plaisir", "#A4133C", "tag"],
    imprevus: ["imprevu", "#F2A900", "spark"],
  };
  function famOf(c) {
    if (!c) return "ess";
    if (c.kind === "revenu") return "revenu";
    if (c.kind === "fixe") return "fixe";
    return FAM_ENV.includes(c.fam) ? c.fam : (CAT_META[c.id] && FAM_ENV.includes(CAT_META[c.id][0]) ? CAT_META[c.id][0] : "ess");
  }
  function colorOf(c) { const m = CAT_META[c.id], f = famOf(c); return m && m[0] === f ? m[1] : FAM[f].color; }
  function iconOf(c) { const m = CAT_META[c.id]; return ICON[m ? m[2] : c.kind === "fixe" ? "doc" : c.kind === "revenu" ? "in" : "dot"] || ICON.dot; }
  const tile = (c, cls = "") => `<span class="tile ${cls}" style="--tile:${colorOf(c)}" aria-hidden="true">${iconOf(c)}</span>`;
  const tileRaw = (color, icon, cls = "") => `<span class="tile ${cls}" style="--tile:${color}" aria-hidden="true">${ICON[icon] || ICON.dot}</span>`;

  /* ---------- Retour au toucher (iPhone : le contrôle « switch » de Safari vibre) ---------- */
  function haptic() {
    if (!state || state.settings.haptics === false) return;
    try {
      const l = document.createElement("label"); l.setAttribute("aria-hidden", "true"); l.style.cssText = "position:fixed;opacity:0;pointer-events:none;left:-99px";
      const i = document.createElement("input"); i.type = "checkbox"; i.setAttribute("switch", ""); i.tabIndex = -1;
      l.appendChild(i); document.body.appendChild(l); l.click(); l.remove();
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {}
  }

    toastEl.className = "toast" + (undo ? "" : " noact");
    toastEl.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button type="button" id="toastUndo">Annuler</button>` : ""}`;

    toast._undo = undo || null;
    clearTimeout(toast._t); toast._t = setTimeout(() => { toastEl.hidden = true; toast._undo = null; }, undo ? 5000 : 2600);

  const catName = (id) => (cat(id) ? cat(id).name : id === "hors" ? "Ignorée" : "Autre");

  const daysLeft = () => daysIn(ymNow()) - new Date().getDate() + 1;
  const envCats = () => state.categories.filter((c) => c.kind === "enveloppe" && (c.active || c.budget > 0));
  const backupLate = () => { if (!state || !state.tx.length) return false; const l = state.settings.lastBackup; return !l || (Date.now() - new Date(l).getTime()) / 864e5 >= 7; };

  function head(title, sub, opts = {}) {
    const p = parentOf(view);
    const backLabel = TITLE_OF[p] || "";

  /* ---------- Le calcul, le même partout ----------
     Mon budget : ce qui rentre − charges fixes − dépenses variables = ce que tu épargnes un mois normal.
     Ce mois-ci : le même calcul avec le réel. Une dépense variable compte pour son budget, ou pour ce que tu as
     déjà dépensé si c'est plus. Une charge fixe compte pour son vrai montant une fois payée. */
  const sumKind = (kind) => round2(state.categories.filter((c) => c.kind === kind && c.active).reduce((a, c) => a + (c.budget || 0), 0));
  function plan() { const inc = sumKind("revenu"), fix = sumKind("fixe"), vari = sumKind("enveloppe"); return { inc, fix, vari, save: round2(inc - fix - vari) }; }
  const evNet = (ym) => round2(state.events.filter((e) => e.ym === ym && !e.done).reduce((a, e) => a + (e.type === "in" ? e.amount : -e.amount), 0));
  const planMonth = (ym) => round2(plan().save + evNet(ym));
  /* ---------- Ce mois-ci, en quatre lignes ----------
     Ce qui rentre − charges fixes − déjà dépensé = il te reste.
     Il te reste − ton épargne prévue (celle de Mon budget) = tu peux encore dépenser.
     Tant que tu restes dans ce montant, tu gardes ton épargne ; au-delà, elle baisse d'autant. */
  function now(mIn) {
    const m = mIn || computeMonth(ymNow());
    const spent = round2(m.lines.filter((l) => l.c.kind === "enveloppe").reduce((a, l) => a + l.actual, 0) + m.uncl);
    const reste = round2(m.inc - m.fix - m.evOut - m.car - spent);
    const keep = Math.max(0, planMonth(m.ym));
    const dispo = round2(reste - keep);
    const total = round2(dispo + spent);
    const room = round2(Math.max(0, dispo)), over = round2(Math.max(0, -dispo));
    const save = round2(Math.min(keep, reste));
    const dl = daysLeft();
    const today = mIn ? 0 : spentToday();
    // Ta part du jour, calculée au début de la journée : ce que tu pouvais encore dépenser ce matin, divisé par les jours qui restent
    const dayAllow = round2(Math.max(0, dispo + today) / Math.max(1, dl));
    return { m, spent, reste, keep, dispo, total, budget: total, room, over, save, dl, today, dayAllow, perDay: round2(room / Math.max(1, dl)), planSave: keep };
  }
  const sv = (n, fut) => (n < 0 ? `tu ${fut ? "perdrais" : "perdras"} <b>${eur0(-n)}</b>` : `tu ${fut ? "épargnerais" : "épargneras"} <b>${eur0(n)}</b>`);
  const instead = (n) => (n < 0 ? `au lieu d'en perdre ${eur0(-n)}` : `au lieu de ${eur0(n)}`);

  /* ---------- Le matelas ----------
     Ce qui est déjà de côté, plus ce que tu n'as pas dépensé chaque mois terminé et importé.
     La date : ton épargne de ce mois-ci, puis celle de ton budget les mois suivants, mois particuliers compris. */
  const cushionGoal = () => state.goals.find((g) => g.queue) || state.goals[0] || null;
  function cushion(x = {}) {
    const g = cushionGoal();
    if (!g) return null;
    const have = round2((g.saved || 0) + savingsFlow());
    const pct = g.target > 0 ? Math.max(0, Math.min(100, (have / g.target) * 100)) : 0;
    let cum = have + (x.gain || 0) - (x.once || 0);
    if (cum >= g.target) return { g, have, pct, eta: ymNow(), full: true };
    const base = plan().save;
    let ym = ymNow();
    for (let i = 0; i < 360; i++) {
      cum += i === 0 ? (x.thisSave !== undefined ? x.thisSave : now().save) : base + evNet(ym) - (x.monthly || 0);
      if (cum >= g.target) return { g, have, pct, eta: ym };
      ym = ymShift(ym, 1);
    }
    return { g, have, pct, eta: null };
  }
  const etaText = (c) => (!c ? "" : c.full ? "déjà rempli" : !c.eta ? "jamais rempli à ce rythme" : c.eta === ymNow() ? "rempli à la fin de ce mois" : `rempli fin ${monthName(c.eta)}`);
  const etaCompare = (c1, c0) => `Matelas ${etaText(c1)}${c1.eta === c0.eta && !!c1.full === !!c0.full ? ", même date" : ` au lieu de ${c0.full ? "déjà rempli" : c0.eta ? `fin ${monthName(c0.eta)}` : "jamais"}`}.`;
  const gearBtn = () => `<button class="navbtn" data-act="go" data-v="reglages" aria-label="Réglages">${ICON.gear}${backupLate() || !storageOK ? '<span class="dot"></span>' : ""}</button>`;

  /* ================= Mon budget : le tableau ================= */
  function planRow(c) {
    return `<div class="row pline">${tile(c)}<button class="pname" data-act="openCat" data-id="${esc(c.id)}"><span class="name">${esc(c.name)}</span></button><label class="pamt"><input inputmode="decimal" autocomplete="off" data-plan="${esc(c.id)}" value="${esc(amountText(c.budget))}" placeholder="0" aria-label="${esc(c.name)}, montant par mois"><span aria-hidden="true">€</span></label></div>`;
  }
  function planSection(kind, title, addLabel) {
    const cats = state.categories.filter((c) => c.kind === kind && c.active);
    return `<section class="section"><div class="sh"><h2>${title}</h2><span id="tot-${kind}">${eur0(sumKind(kind))}</span></div>
      <div class="rows">${cats.map(planRow).join("")}<button class="row addrow" data-act="planAdd" data-kind="${kind}">${ICON.plus}<span>${addLabel}</span></button></div></section>`;
  }
  function cushionHtml(cu) {
    if (!cu) return `<button class="cushion" data-act="editGoal"><span class="ct">Ajouter ton matelas de sécurité</span><span class="cs">L'appli te dit quand il sera rempli</span></button>`;
    return `<button class="cushion" data-act="editGoal" data-id="${esc(cu.g.id)}"><span class="ct"><b>${esc(cu.g.name)}</b> : ${eur0(cu.have)} sur ${eur0(cu.g.target)}</span><span class="cs" id="cushionEta">${cap(etaText(cu))}</span><i class="cbar" aria-hidden="true"><b style="width:${cu.pct}%"></b></i></button>`;
  }
  const evSub = (ym) => { const s = ym === ymNow() ? now().save : planMonth(ym); return `${cap(monthName(ym))} : ${sv(s).replace(/<\/?b>/g, "")} ce mois-là`; };
  function eventsSection() {
    const list = state.events.filter((e) => e.ym >= ymNow() && !e.done).sort((a, b) => (a.ym < b.ym ? -1 : a.ym > b.ym ? 1 : 0));
    // Un bloc par mois : ce qui change, puis ce que tu épargneras ce mois-là
    const months = [...new Set(list.map((e) => e.ym))];
    const blocks = months.map((ym) => `<div class="evmonth"><p class="daygroup" data-evym="${ym}">${evSub(ym)}</p><div class="rows">${list.filter((e) => e.ym === ym).map((e) => `<button class="row" data-act="editEvent" data-id="${esc(e.id)}"><span class="name">${esc(e.label)}</span><span class="amt ${e.type === "in" ? "in" : ""}">${e.type === "in" ? "+" : "−"}${eur0(e.amount)}</span></button>`).join("")}</div></div>`).join("");
    return `<section class="section"><div class="sh"><h2>Mois particuliers</h2></div>${blocks}<div class="rows"><button class="row addrow" data-act="editEvent">${ICON.plus}<span>Ajouter une rentrée ou une dépense prévue</span></button></div><p class="hint">Une prime, Noël, des vacances : ce qui ne tombe qu'un mois. Compté dans ton épargne de ce mois-là.</p></section>`;
  }
  function renderPlan() {
    const p = plan();
    let html = head("Mon budget", "Un mois normal", { right: gearBtn() });
    if (!storageOK) html += `<button class="callout bad" data-act="go" data-v="sauvegarde"><span><b>Ce navigateur n'enregistre pas tes données.</b> Fais une sauvegarde avant de fermer.</span>${ICON.chev}</button>`;
    html += `<section class="hero plan" id="planHero" data-mood="${p.save < 0 ? "red" : "calm"}">
      <p class="h-label" id="planLabel">${p.save < 0 ? "Tu perds" : "Tu épargnes"}</p>
      <p class="big" id="planSave">${eur0(Math.abs(p.save))}</p>
      <p class="per">par mois</p>
      ${cushionHtml(cushion())}
    </section>`;
    html += planSection("revenu", "Revenus", "Ajouter un revenu");
    html += planSection("fixe", "Charges fixes", "Ajouter une charge fixe");
    html += planSection("enveloppe", "Dépenses variables", "Ajouter une dépense variable");
    html += eventsSection();
    html += `<div class="savebar" id="saveBar" data-mood="${p.save < 0 ? "red" : "calm"}" aria-hidden="true"><span id="saveBarLabel">${p.save < 0 ? "Tu perds" : "Tu épargnes"}</span><b id="saveBarNum">${eur0(Math.abs(p.save))} par mois</b></div>`;
    app.innerHTML = html;
    watchHero();
  }
  // Pendant que tu tapes un montant : le résultat, les totaux et la date du matelas suivent, sans recharger l'écran
  function updatePlanNumbers() {
    const p = plan(), red = p.save < 0;
    const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
    set("planLabel", red ? "Tu perds" : "Tu épargnes"); set("planSave", eur0(Math.abs(p.save)));
    set("saveBarLabel", red ? "Tu perds" : "Tu épargnes"); set("saveBarNum", `${eur0(Math.abs(p.save))} par mois`);
    for (const k of ["revenu", "fixe", "enveloppe"]) set(`tot-${k}`, eur0(sumKind(k)));
    for (const id of ["planHero", "saveBar"]) { const e = document.getElementById(id); if (e) e.dataset.mood = red ? "red" : "calm"; }
    const cu = cushion(); if (cu) set("cushionEta", cap(etaText(cu)));
    for (const e of document.querySelectorAll("[data-evym]")) e.textContent = evSub(e.dataset.evym);
  }
  // Le résultat reste visible en bas quand le grand chiffre sort de l'écran
  function watchHero() {
    if (heroObs) { heroObs.disconnect(); heroObs = null; }
    const h = document.getElementById("planHero"), bar = document.getElementById("saveBar");
    if (!h || !bar || !("IntersectionObserver" in window)) return;
    heroObs = new IntersectionObserver(([e]) => bar.classList.toggle("on", !e.isIntersecting), { rootMargin: "-60px 0px 0px 0px" });
    heroObs.observe(h);
  }
  function planAddSheet(kind) {
    const lbl = { revenu: "Nouveau revenu", fixe: "Nouvelle charge fixe", enveloppe: "Nouvelle dépense variable" }[kind];
    const ph = { revenu: "Ex. : prime, missions", fixe: "Ex. : forfait téléphone", enveloppe: "Ex. : coiffeur, cadeaux" }[kind];
    openSheet(`<h2>${lbl}</h2><div class="field"><label for="pnName">Nom</label><input type="text" id="pnName" placeholder="${ph}" autocomplete="off"></div>
      <div class="field"><label for="pnAmt">Par mois</label>${moneyInput("pnAmt", 0, "Montant par mois")}</div><p class="err" id="pnErr" hidden></p>
      <div class="sheet-foot"><button class="btn primary" data-act="planAddSave" data-kind="${kind}">Ajouter</button></div>`, lbl);
  }

  /* ================= Et si… : ce qu'une dépense change à ton épargne ================= */
  // Une dépense ponctuelle rangée dans un budget ne coûte à l'épargne que ce qui dépasse ce qui restait prévu
  function scenOnce(s) {
    if (!s.once) return 0;
    if (!s.daily && !s.catId) return s.once;
    return round2(Math.max(0, now().save - whatIf(s.once, null, null).save));
  }
  const scenLine = (s) => [s.monthly ? `${eur0(s.monthly)} par mois` : "", s.once ? `${eur0(s.once)} une fois${s.daily || s.catId ? ", sur le disponible du mois" : ""}` : "", s.gain ? `rapporte ${eur0(s.gain)}` : ""].filter(Boolean).join(" · ");
  function renderEtsi() {
    let html = head("Et si…", "Ce qu'une dépense change à ton épargne", { right: gearBtn() });
    html += `<button class="btn primary addbtn" data-act="etsiOpen">${ICON.plus}Tester une dépense</button>`;
    const p = plan(), cu = cushion();
    let rows = `<button class="row cmp" data-act="go" data-v="budget"><span class="name">Sans rien changer</span><span class="amt">${eur0(p.save)}<span class="tag"> /mois</span></span><span class="sub">Ton budget actuel${cu ? ` · matelas ${etaText(cu)}` : ""}</span></button>`;
    for (const s of state.scenarios) {
      const save = round2(p.save - (s.monthly || 0)), once = scenOnce(s);
      const c2 = cu ? cushion({ monthly: s.monthly || 0, once, gain: s.gain || 0 }) : null;
      const d = round2(save - p.save);
      rows += `<button class="row cmp" data-act="editScen" data-id="${esc(s.id)}"><span class="name">${esc(s.name)}</span><span class="amt ${save < 0 ? "neg" : ""}">${eur0(save)}<span class="tag"> /mois</span></span>
        <span class="sub">${esc(scenLine(s))}${!d && once ? ` · <b class="neg">−${eur0(once)} d'épargne ce mois-ci</b>` : ""}${c2 ? `<br>${etaCompare(c2, cu)}` : ""}</span></button>`;
    }
    rows += `<button class="row addrow" data-act="editScen">${ICON.plus}<span>Ajouter une comparaison</span></button>`;
    html += `<section class="section"><div class="sh"><h2>Comparer</h2><span>épargne par mois</span></div><div class="rows">${rows}</div><p class="hint">Une voiture, un abonnement, un déménagement : ce que chaque choix te laisse chaque mois, et quand ton matelas est rempli.</p></section>`;
    app.innerHTML = html;
  }
  const keysHtml = () => ["1", "2", "3", "4", "5", "6", "7", "8", "9", ",", "0", "del"].map((k) => `<button type="button" class="key" data-act="key" data-v="${k}" aria-label="${k === "del" ? "Effacer" : k === "," ? "Virgule" : k}">${k === "del" ? ICON.del : k}</button>`).join("");
  function etsiSheet() {
    typed = ""; padDate = null; etsi = { mode: "once", cat: null };
    openSheet(`<h2>Et si je dépense…</h2>
      <div class="addamt num blank" id="padAmt" aria-live="polite">0<span class="cur">€</span></div>
      <div class="seg big" role="group" aria-label="Combien de fois"><button type="button" data-act="etsiMode" data-v="once" aria-pressed="true">Une fois, ce mois-ci</button><button type="button" data-act="etsiMode" data-v="month" aria-pressed="false">Chaque mois</button></div>
      <div class="etsires" id="etsiRes" aria-live="polite"></div>
      <div class="keys">${keysHtml()}</div>
      <div class="sheet-foot"><button class="btn secondary" data-act="etsiKeep">Garder pour comparer</button></div>`, "Et si je dépense");
    const sh = sheetHost.querySelector(".sheet"); if (sh) sh.classList.add("add");
    updateEtsi();
  }
  function updateEtsi() {
    const amtEl = document.getElementById("padAmt"), res = document.getElementById("etsiRes");
    if (!amtEl || !res) return;
    const a = parseAmount(typed || "0");
    amtEl.className = "addamt num" + (typed ? "" : " blank");
    amtEl.innerHTML = `${typed ? esc(typed) : "0"}<span class="cur">€</span>`;
    const cu0 = cushion();
    let r1, r2 = "", cls = "";
    if (etsi.mode === "once") {
      const t0 = now();
      if (!(a > 0)) { res.className = "etsires"; res.innerHTML = `<p class="r1">${t0.over > 0 ? `Tu as déjà dépassé de <b>${eur0(t0.over)}</b> ce mois-ci.` : `Tu peux encore dépenser <b>${eur0(t0.room)}</b> ce mois-ci.`}</p><p class="m">En gardant ${eur0(t0.keep)} d'épargne.</p>`; return; }
      const t1 = whatIf(a, null, null);
      if (t1.over < 0.5) {
        cls = "ok";
        r1 = `Tu pourrais encore dépenser <b>${eur0(t1.room)}</b> au lieu de ${eur0(t0.room)}.`;
        r2 = `<p class="m">Ton épargne reste à ${eur0(t1.save)}.</p>`;
      } else {
        cls = t1.save < 0 ? "ko" : "mid";
        r1 = `Tu dépasserais de <b>${eur0(t1.over)}</b>.`;
        r2 = `<p class="m">${t1.save < 0 ? `Ce mois-ci, tu perdrais ${eur0(-t1.save)}` : `Ton épargne du mois tomberait à ${eur0(t1.save)}`} au lieu de garder ${eur0(t0.save)}.</p>`;
        if (cu0) r2 += `<p class="m">${etaCompare(cushion({ thisSave: t1.save }), cu0)}</p>`;
      }
    } else {
      const p = plan();
      if (!(a > 0)) { res.className = "etsires"; res.innerHTML = `<p class="r1">Aujourd'hui, tu épargnes <b>${eur0(p.save)}</b> par mois.</p>${cu0 ? `<p class="m">Matelas ${etaText(cu0)}.</p>` : ""}`; return; }
      const after = round2(p.save - a);
      cls = after < 0 ? "ko" : "mid";
      r1 = `Chaque mois, ${sv(after, true)} ${instead(p.save)}.`;
      if (cu0) r2 = `<p class="m">${etaCompare(cushion({ monthly: a }), cu0)}</p>`;
    }
    res.className = `etsires ${cls}`;
    res.innerHTML = `<p class="r1">${r1}</p>${r2}`;
  }
  function scenSheet(id) {
    const s = id ? state.scenarios.find((x) => x.id === id) : { id: "", name: "", monthly: 0, once: 0, gain: 0 };
    if (!s) return;
    openSheet(`<h2>${id ? "Modifier la comparaison" : "Nouvelle comparaison"}</h2>
      <div class="field"><label for="sName">Nom</label><input type="text" id="sName" value="${esc(s.name)}" placeholder="Ex. : Peugeot 308 hybride" autocomplete="off"></div>
      <div class="field"><label for="sMonthly">Coûte chaque mois</label>${moneyInput("sMonthly", s.monthly, "Coûte chaque mois")}<p class="hint">Un loyer, une assurance, un abonnement.</p></div>
      <div class="grid2"><div class="field"><label for="sOnce">Coûte une fois</label>${moneyInput("sOnce", s.once, "Coûte une fois")}</div>
        <div class="field"><label for="sGain">Rapporte une fois</label>${moneyInput("sGain", s.gain, "Rapporte une fois")}</div></div>
      <p class="hint">Par exemple un apport de 3 000 €, et la vente de ta voiture actuelle pour 5 000 €.</p><p class="err" id="sErr" hidden></p>
      ${id ? `<button class="btn danger" data-act="delScen" data-id="${esc(s.id)}">Supprimer</button>` : ""}
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Annuler</button><button class="btn primary" data-act="saveScen" data-id="${esc(s.id)}">Enregistrer</button></div>`, "Comparaison");
  }

  /* ================= Ce mois-ci : le réel ================= */
  function renderMois() {
    const t = now(), m = t.m, dim = daysIn(m.ym), day = new Date().getDate();
    let html = head("Ce mois-ci", dateLong(), { subTop: true, right: gearBtn() });
    if (!storageOK) html += `<button class="callout bad" data-act="go" data-v="sauvegarde"><span><b>Ce navigateur n'enregistre pas tes données.</b> Fais une sauvegarde avant de fermer.</span>${ICON.chev}</button>`;
    html += cardsHtml(t);
    html += `<button class="btn primary addbtn" data-act="addOpen">${ICON.plus}Ajouter une dépense</button>`;
    html += paydayAlert();
    // Dépenses variables, dans l'ordre de Mon budget
    const envL = m.lines.filter((l) => l.c.kind === "enveloppe" && (l.c.active || l.actual > 0));
    const autre = m.uncl > 0 ? `<button class="row" data-act="opsAutre">${tileRaw("#8E8E93", "question")}<span class="name">Autre</span><span class="st">${eur0(m.uncl)}</span><span class="sub">${m.unclCount} dépense${m.unclCount > 1 ? "s" : ""} pas reconnue${m.unclCount > 1 ? "s" : ""}. Touche pour les ranger.</span></button>` : "";
    if (envL.length || autre) html += `<section class="section"><div class="sh"><h2>Dépenses variables</h2><span>${eur0(t.spent)} sur ${eur0(t.budget)}</span></div><div class="rows">${envL.map((l) => envRow(l, m, false)).join("")}${autre}</div></section>`;
    // Charges fixes : un rond à cocher quand c'est payé

    const paidN = pins.filter((p) => p.paid).length;
    if (pins.length) html += `<section class="section"><div class="sh"><h2>Charges fixes</h2><span>${paidN} payée${paidN > 1 ? "s" : ""} sur ${pins.length}</span></div><div class="rows">${pins.map((p) => billRow(p, false, day)).join("")}</div><p class="hint">Touche le rond quand c'est payé. Le relevé importé coche les prélèvements tout seul.</p></section>`;
    html += recentHtml(5);
    // Le mois dernier, en un chiffre

  // Jauge en demi-cercle : pleine en début de mois, elle se vide à mesure que tu dépenses.
  // Le trait marque où tu devrais en être aujourd'hui pour finir le mois pile dans ton budget.
  function gauge(frac, tick) {
    const f = Math.max(0, Math.min(1, frac || 0)), cx = 120, cy = 118, r = 100;
    const at = (u, rr) => { const a = Math.PI * (1 - u); return [(cx + rr * Math.cos(a)).toFixed(1), (cy - rr * Math.sin(a)).toFixed(1)]; };
    const arc = "M20 118 A100 100 0 0 1 220 118";
    let t = "";
    if (tick !== null && tick !== undefined) { const [x1, y1] = at(Math.max(0, Math.min(1, tick)), r - 14), [x2, y2] = at(Math.max(0, Math.min(1, tick)), r + 14); t = `<line class="g-tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }
    return `<svg class="gauge" viewBox="0 0 240 132" aria-hidden="true"><path class="g-bg" d="${arc}" pathLength="100"/>${f > 0.004 ? `<path class="g-val" d="${arc}" pathLength="100" stroke-dasharray="${(f * 100).toFixed(2)} 100"/>` : ""}${t}</svg>`;
  }
  let cardIdx = 0;
  function cardsHtml(t) {
    const dim = daysIn(t.m.ym);
    // 1. Tu peux encore dépenser
    const pace = t.total > 0 ? t.dl / dim : null;
    const m1 = t.over > 0 ? "red" : t.total > 0 && t.room / t.total < pace - 0.02 ? "tight" : "calm";
    const foot1 = t.over > 0 ? (t.save < 0 ? `Ce mois-ci, tu perds <b>${eur0(-t.save)}</b> au lieu de garder ${eur0(t.keep)}.` : `Ton épargne du mois tombe à <b>${eur0(t.save)}</b> au lieu de ${eur0(t.keep)}.`) : m1 === "tight" ? "Tu vas un peu vite : le trait montre où tu devrais en être aujourd'hui." : "Tu es dans les temps.";
    const c1 = `<button class="card" data-act="card" data-i="1" data-mood="${m1}" aria-label="${t.over > 0 ? `Dépassé de ${eur0(t.over)}` : `Tu peux encore dépenser ${eur0(t.room)} sur ${eur0(t.total)}`}. Voir le calcul">
      <span class="c-label">${t.over > 0 ? "Tu as dépassé de" : "Tu peux encore dépenser"}</span>
      <span class="gwrap">${gauge(t.total > 0 ? t.room / t.total : 0, t.over > 0 ? null : pace)}<span class="gtext"><span class="big" id="freeNum">${eur0(shownFree ?? (t.over > 0 ? t.over : t.room))}</span></span></span>
      <span class="g-sub">${t.over > 0 ? "de plus que ce que tu pouvais dépenser ce mois-ci" : `sur ${eur0(t.total)} ce mois-ci${t.dl > 1 && t.room > 0 ? `, soit ${eur0(t.perDay)} par jour` : ""}`}</span>
      ${t.over > 0 ? "" : `<span class="c-keep"><i aria-hidden="true"></i>En gardant <b>${eur0(t.keep)}</b> d'épargne</span>`}
      <span class="c-foot">${foot1}</span></button>`;
    // 2. Le calcul, en quatre lignes
