<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2F5F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fin de mois">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<title>Fin de mois</title>
<style>
/* Fin de mois, version 9.
   Trois mots : Fixe, De côté, À dépenser. Trois écrans : Aujourd'hui, Et si, Mon budget.
   Un seul calcul : salaire - fixe - de côté = à dépenser. Chaque dépense se retire de ce montant. */
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Figtree"; src: url("fonts/figtree.woff2") format("woff2"); font-weight: 300 900; font-display: swap; }
:root {
  --bg: #F2F5F4; --surface: #FFFFFF; --ink: #10242E; --muted: #4F626B; --accent: #0A6C87; --accent-press: #085A71;
  --track: #D5DEE0; --line: #E4EAEB; --handle: #C3CED1; --seg: #E1E8E9; --over: #A8470B;
  --text: "Figtree", system-ui, -apple-system, sans-serif;
  --num: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --ease: cubic-bezier(.32, .72, 0, 1);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 16px; line-height: 1.3; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overscroll-behavior: none; touch-action: manipulation; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-appearance: none; appearance: none; }
h1, p { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: var(--safe-t); }
#view { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#view.fixed { overflow: hidden; }

/* Onglets */
#tabs { display: flex; gap: 4px; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 12px calc(6px + var(--safe-b)); position: relative; z-index: 3; }
#tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; color: var(--muted); font-size: 12px; font-weight: 600; text-decoration: none; border-radius: 12px; }
#tabs a[aria-current="page"] { color: var(--accent); font-weight: 700; }

/* Boutons */
.cta { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 58px; border: 0; border-radius: 18px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; }
.cta:active { background: var(--accent-press); }
.cta:disabled { background: var(--track); color: var(--muted); cursor: default; }
.ghost { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border: 2px solid var(--accent); border-radius: 16px; background: transparent; color: var(--accent); font-size: 16px; font-weight: 700; }
.ghost:active { background: rgba(10, 108, 135, .08); }
.link { border: 0; background: transparent; padding: 0; color: var(--accent); font-size: 15px; font-weight: 600; min-height: 44px; }
.link.danger { color: var(--over); }

/* ============ Aujourd'hui ============ */
.home { height: 100%; display: flex; flex-direction: column; position: relative; }
.hero { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 8px 20px 12px; }
.hero .date { font-size: 15px; font-weight: 600; color: var(--muted); }
.calc4 { width: 100%; background: var(--surface); border-radius: 20px; padding: 4px 18px 0; display: flex; flex-direction: column; }
.lines { display: flex; flex-direction: column; width: 100%; padding: 0; border: 0; background: transparent; text-align: left; }
.ln { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 4px 0; }
.ln + .ln { border-top: 1px solid var(--line); }
.ln .sg { flex: none; width: 14px; font-size: 18px; font-weight: 700; color: var(--muted); text-align: center; }
.ln .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.ln .nm b { font-size: 16px; font-weight: 600; }
.ln .nm small { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ln .am { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.total4 { border-top: 2px solid var(--ink); padding: 12px 0 14px; display: flex; flex-direction: column; gap: 2px; }
.total4.first { border-top: 0; }
.total4 .lab { font-size: 15px; font-weight: 600; }
.total4 .big { font-size: 52px; line-height: 56px; }
.total4 .big .dec { font-size: 26px; }
.total4 .big.long { font-size: 46px; }
.total4 .per { font-size: 16px; font-weight: 600; color: var(--muted); }
.total4.over .lab, .total4.over .big { color: var(--over); }
.big { font-family: var(--num); font-weight: 700; font-size: 58px; line-height: 60px; letter-spacing: -1px; white-space: nowrap; }
.big .dec { font-size: 28px; letter-spacing: 0; }
.big.long { font-size: 48px; }
.big.long .dec { font-size: 24px; }
.over .lab, .over .big { color: var(--over); }
.out2 { border-radius: 16px; background: var(--bg); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.out2 .big { font-size: 36px; line-height: 40px; }
.out2 .big .dec { font-size: 20px; }
.out2 span { font-size: 15px; color: var(--muted); }
.compact { display: none; padding: 4px 24px 16px; flex-direction: column; gap: 12px; }
.compact .top { display: flex; justify-content: space-between; align-items: flex-end; }
.compact .lab { font-size: 14px; font-weight: 500; color: var(--muted); }
.compact .big { font-size: 36px; line-height: 40px; letter-spacing: -.5px; }
.compact .big .dec { font-size: 20px; }
.compact .r { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; padding-bottom: 4px; text-align: right; }
.compact .r .v { font-size: 16px; font-weight: 700; }
.compact .r .s { font-size: 13px; color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }

.sheet { position: relative; background: var(--surface); border-radius: 28px 28px 0 0; padding: 0 20px; display: flex; flex-direction: column; min-height: 0; z-index: 1; }
.sheet::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 100vh; background: var(--surface); }
.grab { display: flex; flex-direction: column; width: 100%; border: 0; background: transparent; padding: 0; text-align: left; touch-action: none; }
.grab .h { display: flex; justify-content: center; align-items: center; height: 26px; }
.grab .h i { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--handle); }
.grab .sum { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 4px 14px; gap: 12px; }
.grab .sum b { font-size: 15px; font-weight: 600; }
.grab .sum span { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sheet-body { min-height: 0; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 6px 4px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
.row .l { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.row .n { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .d { font-size: 13px; color: var(--muted); }
.row .a { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { padding: 18px 4px; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted); }
.homecta { background: var(--surface); padding: 12px 20px 14px; position: relative; z-index: 2; }
.detail { display: none; }
.home[data-open="1"] .hero { display: none; }
.home[data-open="1"] .compact { display: flex; }
.home[data-open="1"] .sheet { flex: 1; }
.home[data-open="1"] .sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.home[data-open="1"] .peek { display: none; }
.home[data-open="1"] .detail { display: block; padding-bottom: 8px; }
.cats { display: flex; flex-direction: column; gap: 12px; padding: 10px 4px 14px; border-top: 1px solid var(--line); }
.cat { display: flex; flex-direction: column; gap: 5px; }
.cat .t { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.cat .t b { font-size: 15px; font-weight: 600; }
.cat .t span { font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cat .t span b { font-size: 14px; font-weight: 700; }
.cat .t span.o b { color: var(--over); }
.cat .bar { height: 6px; background: var(--line); }
.cat .bar > i.o { background: var(--over); }
.hint { font-size: 13px; line-height: 17px; color: var(--muted); }
.sec { display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 4px; border-top: 1px solid var(--line); }
.sec b { font-size: 15px; font-weight: 600; }
.detail .row { min-height: 48px; }
.detail .row .n, .detail .row .a { font-size: 15px; }
@media (max-height: 760px) { .peek .row:nth-child(n+2) { display: none; } .hero { justify-content: flex-start; } .ln { min-height: 46px; } .total4 .big { font-size: 44px; line-height: 48px; } }

/* ============ Pages Et si, Mon budget ============ */
.page { padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
.page h1 { margin: 0 4px; font-family: var(--num); font-size: 30px; line-height: 34px; font-weight: 700; letter-spacing: -.3px; }
.page .lead { margin: -10px 4px 0; font-size: 15px; color: var(--muted); }
.card { display: flex; flex-direction: column; border-radius: 18px; background: var(--surface); padding: 4px 18px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--seg); }
.seg button { flex: 1; height: 44px; border: 0; border-radius: 11px; background: transparent; font-size: 15px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); font-weight: 700; color: var(--ink); }
.field { border: 2px solid var(--accent); padding: 2px 18px; }
.field .f { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
.field .f + .f { border-top: 1px solid var(--line); }
.field label { font-size: 15px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.field .amt { display: flex; align-items: baseline; gap: 6px; }
.field input { min-width: 0; padding: 0; border: 0; outline: 0; background: transparent; text-align: right; }
.field input.n { width: 150px; font-family: var(--num); font-size: 44px; line-height: 60px; font-weight: 700; }
.field input.n.sm { font-size: 36px; }
.field .amt span { font-family: var(--num); font-size: 26px; font-weight: 700; }
.field input.t { flex: 1; font-size: 16px; font-weight: 600; }
.field input::placeholder { color: var(--handle); }
.res { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; }
.res + .res, .res + .resx, .resx + .res { border-top: 1px solid var(--line); }
.res .k { font-size: 16px; font-weight: 600; line-height: 20px; }
.res .v { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; text-align: right; }
.res .v b { font-family: var(--num); font-size: 26px; line-height: 30px; font-weight: 700; white-space: nowrap; }
.res .v.m b { font-size: 24px; line-height: 28px; }
.res .v span { font-size: 13px; color: var(--muted); }
.resx { padding: 14px 0; display: flex; flex-direction: column; gap: 8px; }
.resx .res { padding: 0; border: 0; }
.resx p { font-size: 13px; line-height: 18px; color: var(--muted); }
.list { display: flex; flex-direction: column; padding: 0 4px; }
.list .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 6px 0 8px; }
.list .head b { font-size: 15px; font-weight: 700; }
.list .head span { font-size: 13px; color: var(--muted); text-align: right; }
.scen { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--track); }
.scen .pick { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 54px; padding: 4px 0; border: 0; background: transparent; text-align: left; min-width: 0; }
.scen .l { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.scen .l b { font-size: 15px; font-weight: 600; }
.scen .l span, .scen .r span { font-size: 13px; color: var(--muted); }
.scen .r { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.scen .r b { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scen .x { width: 44px; height: 44px; margin-right: -12px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.grow { flex: 1; }

/* Mon budget : le tableau */
.tbl { padding: 6px 16px; }
.tr { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 50px; }
.tr.main { min-height: 56px; border-top: 1px solid var(--line); }
.tr.main:first-child { border-top: 0; min-height: 64px; }
.tr.total { min-height: 80px; border-top: 2px solid var(--ink); }
.tr .name { display: flex; flex-direction: column; gap: 1px; min-width: 0; border: 0; background: transparent; padding: 0; text-align: left; font-size: 15px; font-weight: 500; min-height: 44px; justify-content: center; flex: 1; }
.tr .name small { font-size: 13px; line-height: 17px; font-weight: 400; color: var(--muted); }
.tr.main .name, .tr.total .name, .tr .hd { font-size: 17px; font-weight: 700; }
.tr .name .q { color: var(--muted); font-weight: 400; }
.tr .calc { padding-right: 12px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tr.main .calc { font-size: 17px; font-weight: 700; }
.tr.total .calc { font-family: var(--num); font-size: 32px; line-height: 36px; font-weight: 700; color: var(--accent); }
.cell { width: 96px; height: 38px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--bg); text-align: right; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cell:focus { outline: 2px solid var(--accent); outline-offset: 0; background: #fff; }
.tr.main .cell { width: 108px; height: 40px; font-size: 17px; font-weight: 700; }
.sub { padding-left: 4px; }
.tick { flex: none; width: 44px; height: 44px; margin: 0 -4px 0 -12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; }
.tick i { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; border: 2px solid var(--handle); color: transparent; }
.tick[aria-pressed="true"] i { background: var(--accent); border-color: var(--accent); color: #fff; }
.minus { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; }
.add { align-self: flex-start; min-height: 46px; }
.note { margin: 4px 0 10px; padding: 10px 14px; border-radius: 12px; background: var(--bg); font-size: 14px; line-height: 19px; }
.note p + p { margin-top: 4px; }
.tbl .tr.up { min-height: 58px; border-top: 1px solid var(--line); }
.stack { display: flex; flex-direction: column; gap: 8px; }
.foot { display: flex; flex-direction: column; align-items: center; gap: 0; }
.foot small { font-size: 13px; color: var(--muted); padding-top: 4px; text-align: center; }

/* ============ Ajouter une dépense (plein écran) ============ */
#add { position: fixed; inset: 0; z-index: 20; background: var(--surface); display: flex; flex-direction: column; padding: calc(var(--safe-t) + 4px) 20px calc(14px + var(--safe-b)); }
#add.in { animation: up .34s var(--ease); }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
#add .bar0 { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
#add .bar0 b { font-size: 16px; font-weight: 700; }
#add .bar0 .link { min-width: 72px; text-align: left; font-size: 16px; }
#add .bar0 .link.r { text-align: right; }
#add .amount { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 0 20px; }
#add .amount .big { font-size: 64px; line-height: 66px; }
#add .amount .big .dec { font-size: 32px; }
#add .amount .big.zero { color: var(--handle); }
#add .amount p { font-size: 15px; color: var(--muted); min-height: 20px; }
#add .amount p b { color: var(--ink); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid var(--handle); background: var(--surface); font-size: 15px; font-weight: 600; }
.chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
.opts { display: flex; gap: 8px; margin-top: 12px; }
.opt { position: relative; flex: 1; min-width: 0; height: 46px; border-radius: 12px; border: 0; background: var(--bg); font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 12px; }
.opt.m { color: var(--muted); }
.opt input[type="date"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
input.opt { text-align: left; font-weight: 500; font-size: 16px; }
.pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pad button { height: 56px; border-radius: 14px; border: 0; background: var(--bg); font-family: var(--num); font-size: 26px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.pad button:active { background: var(--track); }
#add .cta { margin-top: 12px; }
@media (max-height: 700px) { .pad button { height: 48px; } #add .amount { padding: 8px 0 12px; } #add .amount .big { font-size: 52px; line-height: 54px; } }

/* ============ Feuilles (petits réglages) ============ */
#scrim { position: fixed; inset: 0; z-index: 30; background: rgba(16, 36, 46, .38); display: flex; align-items: flex-end; }
#modal { width: 100%; max-height: calc(100% - var(--safe-t) - 24px); background: var(--surface); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; padding-bottom: calc(14px + var(--safe-b)); animation: up .3s var(--ease); }
#modal .mh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px 6px; }
#modal .mh b { font-family: var(--num); font-size: 22px; font-weight: 700; }
#modal .mb { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 20px 4px; display: flex; flex-direction: column; gap: 14px; }
#modal .mf { padding: 12px 20px 0; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld label, .fld .lb { font-size: 14px; font-weight: 600; color: var(--muted); }
.fld input, .fld select { height: 50px; padding: 0 14px; border: 1.5px solid var(--handle); border-radius: 12px; background: var(--surface); font-size: 17px; font-weight: 600; width: 100%; }
.fld input:focus, .fld select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.fld small { font-size: 13px; color: var(--muted); }
.err { font-size: 14px; color: var(--over); font-weight: 600; }
#mDiff { display: flex; flex-direction: column; gap: 10px; }
.txt { font-size: 15px; line-height: 21px; }
.check { display: flex; align-items: center; gap: 4px; min-height: 48px; border-top: 1px solid var(--line); }
.check:first-of-type { border-top: 0; }
.check .lbl { flex: 1; font-size: 15px; font-weight: 500; min-width: 0; }
.check .lbl small { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check .amt2 { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.check select { height: 38px; max-width: 150px; border: 1.5px solid var(--handle); border-radius: 10px; background: var(--surface); font-size: 16px; font-weight: 600; padding: 0 6px; }
.day { padding: 10px 4px 4px; font-size: 13px; font-weight: 600; color: var(--muted); }

/* ============ Réglage de départ ============ */
.setup { padding: 20px 20px calc(24px + var(--safe-b)); display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
.setup h1 { font-family: var(--num); font-size: 34px; line-height: 38px; font-weight: 700; letter-spacing: -.4px; }
.setup .lead { font-size: 16px; line-height: 22px; color: var(--muted); margin-top: -8px; }
.setup .q { font-size: 16px; font-weight: 700; margin: 0 4px 8px; }
.setup .out { border-radius: 18px; background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; }
.setup .out .big { font-size: 40px; line-height: 44px; }
.setup .out .big .dec { font-size: 22px; }
.setup .out span { font-size: 15px; color: var(--muted); }

#toast { position: fixed; left: 16px; right: 16px; top: calc(10px + var(--safe-t)); z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 14px; background: var(--ink); color: #fff; font-size: 15px; font-weight: 500; animation: pop .25s var(--ease); }
#toast button { border: 0; background: transparent; color: #9FD8E8; font-weight: 700; font-size: 15px; min-height: 32px; padding: 0 4px; }
@keyframes pop { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>

<div id="app">
  <main id="view"></main>
  <nav id="tabs" aria-label="Écrans" hidden>
    <a href="#aujourdhui" data-tab="aujourdhui">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 17l3.5-5"/></svg>
      <span>Aujourd'hui</span>
    </a>
    <a href="#etsi" data-tab="etsi">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20V4"/><path d="M6 14c0-3.5 2-5.5 5.5-5.5H18"/><path d="M15 5.5l3 3-3 3"/></svg>
      <span>Et si</span>
    </a>

<input type="file" id="jsonFile" accept=".json,application/json,text/plain" class="sr" tabindex="-1" aria-hidden="true">

<script>
(function () {
  "use strict";

  /* ================= Outils ================= */
  const KEY = "fin-de-mois.v9";
  const APP = "fin-de-mois";
  const VERSION = "9.1";
  const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  const MOIS_C = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
  const NB = "\u00A0";
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const pad = (n) => String(n).padStart(2, "0");
  const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
  const sum = (a, f) => a.reduce((t, x) => t + (f ? f(x) : x), 0);
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const f2 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const f0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
  const sg = (n) => (n < 0 ? "−" : "");
  const sp = (t) => t.replace(/[\u202F\u00A0]/g, NB);                         // 1 075 : une espace qui se voit
  const e2 = (n) => sg(r2(n)) + sp(f2.format(Math.abs(r2(n)))) + NB + "€";       // 745,00 €
  const e0 = (n) => sg(n) + sp(f0.format(Math.abs(n))) + NB + "€";               // 745 €
  const eA = (n) => (Number.isInteger(r2(n)) ? e0(r2(n)) : e2(n));            // sans centimes quand c'est rond
  const raw = (n) => (n || n === 0 ? String(r2(n)).replace(".", ",") : "");  // pour une case en cours de saisie
  const big = (n, cls) => { const a = Math.abs(r2(n)); const s = sp(f2.format(a)); const i = s.lastIndexOf(","); return `<div class="big${a >= 1000 ? " long" : ""}${cls ? " " + cls : ""}">${sg(r2(n))}${s.slice(0, i)}<span class="dec">${s.slice(i)}${NB}€</span></div>`; };

  function parseAmount(v) {
    let s = String(v == null ? "" : v).replace(/eur/gi, "").replace(/[\s\u00A0\u202F€]/g, "").replace("−", "-");
    if (!s) return NaN;
    if (s.includes(",") && s.includes(".")) { if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", "."); else s = s.replace(/,/g, ""); }
    else s = s.replace(",", ".");
    if (!/^[+-]?\d*\.?\d+$/.test(s)) return NaN;
    return Number(s);
  }
  const pos = (v) => { const n = parseAmount(v); return isFinite(n) && n >= 0 ? r2(n) : NaN; };

  /* ================= Dates et mois de paie ================= */
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const pISO = (s) => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
  const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const dDays = (a, b) => Math.round((a - b) / 864e5);
  const jour = (d) => (d.getDate() === 1 ? "1er" : String(d.getDate()));
  const dLong = (d) => `${jour(d)} ${MOIS[d.getMonth()]}`;
  const ymOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const ymName = (ym) => MOIS[Number(ym.slice(5)) - 1];

  function payDate(y, m, pd) { const dim = new Date(y, m + 1, 0).getDate(); return new Date(y, m, Math.min(pd || S.payDay, dim)); }
  // Un mois va de la paie à la veille de la paie suivante
  function periodOf(d, pd) {
    pd = pd || S.payDay;
    let s = payDate(d.getFullYear(), d.getMonth(), pd);
    if (d < s) s = payDate(d.getFullYear(), d.getMonth() - 1, pd);
    const next = payDate(s.getFullYear(), s.getMonth() + 1, pd);
    const end = addD(next, -1);
    return { start: s, end, next, days: dDays(next, s), s: iso(s), e: iso(end), key: iso(s), ym: ymOf(pd > 15 ? end : s) };
  }
  const cur = () => periodOf(today());
  function relDay(isoDate) {
    const d = pISO(isoDate), n = dDays(today(), d);
    if (n === 0) return "aujourd'hui";
    if (n === 1) return "hier";
    if (n > 1 && n < 7) return JOURS[d.getDay()];
    return `${d.getDate()} ${MOIS_C[d.getMonth()]}`;
  }

  /* ================= Données ================= */
  // Ce que le relevé du 9 octobre 2026 a appris sur tes commerçants
  const SEED_RULES = { "mepro stat dac": "essence", "thimont": "essence", "mepro": "courses", "le nemrod": "restos", "tout va bien": "restos", "bmbz": "restos", "le cafe du bonhe": "restos" };
  function fresh() {
    return {
      v: 9, payDay: 30, salary: 1972, aside: 350, livret: 1500,
      fixed: [
        { id: "loyer", name: "Loyer et charges", amount: 410, day: 3, note: "" },
        { id: "edf", name: "EDF", amount: 40, day: null, note: "" },
        { id: "salle", name: "Salle de sport à Meaux", amount: 30, day: null, note: "toutes les 4 semaines" },
        { id: "gmf", name: "Assurance GMF", amount: 48, day: null, note: "" },
        { id: "revolut", name: "Revolut", amount: 19, day: null, note: "" },
        { id: "abos", name: "Abonnements", amount: 6, day: null, note: "OD3ON" },
      ],
      cats: [
        { id: "courses", name: "Courses", budget: 300 },
        { id: "essence", name: "Essence", budget: 200 },
        { id: "restos", name: "Restos et sorties", budget: 200 },
        { id: "liquide", name: "Liquide", budget: 100 },
      ],
      autresNote: "Basic-Fit, shopping, pharmacie",
      upcoming: [
        { id: "prime", name: "Prime d'intégration", amount: 500, ym: "2026-12" },
        { id: "noel", name: "Noël", amount: -300, ym: "2026-12" },
        { id: "vacances", name: "Vacances d'hiver", amount: -500, ym: null },
      ],
      scenarios: [
        { id: "s308", name: "Peugeot 308", monthly: 310, note: "" },
        { id: "captur", name: "Renault Captur", monthly: 317, note: "" },
        { id: "formentor", name: "Cupra Formentor", monthly: 418, note: "assurance comprise" },
      ],
      expenses: [], paid: {}, asideDone: {}, got: {}, doneUp: {}, early: null, bal: null, balAt: null, rules: Object.assign({}, SEED_RULES),
      cur: null, setupDone: false, setupAt: null, csvKeys: [], ignoredKeys: [], model: 2,
    };
  }
  function valid(s) { return s && typeof s === "object" && s.v === 9 && Array.isArray(s.fixed) && Array.isArray(s.cats) && Array.isArray(s.expenses) && typeof s.salary === "number"; }
  // De la version 9.0 (on partait du budget) à la 9.1 (on part du solde du compte) : rien n'est perdu
  function migrate(s) {
    if (s.model === 2) return s;
    const P = periodOf(today(), s.payDay || 30);
    if (s.setupDone) {
      const fixe = sum(s.fixed, (f) => f.amount);
      const ex = (s.upcoming || []).filter((u) => u.ym === P.ym && u.amount);
      const res = ex.filter((u) => u.amount < 0).map((u) => ({ id: u.id, amount: -u.amount, spent: 0 }));
      let normal = 0;
      for (const e of s.expenses) { if (e.date < P.s || e.date > P.e) continue; const r = res.find((r) => r.id === e.cat); if (r) r.spent += e.amount; else normal += e.amount; }
      const aDep = s.salary - fixe - s.aside + sum(ex.filter((u) => u.amount > 0), (u) => u.amount) - sum(res, (r) => r.amount);
      const reste = aDep - normal - sum(res, (r) => Math.max(0, r.spent - r.amount));
      const wasPaid = (f) => {
        const t = ((s.paid || {})[P.key] || {})[f.id];
        if (t === true || t === false) return t;
        if (!f.day) return false;
        for (let d = P.start; d <= P.end; d = addD(d, 1)) { const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); if (d.getDate() === Math.min(f.day, dim)) return d <= today(); }
        return false;
      };
      const paid = {}; for (const f of s.fixed) if (wasPaid(f)) paid[f.id] = true;
      const unpaid = sum(s.fixed.filter((f) => !paid[f.id]), (f) => f.amount);
      const pending = (s.asideDone || {})[P.key] ? 0 : s.aside;
      // le solde que l'ancienne version avait en tête
      s.bal = s.balanceSet ? r2(reste + unpaid + pending + sum(res, (r) => Math.max(0, r.amount - r.spent)) + (s.carry || 0)) : null;
      s.balAt = s.balanceSet ? iso(today()) : null;
      // d'après le relevé du 9 octobre 2026 : EDF et l'abonnement OD3ON sont déjà passés ce mois-ci
      if (P.key === "2026-09-30") { paid.edf = true; paid.abos = true; }
      s.paid = { [P.key]: paid };
      s.asideDone = (s.asideDone || {})[P.key] ? { [P.key]: true } : {};
      s.got = { [P.key]: { salary: true } };
    } else { s.paid = {}; s.asideDone = {}; s.got = {}; s.bal = null; s.balAt = null; }
    s.expenses = s.expenses.filter((e) => e.cat !== "avant");
    for (const e of s.expenses) if (e.src === "manuel" && e.note === "Oubli") { e.src = "solde"; e.cat = "sansdetail"; e.note = ""; }
    if (!s.fixed.some((f) => f.id === "abos" || /abonnement/i.test(f.name))) s.fixed.push({ id: "abos", name: "Abonnements", amount: 6, day: null, note: "OD3ON" });
    s.rules = Object.assign({}, SEED_RULES, s.rules || {});
    s.doneUp = {}; s.early = null;
    delete s.carry; delete s.balanceSet; delete s.closed; delete s.setupKey;
    s.model = 2;
    return s;
  }
  function repair(s) {
    migrate(s);
    const d = fresh();
    for (const k of Object.keys(d)) if (s[k] === undefined || s[k] === null && !["cur", "setupAt", "bal", "balAt", "early"].includes(k)) s[k] = d[k];
    return s;
  }
  let storageOK = true;
  let S = load() || fresh();
  function load() {
    try { const t = localStorage.getItem(KEY); if (!t) return null; const s = JSON.parse(t); return valid(s) ? repair(s) : null; }
    catch (e) { storageOK = false; return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; }
    try { if (navigator.storage && navigator.storage.persist && !save.asked) { save.asked = true; navigator.storage.persist().catch(() => {}); } } catch (e) {}
  }
  const catName = (id, P) => {
    if (id === "sansdetail") return "Sans détail";
    const c = S.cats.find((c) => c.id === id); if (c) return c.name;
    const u = S.upcoming.find((u) => u.id === id && u.amount < 0 && (!P || u.ym === P.ym)); if (u) return u.name;
    return "Autres";
  };

  /* ================= Le calcul ================= */
  // Tout part du solde du compte. On y ajoute ce qui doit encore arriver, on en retire ce qui doit encore partir.
  const flags = (P) => ({ paid: S.paid[P.key] || {}, got: S.got[P.key] || {}, done: S.doneUp[P.key] || {} });
  const catKey = (id, P) => (id === "sansdetail" || S.cats.some((c) => c.id === id) || S.upcoming.some((u) => u.id === id && u.amount < 0 && u.ym === P.ym) ? id : "autres");
  // minus : une somme à retirer en plus, pour répondre à « et si »
  function compute(P, minus) {
    const F = flags(P);
    const fixe = r2(sum(S.fixed, (f) => f.amount));
    const base = r2(S.salary - fixe - S.aside);                    // le plan d'un mois ordinaire
    const list = S.expenses.filter((e) => e.date >= P.s && e.date <= P.e);
    const byCat = {}; for (const e of list) { const k = catKey(e.cat, P); byCat[k] = r2((byCat[k] || 0) + e.amount); }
    const total = r2(sum(list, (e) => e.amount));
    const ex = S.upcoming.filter((u) => u.ym === P.ym && u.amount);
    const coming = [];                                              // ce qui doit encore arriver sur le compte
    if (!F.got.salary) coming.push({ id: "salary", name: "Salaire", amount: S.salary });
    for (const u of ex) if (u.amount > 0 && !F.got[u.id]) coming.push({ id: u.id, name: u.name, amount: u.amount });
    const unpaid = S.fixed.filter((f) => !F.paid[f.id]);            // les factures qui doivent encore partir
    const bills = r2(sum(unpaid, (f) => f.amount));
    const livret = S.asideDone[P.key] ? 0 : S.aside;                // ce qui doit encore aller sur le livret
    const kept = ex.filter((u) => u.amount < 0 && !F.done[u.id]).map((u) => ({ id: u.id, name: u.name, amount: r2(Math.max(0, -u.amount - (byCat[u.id] || 0))) })).filter((k) => k.amount > 0);
    const early = S.early === iso(P.next) ? S.salary : 0;           // la paie du mois suivant, arrivée en avance
    const known = typeof S.bal === "number";
    const bal = known ? S.bal : 0;
    const vivre = r2(bal + sum(coming, (k) => k.amount) - bills - livret - sum(kept, (k) => k.amount) - early - (minus || 0));
    const t = today();
    const left = Math.max(1, dDays(P.end, t) + 1);                  // jours restants, aujourd'hui compris
    const elapsed = Math.max(1, dDays(t, P.start) + 1);
    const perDay = Math.floor(Math.max(0, vivre) / left);
    return { fixe, base, list, byCat, total, coming, unpaid, bills, livret, kept, early, known, bal, vivre, left, elapsed, perDay, basePerDay: Math.floor(Math.max(0, base) / P.days) };
  }
  // Essayer un changement sans rien enregistrer : on modifie, on calcule, on remet tout en place
  function simulate(mut, fn) {
    const keys = ["expenses", "bal", "paid", "got", "doneUp", "asideDone", "early"];
    const saved = {}; for (const k of keys) saved[k] = S[k];
    for (const k of ["paid", "got", "doneUp", "asideDone"]) S[k] = JSON.parse(JSON.stringify(S[k]));
    S.expenses = S.expenses.slice();
    try { mut(); return fn(); } finally { for (const k of keys) S[k] = saved[k]; }
  }
  // Une dépense saisie à la main fait baisser le solde connu, sauf si elle date d'avant la dernière mise à jour du solde
  const hits = (date) => typeof S.bal === "number" && (!S.balAt || date >= S.balAt);

  // Changement de mois : les coches repartent à zéro
  function ensurePeriod() {
    const P = cur();
    if (S.cur !== P.key) {
      for (const k of ["paid", "asideDone", "got", "doneUp"]) { const keep = {}; if (S[k][P.key]) keep[P.key] = S[k][P.key]; S[k] = keep; }
      if (S.early === P.key) { S.got[P.key] = Object.assign({}, S.got[P.key], { salary: true }); S.early = null; }
      S.cur = P.key; save();
    }
    return P;
  }

  /* ================= Navigation ================= */
  const view = $("#view"), tabs = $("#tabs");
  const TABS = ["aujourdhui", "etsi", "budget"];
  let tab = "aujourdhui";
  let homeOpen = false;
  let etsi = { mode: "once", amount: "", name: "", monthly: "" };

  function go(t) { tab = TABS.includes(t) ? t : "aujourdhui"; if (!toastFn) toastEl.hidden = true; if (location.hash !== "#" + tab) { try { history.replaceState(null, "", "#" + tab); } catch (e) {} } render(); view.scrollTop = 0; }
  window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (t !== tab) go(t); });

  function render() {
    if (!S.setupDone) { tabs.hidden = true; view.classList.remove("fixed"); renderSetup(); return; }
    ensurePeriod();
    tabs.hidden = false;
    for (const a of $$("a", tabs)) { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }
    view.classList.toggle("fixed", tab === "aujourdhui");
    if (tab === "aujourdhui") view.scrollTop = 0;
    ({ aujourdhui: renderHome, etsi: renderEtsi, budget: renderBudget }[tab])();
  }

  /* ================= Aujourd'hui ================= */
  function expRow(e, P) {
    const sd = e.cat === "sansdetail";
    const who = sd ? "Sans détail" : e.note ? e.note : catName(e.cat, P);
    const sub = sd ? `baisse de ton solde, ${relDay(e.date)}` : e.note ? `${catName(e.cat, P)}, ${relDay(e.date)}` : cap(relDay(e.date));
    return `<button type="button" class="row" data-act="edit" data-id="${e.id}"><span class="l"><span class="n">${esc(who)}</span><span class="d">${esc(sub)}</span></span><span class="a">${e2(e.amount)}</span></button>`;
  }
  const byRecent = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.at || 0) - (a.at || 0));
  const ln = (sign, name, sub, amount) => `<span class="ln"><span class="sg">${sign}</span><span class="nm"><b>${name}</b>${sub ? `<small>${sub}</small>` : ""}</span><span class="am">${amount}</span></span>`;

  function renderHome() {
    const P = cur(), c = compute(P), t = today();
    const real = c.list.slice().sort(byRecent);
    const miss = c.vivre < 0;
    const perDay = c.left === 1 ? `${e0(c.perDay)} pour aujourd'hui, paie demain` : `${e0(c.perDay)} par jour`;
    const label = miss ? "Il te manque" : `Pour vivre jusqu'au ${dLong(P.end)}`;
    const under = miss ? `pour payer tes factures${c.livret ? ` et mettre ${eA(c.livret)} sur ton livret` : ""}` : perDay;

    // Les lignes du calcul, du solde vers ce qu'il reste pour vivre
    const lines = [];
    lines.push(ln("", "Sur ton compte", S.balAt ? `mis à jour ${relDay(S.balAt)}` : "", e2(c.bal)));
    for (const k of c.coming) lines.push(ln("+", `${esc(k.name)} à venir`, "", eA(k.amount)));
    lines.push(ln("−", "Factures à venir", c.unpaid.length ? c.unpaid.map((f) => esc(f.name)).join(", ") : "toutes passées", eA(c.bills)));
    lines.push(ln("−", "Pour ton livret", c.livret ? "pas encore viré" : "déjà viré ce mois-ci", eA(c.livret)));
    for (const k of c.kept) lines.push(ln("−", `Gardé pour ${esc(k.name)}`, "", eA(k.amount)));
    if (c.early) lines.push(ln("−", "Paie du mois prochain", "déjà arrivée", eA(c.early)));

    // Détail : où est parti l'argent, puis les dernières dépenses
    const rows = S.cats.map((k) => ({ name: k.name, v: c.byCat[k.id] || 0 }));
    rows.push({ name: "Autres", v: c.byCat.autres || 0 });
    for (const u of S.upcoming) if (u.amount < 0 && u.ym === P.ym && c.byCat[u.id]) rows.push({ name: u.name, v: c.byCat[u.id] });
    if (c.byCat.sansdetail) rows.push({ name: "Sans détail", v: c.byCat.sansdetail });
    const max = Math.max(1, ...rows.map((r) => r.v));

  function setOpen(open, fromY) {
    const home = $(".home"), sheet = $(".sheet"); if (!home || !sheet) return;

    sheet.style.transform = "";
    homeOpen = open; home.dataset.open = open ? 1 : 0;
    $(".grab").setAttribute("aria-expanded", open); $(".grab").setAttribute("aria-label", open ? "Refermer le détail" : "Ouvrir le détail des dépenses");
    const after = sheet.getBoundingClientRect().top;
    if (!open) $(".sheet-body").scrollTop = 0;
    if (sheet.animate && Math.abs(before - after) > 1) sheet.animate([{ transform: `translateY(${before - after}px)` }, { transform: "none" }], { duration: 340, easing: "cubic-bezier(.32,.72,0,1)" });
  }
  function bindSheet() {
    const grab = $(".grab"), sheet = $(".sheet"); if (!grab) return;
    let y0 = null, dy = 0, moved = false;
    grab.addEventListener("pointerdown", (e) => { y0 = e.clientY; dy = 0; moved = false; try { grab.setPointerCapture(e.pointerId); } catch (err) {} });
    grab.addEventListener("pointermove", (e) => {
      if (y0 === null) return;
      dy = e.clientY - y0;
      if (Math.abs(dy) > 6) moved = true;
      if (!moved) return;
      const lim = homeOpen ? Math.max(0, dy) : Math.min(0, dy);
      sheet.style.transform = `translateY(${lim}px)`;
    });
    const end = () => {
      if (y0 === null) return;
      const d = dy; y0 = null;
      if (!moved) return;
      grab.dataset.dragged = "1"; setTimeout(() => { delete grab.dataset.dragged; }, 50);
      if (!homeOpen && d < -50) setOpen(true);
      else if (homeOpen && d > 50) setOpen(false);
      else { const from = sheet.style.transform; sheet.style.transform = ""; if (sheet.animate) sheet.animate([{ transform: from }, { transform: "none" }], { duration: 220, easing: "ease-out" }); }
    };
    grab.addEventListener("pointerup", end); grab.addEventListener("pointercancel", end);

  function parseCSV(text) {
    text = text.replace(/^\ufeff/, "");

    const rows = []; let row = [], cellv = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cellv += '"'; i++; } else q = false; } else cellv += ch; }
      else if (ch === '"') q = true;
      else if (ch === sep) { row.push(cellv); cellv = ""; }

      else cellv += ch;

    return rows.filter((r) => r.some((c) => c.trim() !== ""));

  window.__fdm = { compute, cur, readRevolut, claudeText, get state() { return S; } };
})();
</script>

<script>
// Mises à jour : vérifiées à l'ouverture et à chaque retour dans l'appli ; la nouvelle version se charge d'elle-même
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
      reg.update().catch(() => {});
      document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  });
}
</script>
