  /* ================= Réglages à coller ================= */
  // Une ligne par réglage :
  //   budget <catégorie> <montant>        epargne <montant>
  //   prevu rentree|depense <AAAA-MM> <montant> <libellé>
  //   regle "<libellé du relevé>" <catégorie>
  //   categorie <id> enveloppe|fixe|revenu <montant> "<nom>" "<mot, mot>"
  let codePlan = null;
  function codeTokens(line) { const out = []; const re = /"([^"]*)"|(\S+)/g; let m; while ((m = re.exec(line))) out.push(m[1] !== undefined ? m[1] : m[2]); return out; }
  function catByRef(ref, pending) {
    const r = norm(ref);
    return state.categories.find((c) => norm(c.id) === r || norm(c.name) === r) || (pending || []).find((c) => norm(c.id) === r || norm(c.name) === r) || null;
  }
  function moveKw(kw, target) {
    for (const c of state.categories) c.kw = (c.kw || []).filter((k) => norm(k) !== norm(kw));
    if (!target.kw.some((k) => norm(k) === norm(kw))) target.kw.push(kw);
  }
  function parseCode(text) {
    const items = [], errors = [], pending = [];
    for (const raw of String(text || "").split(/\r?\n/)) {
      const line = raw.trim();
      if (!line || line.startsWith("#")) continue;
      const tk = codeTokens(line), cmd = norm(tk[0] || "");
      const bad = (why) => errors.push(`« ${line} » : ${why}`);
      if (cmd === "budget") {
        const c = catByRef(tk[1], pending), v = parseAmount(tk[2] || "");
        if (!c) { bad("catégorie inconnue"); continue; }
        if (!isFinite(v) || v < 0) { bad("montant illisible"); continue; }
        if (Math.abs((c.budget || 0) - v) < 0.005) { items.push({ text: `${esc(c.name)} : déjà à ${eur(v)}`, skip: true }); continue; }
        items.push({ text: `${esc(c.name)} : ${eur(c.budget || 0)} → <b>${eur(v)}</b> par mois`, run: () => { const cc = cat(c.id); if (cc) cc.budget = round2(v); } });
      } else if (cmd === "epargne") {
        const v = parseAmount(tk[1] || "");
        if (!isFinite(v) || v < 0) { bad("montant illisible"); continue; }
        if (Math.abs((state.settings.goal || 0) - v) < 0.005) { items.push({ text: `Épargne : déjà à ${eur(v)}`, skip: true }); continue; }
        items.push({ text: `Épargne chaque mois : ${eur(state.settings.goal || 0)} → <b>${eur(v)}</b>`, run: () => { state.settings.goal = round2(v); } });
      } else if (cmd === "prevu") {
        const type = norm(tk[1] || ""), ym = tk[2] || "", v = parseAmount(tk[3] || ""), label = tk.slice(4).join(" ").trim();
        if (!["rentree", "depense"].includes(type)) { bad("indique rentree ou depense"); continue; }
        if (!/^\d{4}-\d{2}$/.test(ym)) { bad("mois attendu au format 2026-12"); continue; }
        if (!(v > 0) || !label) { bad("montant ou libellé manquant"); continue; }
        const exists = state.events.some((e) => e.ym === ym && (norm(e.label) === norm(label) || (Math.abs(e.amount - v) < 0.01 && e.type === (type === "rentree" ? "in" : "out"))));
        if (exists) { items.push({ text: `${esc(label)}, ${monthName(ym)} : déjà prévu`, skip: true }); continue; }
        items.push({ text: `Prévu : ${type === "rentree" ? "rentrée" : "dépense"} « ${esc(label)} », ${monthName(ym)}, <b>${type === "rentree" ? "+" : "−"}${eur(v)}</b>`, run: () => state.events.push({ id: uid(), label, type: type === "rentree" ? "in" : "out", ym, amount: round2(v), done: false }) });
      } else if (cmd === "objectif") {
        const name = (tk[1] || "").trim(), v = parseAmount(tk[2] || ""), have = tk[3] ? parseAmount(tk[3]) : 0;
        if (!name || !(v > 0) || !isFinite(have)) { bad("forme attendue : objectif \"Nom\" montant [déjà de côté]"); continue; }
        if (state.goals.some((g) => norm(g.name) === norm(name))) { items.push({ text: `Projet « ${esc(name)} » : existe déjà`, skip: true }); continue; }
        items.push({ text: `Projet d'épargne <b>${esc(name)}</b> : ${eur0(v)}${have ? `, ${eur0(have)} déjà de côté` : ""}, rempli dans l'ordre`, run: () => { if (!state.settings.queueStart) state.settings.queueStart = todayISO(); state.goals.push({ id: uid(), name, target: round2(v), saved: round2(have || 0), date: "", queue: true }); } });
      } else if (cmd === "mots") {
        const c = catByRef(tk[1], pending), kws = String(tk[2] || "").split(",").map((x) => x.trim()).filter(Boolean);
        if (!c || !kws.length) { bad("forme attendue : mots catégorie \"mot, mot\""); continue; }
        const fresh = kws.filter((k) => !(c.kw || []).some((x) => norm(x) === norm(k)));
        if (!fresh.length) { items.push({ text: `${esc(c.name)} : reconnaît déjà ${kws.map(esc).join(", ")}`, skip: true }); continue; }
        const n = state.tx.filter((t) => classify(t) === null && fresh.some((k) => norm(t.label).includes(norm(k)))).length;
        items.push({ text: `<b>${esc(c.name)}</b> reconnaît aussi ${fresh.map(esc).join(", ")}${n ? ` (${n} opération${n > 1 ? "s" : ""} à trier rangée${n > 1 ? "s" : ""})` : ""}`, run: () => { const cc = cat(c.id) || state.categories.find((x) => x.id === c.id); if (cc) for (const k of fresh) moveKw(k, cc); } });
      } else if (cmd === "nom") {
        const c = catByRef(tk[1], pending), name = (tk[2] || "").trim();
        if (!c || !name) { bad("forme attendue : nom catégorie \"Nouveau nom\""); continue; }
        if (c.name === name) { items.push({ text: `${esc(name)} : déjà ce nom`, skip: true }); continue; }
        items.push({ text: `« ${esc(c.name)} » s'appelle maintenant <b>${esc(name)}</b>`, run: () => { const cc = cat(c.id); if (cc) cc.name = name; } });
      } else if (cmd === "renomme-prevu") {
        const from = (tk[1] || "").trim(), to = (tk[2] || "").trim();
        const ev = state.events.find((e) => norm(e.label) === norm(from));
        if (!from || !to) { bad("forme attendue : renomme-prevu \"ancien\" \"nouveau\""); continue; }
        if (!ev) { items.push({ text: `« ${esc(from)} » : pas dans tes prévisions`, skip: true }); continue; }
        items.push({ text: `Prévision « ${esc(from)} » renommée <b>${esc(to)}</b>`, run: () => { const e = state.events.find((x) => norm(x.label) === norm(from)); if (e) e.label = to; } });
      } else if (cmd === "offre") {
        const name = (tk[1] || "").trim(), rent = parseAmount(tk[2] || ""), dep = parseAmount(tk[3] || "0"), months = parseInt(tk[4] || "0", 10), ins = tk[5] ? parseAmount(tk[5]) : 0;
        if (!name || !(rent > 0) || !isFinite(dep) || !isFinite(ins)) { bad("forme attendue : offre \"Nom\" loyer apport durée [assurance]"); continue; }
        if (state.cars.some((c) => norm(c.name) === norm(name))) { items.push({ text: `Offre « ${esc(name)} » : existe déjà`, skip: true }); continue; }
        items.push({ text: `Offre <b>${esc(name)}</b> : ${eur0(rent)} par mois, apport ${eur0(dep)}${months > 0 ? `, ${months} mois` : ""}${ins ? `, assurance ${eur0(ins)}` : ""}`, run: () => state.cars.push({ id: uid(), name, rent: round2(rent), deposit: round2(dep), months: months > 0 ? months : 0, km: 0, ins: round2(ins), fuel: "" }) });
      } else if (cmd === "vente-voiture") {
        const v = parseAmount(tk[1] || "");
        if (!(v >= 0)) { bad("montant illisible"); continue; }
        items.push({ text: `Vente de ta voiture actuelle : <b>${eur0(v)}</b>`, run: () => { state.settings.carSale = round2(v); } });
      } else if (cmd === "financement") {
        const ym = tk[1] || "";
        if (!/^\d{4}-\d{2}$/.test(ym)) { bad("mois attendu au format 2026-12"); continue; }
        items.push({ text: `Financement possible à partir de <b>${monthName(ym)}</b>`, run: () => { state.settings.financeFrom = ym; } });
      } else if (cmd === "regle") {
        const kw = (tk[1] || "").trim(), c = catByRef(tk[2], pending);
        if (!kw) { bad("libellé manquant"); continue; }
        if (!c) { bad("catégorie inconnue"); continue; }
        const n = state.tx.filter((t) => norm(t.label).includes(norm(kw))).length;
        items.push({ text: `« ${esc(kw)} » rangé dans <b>${esc(c.name)}</b>${n ? ` (${n} opération${n > 1 ? "s" : ""} déjà là)` : ""}`, run: () => { const cc = cat(c.id); if (cc) moveKw(kw, cc); } });
      } else if (cmd === "categorie") {
        const id = norm(tk[1] || "").replace(/\s+/g, "-"), kind = norm(tk[2] || ""), v = parseAmount(tk[3] || "0"), name = (tk[4] || "").trim(), kws = String(tk[5] || "").split(",").map((x) => x.trim()).filter(Boolean);
        if (!id || !["enveloppe", "fixe", "revenu"].includes(kind) || !name || !isFinite(v)) { bad("forme attendue : categorie id enveloppe 0 \"Nom\" \"mot, mot\""); continue; }
        if (cat(id)) { items.push({ text: `Catégorie « ${esc(cat(id).name)} » : existe déjà`, skip: true }); continue; }
        pending.push({ id, name, kind, kw: [] });
        items.push({ text: `Nouvelle catégorie <b>${esc(name)}</b> (${KIND_L[kind].toLowerCase()}, ${eur(v)} par mois)${kws.length ? `, reconnue par ${kws.map(esc).join(", ")}` : ""}`, run: () => { const c = { id, name, kind, budget: round2(v), kw: [], active: true }; state.categories.push(c); for (const k of kws) moveKw(k, c); } });
      } else bad("ligne non reconnue");
    }
    return { items, errors };
  }
  function codeSheet() {
    openSheet(`<h2>Appliquer des réglages</h2><p class="hint">Colle le texte préparé. Tu vois chaque changement avant de l'appliquer.</p>
      <div class="field"><label for="codeText">Réglages</label><textarea id="codeText" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="budget nourriture 300"></textarea><p class="err" id="codeErr" hidden></p></div>
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Annuler</button><button class="btn primary" data-act="codePreview">Voir les changements</button></div>`, "Appliquer des réglages");
  }
  let codePack = null;
  function codePreview(text, opts = {}) {
    codePack = opts.pack || null;
    const r = parseCode(text);
    if (!r.items.length && !r.errors.length) { showErr("codeErr", "Colle d'abord le texte des réglages."); return; }
    codePlan = r.items;
    const live = r.items.filter((i) => !i.skip);
    openSheet(`<h2>${opts.title || `${live.length} changement${live.length > 1 ? "s" : ""}`}</h2>${opts.intro ? `<p class="meta">${opts.intro}</p>` : ""}
      <div class="rows codelist">${r.items.map((it, i) => it.skip ? `<p class="hint">${it.text}</p>` : `<label class="check"><input type="checkbox" data-code="${i}" checked><span>${it.text}</span></label>`).join("")}</div>
      ${r.errors.length ? `<div class="callout warn" style="cursor:default"><span><b>Lignes ignorées</b><br>${r.errors.map(esc).join("<br>")}</span></div>` : ""}
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Annuler</button><button class="btn primary" data-act="codeRun" ${live.length ? "" : "disabled"}>Appliquer</button></div>`, "Changements");
  }
  function codeRun() {
    if (!codePlan) return;
    const keep = new Set([...sheetHost.querySelectorAll("input[data-code]")].filter((x) => x.checked).map((x) => Number(x.dataset.code)));
    const backup = JSON.stringify(state);
    let n = 0;
    // Les nouvelles catégories d'abord, pour que les budgets et règles qui les visent s'appliquent
    const order = codePlan.map((it, i) => ({ it, i })).filter(({ it, i }) => !it.skip && keep.has(i)).sort((a, b) => (/Nouvelle catégorie/.test(b.it.text) ? 1 : 0) - (/Nouvelle catégorie/.test(a.it.text) ? 1 : 0));
    for (const { it } of order) { it.run(); n++; }
    if (codePack) { state.settings.packs = (state.settings.packs || []).concat(codePack); codePack = null; }
    codePlan = null; save(); closeSheet(); shownFree = null; render(); haptic();
    toast(`${n} réglage${n > 1 ? "s" : ""} appliqué${n > 1 ? "s" : ""}`, () => { state = migrate(JSON.parse(backup)); save(); shownFree = null; render(); toast("Réglages annulés"); });
  }

  /* ================= Sauvegarde ================= */
  const backupPayload = () => JSON.stringify({ app: APP_ID, version: 2, exportedAt: new Date().toISOString(), state }, null, 1);
  function wipeAll(msg) {
    try { localStorage.removeItem(KEY); } catch (err) {}
    state = null; onb = { step: 1, vals: {} }; shownFree = null; catView = null; budgetYM = ymNow(); viewYM = ymNow(); lastImport = null;
    sheetHost.innerHTML = ""; document.documentElement.classList.remove("sheet-open");
    view = "aujourdhui"; render(); window.scrollTo(0, 0);
    if (msg) toast(msg);
  }
  async function doBackup(after) {
    const data = backupPayload(), name = `fin-de-mois-sauvegarde-${todayISO()}.json`;
    const ok = (msg) => { state.settings.lastBackup = new Date().toISOString(); save(); if (after) { after(); return; } render(); toast(msg); };
    let dl = null;
    try { dl = IN_CLAUDE ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: name, data }); ok("Sauvegarde créée"); return; }
      catch (e) { if (e && e.code === "declined") { toast(after ? "Sauvegarde annulée : rien n'est effacé" : "Sauvegarde annulée"); return; } if (e && e.code === "rate_limited") { toast("Une demande est déjà ouverte"); return; } }
    }
    if (!IN_CLAUDE) {
      try {
        const file = new File([data], name, { type: "application/json" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Sauvegarde Fin de mois" }); ok("Sauvegarde créée"); return; }
        const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        ok("Sauvegarde téléchargée"); return;
      } catch (e) { if (e && e.name === "AbortError") { toast(after ? "Sauvegarde annulée : rien n'est effacé" : "Sauvegarde annulée"); return; } }
    }
    openSheet(`<h2>Copier la sauvegarde</h2><p class="hint">Copie ce texte et garde-le dans une note.</p><div class="field"><label for="bkText">Sauvegarde</label><textarea id="bkText" readonly>${esc(data)}</textarea></div>
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Fermer</button><button class="btn primary" data-act="copyBackup">Copier</button></div>`, "Copier la sauvegarde");
  }
  function openRestore() {
    openSheet(`<h2>Restaurer une sauvegarde</h2><p class="hint">Choisis le fichier, ou colle son contenu. Les données actuelles seront remplacées.</p>
      <button class="btn primary" data-act="pickBackup">Choisir le fichier</button>
      <div class="field"><label for="rsText">Ou colle le contenu ici</label><textarea id="rsText"></textarea><p class="err" id="rsErr" hidden></p></div>
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Annuler</button><button class="btn primary" data-act="restorePasted">Restaurer</button></div>`, "Restaurer une sauvegarde");
  }
  function applyBackup(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return "Ce texte n'est pas une sauvegarde lisible. Vérifie que tout le contenu a été copié."; }
    const s = obj && obj.app === APP_ID ? obj.state : obj;
    if (!validState(s)) return "Ce fichier n'est pas une sauvegarde de Fin de mois.";
    state = migrate(s); save(); closeSheet(); shownFree = null; go("aujourdhui"); toast(`Sauvegarde restaurée : ${state.tx.length} opérations`);
    return null;
  }

  /* ================= Rendu ================= */
  const depth = (v) => (PARENT[v] ? 1 + depth(PARENT[v]) : 0);
  function go(v, dir) {
    v = ALIAS[v] || v;
