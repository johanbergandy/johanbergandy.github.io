  /* ================= Sauvegarde ================= */
  const backupPayload = () => JSON.stringify({ app: APP_ID, version: 2, exportedAt: new Date().toISOString(), state }, null, 1);
  async function doBackup() {
    const data = backupPayload(), name = `fin-de-mois-sauvegarde-${todayISO()}.json`;
    const ok = (msg) => { state.settings.lastBackup = new Date().toISOString(); save(); render(); toast(msg); };
    let dl = null;
    try { dl = IN_CLAUDE ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: name, data }); ok("Sauvegarde créée"); return; }
      catch (e) { if (e && e.code === "declined") { toast("Sauvegarde annulée"); return; } if (e && e.code === "rate_limited") { toast("Une demande est déjà ouverte"); return; } }
    }
    if (!IN_CLAUDE) {
      try {
        const file = new File([data], name, { type: "application/json" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Sauvegarde Fin de mois" }); ok("Sauvegarde créée"); return; }
        const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        ok("Sauvegarde téléchargée"); return;
      } catch (e) { if (e && e.name === "AbortError") { toast("Sauvegarde annulée"); return; } }
    }
    openSheet(`<h2>Copier la sauvegarde</h2><p class="hint">Copie ce texte et garde-le dans une note.</p><div class="field"><label for="bkText">Sauvegarde</label><textarea id="bkText" readonly>${esc(data)}</textarea></div>
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Fermer</button><button class="btn primary" data-act="copyBackup">Copier</button></div>`, "Copier la sauvegarde");
  }
  function openRestore() {
    openSheet(`<h2>Restaurer une sauvegarde</h2><p class="hint">Choisis le fichier, ou colle son contenu. Les données actuelles seront remplacées.</p>
      <button class="btn primary" data-act="pickBackup">Choisir le fichier</button>
      <div class="field"><label for="rsText">Ou colle le contenu ici</label><textarea id="rsText"></textarea><p class="err" id="rsErr" hidden></p></div>
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Annuler</button><button class="btn primary" data-act="restorePasted">Restaurer</button></div>`, "Restaurer une sauvegarde");
  }
  function applyBackup(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return "Ce texte n'est pas une sauvegarde lisible. Vérifie que tout le contenu a été copié."; }
    const s = obj && obj.app === APP_ID ? obj.state : obj;
    if (!validState(s)) return "Ce fichier n'est pas une sauvegarde de Fin de mois.";
    state = migrate(s); save(); closeSheet(); shownFree = null; go("aujourdhui"); toast(`Sauvegarde restaurée : ${state.tx.length} opérations`);
    return null;
  }

  /* ================= Rendu ================= */
  function go(v) {
    v = ALIAS[v] || v;
    if (!VIEWS.includes(v)) v = "aujourdhui";
    const run = () => {
      view = v;
      if (location.hash !== "#" + v) { try { window.history.replaceState(null, "", "#" + v); } catch (e) {} }
      render(); window.scrollTo(0, 0);
    };
    if (document.startViewTransition && !reduced() && state) document.startViewTransition(run); else run();
  }
  function updateBadge() {
    const n = state ? state.tx.filter((t) => classify(t) === null).length : 0;
    const badge = document.getElementById("badge");
    if (badge) { badge.hidden = !n; badge.textContent = n > 99 ? "99+" : String(n); }
  }
  function render() {
    view = ALIAS[view] || view;
    if (!VIEWS.includes(view)) view = "aujourdhui";
    if (!state) { tabs.hidden = true; renderOnboarding(); return; }
    tabs.hidden = false;
    const tab = TAB_OF[view] || "aujourdhui";
    for (const a of tabs.querySelectorAll("a")) { if (a.dataset.tab === tab && ["aujourdhui", "point", "projets", "operations"].includes(view)) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }
    updateBadge();
    ({ aujourdhui: renderAujourdhui, point: renderPoint, projets: renderProjets, operations: renderOperations, reglages: renderReglages, budget: renderBudget, iphone: renderIphone, sauvegarde: renderSauvegarde }[view])();
  }
  const val = (id) => { const e = document.getElementById(id); return e ? e.value : ""; };
  const showErr = (id, msg) => { const e = document.getElementById(id); if (e) { e.textContent = msg; e.hidden = false; } };

  /* ================= Interactions ================= */
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    if (act === "closeSheet" && el.classList.contains("scrim") && e.target !== el) return;
    switch (act) {
      case "go": go(el.dataset.v); break;
      case "closeSheet": closeSheet(); break;
      case "how": howSheet(); break;
      case "bills": billsSheet(); break;
      case "key": padKey(el.dataset.v); break;
      case "padCat": padCat = el.dataset.v; for (const b of app.querySelectorAll('[data-act="padCat"]')) b.setAttribute("aria-pressed", String(b === el)); updatePad(); break;
      case "padClear": typed = ""; updatePad(); break;
      case "padPay": padPay(); break;
      case "prev": viewYM = ymShift(viewYM, -1); render(); break;
      case "next": viewYM = ymShift(viewYM, 1); render(); break;
      case "opsOnly": opsOnly = el.dataset.v === "1"; renderOperations(); break;
      case "chartSel": chartSel[el.dataset.chart] = Number(el.dataset.i); render(); break;
      case "bilan": bilanYM = el.dataset.v; renderPoint(); break;
      case "importCsv": csvInput.value = ""; csvInput.click(); break;
      case "importJournal": journalInput.value = ""; journalInput.click(); break;
      case "closeImport": lastImport = null; renderPoint(); break;
      case "triPick": triPick(el.dataset.k, el.dataset.v); break;
      case "triSkip": triSkip.add(el.dataset.k); renderPoint(); break;
      case "triReset": triSkip = new Set(); renderPoint(); break;
      case "openTx": txSheet(el.dataset.id); break;
      case "saveTx": {
        const t = state.tx.find((x) => x.id === el.dataset.id);
        if (!t) { closeSheet(); break; }
        const sel = sheetHost.querySelector('input[name="txCat"]:checked');
        const amt = parseAmount(val("txAmt")), date = val("txDate"), splitRaw = val("txSplitAmt").trim(), split = splitRaw ? parseAmount(splitRaw) : 0;
        const more = sheetHost.querySelector("details.more");
        if (!(amt > 0)) { showErr("txErr", "Indique un montant, par exemple 12,50."); more.open = true; break; }
        if (!date) { showErr("txErr", "Indique une date."); more.open = true; break; }
        if (splitRaw && !(split > 0 && split < amt)) { showErr("txErr", `La part doit être entre 0 et ${eur(amt)}.`); more.open = true; break; }
        const sign = t.amount < 0 ? -1 : 1, newAmt = round2(sign * amt), newLabel = val("txLabel").trim() || t.label;
        if ((newAmt !== t.amount || date !== t.date || newLabel !== t.label) && t.source !== "manuel" && !t.orig) t.orig = { amount: t.amount, date: t.date, label: t.label };
        const oldLabel = t.label;
        t.amount = newAmt; t.date = date; t.label = newLabel; t.note = val("txNote").trim();
        if (sel) {
          const v = sel.value, rule = sheetHost.querySelector("#txRule");
          if (rule && rule.checked && v !== "hors") { addRule(oldLabel, v); delete t.manualCat; if (t.label !== oldLabel) t.manualCat = v; }
          else if (rule && rule.checked && v === "hors") { for (const x of state.tx) if (norm(x.label) === norm(oldLabel)) x.manualCat = "hors"; }
          else t.manualCat = v;
        }
        if (split > 0) { t.amount = round2(t.amount - sign * split); state.tx.push({ id: uid(), date: t.date, label: `${t.label} (part)`, amount: round2(sign * split), source: "manuel", parent: t.id, manualCat: val("txSplitCat") }); }
        sortTx(); save(); closeSheet(); render(); toast("Enregistré"); break;
      }
      case "restoreTx": { const t = state.tx.find((x) => x.id === el.dataset.id); if (t && t.orig) { Object.assign(t, t.orig); delete t.orig; sortTx(); save(); closeSheet(); render(); toast("Montant du relevé rétabli"); } break; }
      case "askDelTx": confirmSheet("Supprimer cette opération ?", "Elle ne comptera plus.", "Supprimer", "delTx", `data-id="${esc(el.dataset.id)}"`); break;
      case "delTx": {
        const t = state.tx.find((x) => x.id === el.dataset.id);
        if (t && t.parent) { const p = state.tx.find((x) => x.id === t.parent); if (p) p.amount = round2(p.amount + t.amount); }
        const removed = t; state.tx = state.tx.filter((x) => x.id !== el.dataset.id); save(); closeSheet(); render();
        toast("Opération supprimée", () => { if (removed) { state.tx.push(removed); sortTx(); save(); render(); } }); break;
      }
      case "buyAdd": {
        const a = parseAmount(buy.amount);
        if (!(a > 0)) break;
        state.events.push({ id: uid(), label: "Achat prévu", type: "out", ym: buy.ym, amount: round2(a), done: false });

      }
      case "editEvent": eventSheet(el.dataset.id); break;

      case "saveEvent": {
        const label = val("evLabel").trim(), ym = val("evYm"), a = parseAmount(val("evAmt"));
        if (!label) { showErr("evErr", "Donne un nom, par exemple « prime de décembre »."); break; }
        if (!/^\d{4}-\d{2}$/.test(ym)) { showErr("evErr", "Choisis le mois."); break; }
        if (!(a > 0)) { showErr("evErr", "Indique un montant, par exemple 800."); break; }

        if (el.dataset.id) Object.assign(state.events.find((x) => x.id === el.dataset.id), data); else state.events.push({ id: uid(), ...data });
        save(); closeSheet(); render(); toast("Enregistré"); break;
      }
      case "delEvent": state.events = state.events.filter((x) => x.id !== el.dataset.id); save(); closeSheet(); render(); toast("Supprimé"); break;
      case "editGoal": goalSheet(el.dataset.id); break;
      case "saveGoal": {
        const name = val("gName").trim(), target = parseAmount(val("gTarget")), sr = val("gSaved").trim(), saved = sr ? parseAmount(sr) : 0, ym = val("gDate");
        if (!name) { showErr("gErr", "Donne un nom au projet."); break; }
        if (!(target > 0)) { showErr("gErr", "Indique le montant visé, par exemple 1500."); break; }
        if (!isFinite(saved) || saved < 0) { showErr("gErr", "Le montant déjà de côté est illisible."); break; }
        if (!/^\d{4}-\d{2}$/.test(ym)) { showErr("gErr", "Choisis le mois visé."); break; }
        const data = { name, target: round2(target), saved: round2(saved), date: `${ym}-01` };
        if (el.dataset.id) Object.assign(state.goals.find((x) => x.id === el.dataset.id), data); else state.goals.push({ id: uid(), ...data });
        save(); closeSheet(); shownFree = null; render(); toast("Projet enregistré"); break;
      }
      case "delGoal": state.goals = state.goals.filter((x) => x.id !== el.dataset.id); save(); closeSheet(); render(); toast("Projet supprimé"); break;
      case "editCar": carSheet(el.dataset.id); break;
      case "saveCar": {
        const name = val("cName").trim(), rent = parseAmount(val("cRent")), dr = val("cDep").trim(), dep = dr ? parseAmount(dr) : 0, months = parseInt(val("cMonths"), 10), km = parseInt(String(val("cKm")).replace(/\s/g, ""), 10);
        if (!name) { showErr("cErr", "Donne le nom de la voiture."); break; }
        if (!(rent > 0)) { showErr("cErr", "Indique le loyer par mois, par exemple 320."); break; }
        if (!isFinite(dep) || dep < 0) { showErr("cErr", "L'apport est illisible."); break; }
        const data = { name, rent: round2(rent), deposit: round2(dep), months: months > 0 ? months : 0, km: km > 0 ? km : 0 };
        if (el.dataset.id) Object.assign(state.cars.find((x) => x.id === el.dataset.id), data); else state.cars.push({ id: uid(), ...data });
        save(); closeSheet(); render(); toast("Offre enregistrée"); break;
      }
      case "useCar": { const c = state.cars.find((x) => x.id === el.dataset.id), v = cat("voiture"); if (c && v) { v.budget = c.rent; save(); closeSheet(); render(); toast(`Voiture du budget : ${eur0(c.rent)} par mois, comptée quand tu l'activeras`); } break; }
      case "delCar": state.cars = state.cars.filter((x) => x.id !== el.dataset.id); if (projCar === "car:" + el.dataset.id) projCar = ""; save(); closeSheet(); render(); toast("Offre supprimée"); break;
      case "applySugg": { const c = cat(el.dataset.id); c.budget = Number(el.dataset.v); save(); shownFree = null; render(); toast(`${c.name} : ${eur0(c.budget)} par mois`); break; }
      case "ignoreSugg": state.settings.ignoredSugg.push(el.dataset.k); save(); render(); break;
      case "makeFixed": {
        const x = recurring().find((r) => r.key === el.dataset.k);
        if (!x) break;
        for (const o of state.categories) o.kw = (o.kw || []).filter((k) => norm(k) !== norm(x.label));
        state.categories.push({ id: "c" + uid(), name: x.label, kind: "fixe", budget: x.avg, kw: [x.label], active: true });
        save(); render(); toast(`${x.label} ajouté aux factures`); break;
      }
      case "addCat": {
        const kind = el.dataset.kind;
        const c = { id: "c" + uid(), name: kind === "revenu" ? "Nouveau revenu" : kind === "fixe" ? "Nouvelle facture" : "Nouveau budget", kind, budget: 0, kw: [], active: true };
        state.categories.push(c); save(); renderBudget();
        const d = app.querySelector(`details[data-id="${c.id}"]`); if (d) { d.open = true; const n = d.querySelector('[data-edit="name"]'); if (n) { n.focus(); n.select(); } }
        break;
      }
      case "delCat": { const c = cat(el.dataset.id); const used = state.tx.filter((t) => classify(t) === c.id).length; confirmSheet(`Supprimer « ${c.name} » ?`, used ? `${used} opération(s) rangées ici repasseront « à trier ».` : "Aucune opération n'est rangée ici.", "Supprimer", "delCatOk", `data-id="${esc(c.id)}"`); break; }
      case "delCatOk": { const id = el.dataset.id; for (const t of state.tx) if (t.manualCat === id) delete t.manualCat; state.categories = state.categories.filter((c) => c.id !== id); if (padCat === id) padCat = null; save(); closeSheet(); renderBudget(); toast("Catégorie supprimée"); break; }
      case "backup": doBackup(); break;
      case "copyBackup": { const ta = document.getElementById("bkText"); const done = () => { state.settings.lastBackup = new Date().toISOString(); save(); toast("Sauvegarde copiée"); }; const fb = () => { ta.focus(); ta.select(); toast("Sélectionne le texte puis copie-le"); }; try { navigator.clipboard.writeText(ta.value).then(done, fb); } catch (err) { fb(); } break; }
      case "copy": { const node = document.getElementById(el.dataset.t); try { navigator.clipboard.writeText(node ? node.textContent : "").then(() => toast("Copié"), () => toast("Sélectionne le texte puis copie-le")); } catch (err) { toast("Sélectionne le texte puis copie-le"); } break; }
      case "restore": openRestore(); break;
      case "pickBackup": backupInput.value = ""; backupInput.click(); break;
      case "restorePasted": { const t = val("rsText").trim(); const msg = t ? applyBackup(t) : "Colle d'abord le contenu de la sauvegarde."; if (msg) showErr("rsErr", msg); break; }
      case "wipe": confirmSheet("Effacer toutes les données ?", "Ton budget et tes opérations seront supprimés de cet iPhone. Fais une sauvegarde avant si tu veux pouvoir les retrouver.", "Tout effacer", "wipeOk"); break;
      case "wipeOk": try { localStorage.removeItem(KEY); } catch (err) {} state = null; onb = { step: 1, vals: {} }; shownFree = null; closeSheet(); render(); break;
      case "onbBack": onbCollect(); onb.step = Math.max(1, onb.step - 1); renderOnboarding(); window.scrollTo(0, 0); break;
    }
  });

  // Pavé : clavier physique aussi
  document.addEventListener("keydown", (e) => {
    if (sheetHost.innerHTML) {
      if (e.key === "Escape") { closeSheet(); return; }
      if (e.key === "Tab") {
        const f = [...sheetHost.querySelectorAll(".sheet button, .sheet input:not([type=hidden]), .sheet select, .sheet textarea, .sheet summary")].filter((x) => !x.disabled && x.offsetParent !== null);
        if (f.length) { const first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
      }
      return;
    }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("rect.hit")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); return; }
    if (view !== "aujourdhui" || !state) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    if (/^[0-9]$/.test(e.key)) { padKey(e.key); e.preventDefault(); }
    else if (e.key === "," || e.key === ".") { padKey(","); e.preventDefault(); }
    else if (e.key === "Backspace") { padKey("del"); e.preventDefault(); }
    else if (e.key === "Enter" && typed) { padPay(); e.preventDefault(); }
  });

  // Tri : glisser vers la gauche pour « plus tard »
  let sx = null;
  document.addEventListener("touchstart", (e) => { const t = e.target.closest && e.target.closest("#tri"); sx = t ? { x: e.touches[0].clientX, y: e.touches[0].clientY, k: t.dataset.k } : null; }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (!sx) return;
    const dx = e.changedTouches[0].clientX - sx.x, dy = e.changedTouches[0].clientY - sx.y;
    if (dx < -70 && Math.abs(dy) < 40) { triSkip.add(sx.k); renderPoint(); }
    sx = null;
  }, { passive: true });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "opsQuery") { opsQuery = t.value; const box = document.getElementById("opsList"); if (box) box.innerHTML = opsList(computeMonth(viewYM, viewYM < ymNow() ? { raw: true } : {})); }
    else if (t.id === "buyAmt") { buy.amount = t.value; updateBuy(); }
    else if (t.closest && t.closest(".money-in")) t.closest(".money-in").classList.remove("invalid");
    if (t.closest && t.closest(".sheet")) { const er = t.closest(".sheet").querySelector(".err"); if (er) er.hidden = true; }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "buyYm") { buy.ym = t.value; updateBuy(); return; }
    if (t.id === "projCar") { projCar = t.value; renderProjets(); return; }
    if (t.id === "estOn") { state.settings.estimate = t.checked; save(); toast(t.checked ? "Estimation activée" : "Estimation désactivée"); return; }
    if (t.id === "alertPct") { state.settings.alertPct = Number(t.value); save(); toast("Enregistré"); return; }
    if (t.id === "goal" && state) { const v = parseAmount(t.value || "0"); state.settings.goal = isFinite(v) && v > 0 ? round2(v) : 0; save(); shownFree = null; renderProjets(); toast("Épargne mensuelle enregistrée"); return; }
    const ed = t.dataset && t.dataset.edit;
    if (ed && state) {
      const c = cat(t.dataset.id); if (!c) return;
      if (ed === "name") c.name = t.value.trim() || c.name;
      else if (ed === "budget") { const v = parseAmount(t.value || "0"); if (!isFinite(v) || v < 0) { t.closest(".money-in").classList.add("invalid"); toast("Montant illisible, par exemple 450 ou 12,50"); return; } c.budget = round2(v); }
      else if (ed === "kw") c.kw = t.value.split(",").map((s) => s.trim()).filter(Boolean);
      else if (ed === "active") c.active = t.checked;
      save();
      const open = t.closest("details") && t.closest("details").dataset.id;
      renderBudget(); if (open) { const d = app.querySelector(`details[data-id="${open}"]`); if (d) d.open = true; }
      toast("Enregistré");
    }
  });
  document.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target.id !== "onbForm") return;
    const f = e.target;
    onbCollect();
    let bad = null;
    for (const inp of f.querySelectorAll('input[id^="o-"]')) { const raw = inp.value.trim(), v = raw ? parseAmount(raw) : 0; if (!isFinite(v) || v < 0) { inp.closest(".money-in").classList.add("invalid"); bad = bad || inp; } }
    if (onb.step === 1 && !(parseAmount(onb.vals.salaire) > 0)) { const si = document.getElementById("o-salaire"); si.closest(".money-in").classList.add("invalid"); document.getElementById("onbErr").hidden = false; bad = bad || si; }
    if (bad) { bad.focus(); return; }

    const g = parseAmount(onb.vals.goal || "0");
    state = migrate({ v: 2, categories: cats, tx: [], settings: { goal: isFinite(g) && g > 0 ? round2(g) : 0, lastBackup: null, createdAt: new Date().toISOString() } });
    save(); go("aujourdhui"); toast("C'est prêt");

  function readFile(input, cb) { const file = input.files && input.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => cb(String(r.result || "")); r.onerror = () => toast("Le fichier n'a pas pu être lu"); r.readAsText(file, "utf-8"); }
  csvInput.addEventListener("change", () => readFile(csvInput, (text) => {
    try { const r = importRevolut(text); save(); lastImport = r; triSkip = new Set(); shownFree = null; go("point"); toast(r.added ? `${r.added} opération${r.added > 1 ? "s" : ""} ajoutée${r.added > 1 ? "s" : ""}` : "Aucune nouvelle opération"); }
    catch (err) { openSheet(`<h2>Import impossible</h2><p class="hint">${esc(err.message || "Le fichier n'a pas pu être lu.")}</p><div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Fermer</button></div>`, "Import impossible"); }
  }));
  journalInput.addEventListener("change", () => readFile(journalInput, (text) => { const r = importJournal(text); r.journal = true; save(); lastImport = r; shownFree = null; go("point"); toast(r.added ? `${r.added} paiement${r.added > 1 ? "s" : ""} ajouté${r.added > 1 ? "s" : ""}` : "Aucun nouveau paiement"); }));
  backupInput.addEventListener("change", () => readFile(backupInput, (text) => { const msg = applyBackup(text); if (msg) { if (document.getElementById("rsErr")) showErr("rsErr", msg); else toast(msg); } }));

    if (receiveFromHash()) { render(); return; }

  });

})();

</script>
