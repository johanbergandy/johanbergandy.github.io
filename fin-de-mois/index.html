<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1118" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fin de mois</title>
</head>
<body>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fin de mois">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Fin de mois, v4.
   Idée : un terminal de paiement de poche. En haut, une jauge dont la couleur dit la situation ;
   au centre, un pavé numérique qui répond avant que tu paies. Tout le reste se range en dessous.
   Couleurs : encre bleu nuit, fond gris très légèrement bleuté, trois états (vert, ambre, rouge) réservés à la jauge. */
:root {
  --bg: #F2F3F5;
  --surface: #FFFFFF;
  --surface-2: #F5F6F8;
  --key: #FFFFFF;
  --key-press: #E7EAF0;
  --ink: #0E1726;
  --muted: #5B6474;
  --faint: #8A93A3;
  --line: #DFE3E8;
  --accent: #1D3FBF;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4E9FB;
  --calm: #0F5C45;
  --tight: #9A5800;
  --red: #A3221C;
  --on-mood: #FFFFFF;
  --good: #0F7A4A;
  --good-soft: #DDF1E6;
  --bad: #B42318;
  --bad-soft: #FBE4E1;
  --warn: #8A5200;
  --warn-soft: #FBEFD9;
  --bar: #0E1726;
  --bar-2: #B4BCC8;
  --scrim: rgba(14, 23, 38, .42);
  --font-fig: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r-big: 28px;
  --r-panel: 20px;
  --r-ctl: 14px;
  --tabbar-h: 60px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1017; --surface: #141A24; --surface-2: #1A212D; --key: #1A212D; --key-press: #252E3D;
    --ink: #E9EDF3; --muted: #9AA4B5; --faint: #6E7889; --line: #263041;
    --accent: #8FA6FF; --accent-ink: #0B1017; --accent-soft: #1E2947;
    --calm: #145C47; --tight: #845000; --red: #8C221C; --on-mood: #F4F7FA;
    --good: #5FD39A; --good-soft: #123326; --bad: #FF8A7A; --bad-soft: #3A1915; --warn: #F2B860; --warn-soft: #33260F;
    --bar: #E9EDF3; --bar-2: #3E4A5D; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1017; --surface: #141A24; --surface-2: #1A212D; --key: #1A212D; --key-press: #252E3D;
  --ink: #E9EDF3; --muted: #9AA4B5; --faint: #6E7889; --line: #263041;
  --accent: #8FA6FF; --accent-ink: #0B1017; --accent-soft: #1E2947;
  --calm: #145C47; --tight: #845000; --red: #8C221C; --on-mood: #F4F7FA;
  --good: #5FD39A; --good-soft: #123326; --bad: #FF8A7A; --bad-soft: #3A1915; --warn: #F2B860; --warn-soft: #33260F;
  --bar: #E9EDF3; --bar-2: #3E4A5D; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

.app { max-width: 480px; margin-inline: auto; padding-inline: 16px; padding-block: 6px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 28px); display: flex; flex-direction: column; gap: 22px; }

/* En-tête */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.head .t { font-family: var(--font-fig); font-stretch: 82%; font-weight: 760; font-size: 26px; line-height: 1.05; }
.head .s { color: var(--muted); font-size: 14px; margin-top: 2px; }
.iconbtn { position: relative; min-width: 44px; min-height: 44px; display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 50%; color: var(--ink); }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn[disabled] { opacity: .35; cursor: default; }
.iconbtn .dot { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); border: 2px solid var(--surface); }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px 0 0; border: 0; background: none; color: var(--accent); font-size: 16px; font-weight: 500; }
.back svg { width: 20px; height: 20px; }
.mnav { display: flex; gap: 6px; }

/* Jauge */
.gauge { width: 100%; border: 0; text-align: left; color: var(--on-mood); background: var(--calm); border-radius: var(--r-big); padding: 18px 20px 18px; display: flex; flex-direction: column; gap: 8px; transition: background .4s var(--ease); }
.gauge[data-mood="tight"] { background: var(--tight); }
.gauge[data-mood="red"] { background: var(--red); }
.gauge .l1 { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; }
.gauge .mood { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.18); white-space: nowrap; }
.gauge .big { font-family: var(--font-fig); font-stretch: 62%; font-weight: 790; font-size: clamp(68px, 22vw, 100px); line-height: .88; letter-spacing: -.01em; font-variant-numeric: tabular-nums lining-nums; }
.gauge .per { font-size: 16px; font-weight: 600; }
.gauge .month { position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); margin-top: 6px; }
.gauge .month i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: rgba(255,255,255,.9); }
.gauge .month b { position: absolute; top: -4px; width: 4px; height: 14px; margin-left: -2px; border-radius: 2px; background: var(--on-mood); opacity: .55; }
.gauge .next { font-size: 14px; opacity: .92; }
.gauge .how { font-size: 13px; opacity: .85; text-decoration: underline; text-underline-offset: 3px; }

/* Pavé */
.pad { background: var(--surface); border-radius: var(--r-big); padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.pad .q { font-size: 15px; color: var(--muted); }
.pad .amt { font-family: var(--font-fig); font-stretch: 70%; font-weight: 760; font-size: 50px; line-height: 1; font-variant-numeric: tabular-nums; min-height: 50px; display: flex; align-items: baseline; gap: 6px; }
.pad .amt.blank { color: var(--line); }
.pad .amt .cur { font-size: 36px; color: var(--muted); }
.verdict { min-height: 56px; display: flex; flex-direction: column; gap: 4px; }
.verdict .v1 { font-size: 17px; font-weight: 650; }
.verdict .v1 b { font-family: var(--font-fig); font-stretch: 78%; font-size: 22px; font-weight: 760; }
.verdict .v2 { font-size: 14px; color: var(--muted); }
.verdict .ok { color: var(--good); }
.verdict .ko { color: var(--bad); }
.verdict .mid { color: var(--warn); }
.cats { display: flex; flex-wrap: wrap; gap: 8px; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface-2); font-size: 15px; font-weight: 550; scroll-snap-align: start; }
.cat[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key { min-height: 50px; border-radius: 16px; border: 1px solid var(--line); background: var(--key); font-family: var(--font-fig); font-stretch: 80%; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; transition: transform .08s var(--ease), background .08s; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.key:active, .key.down { transform: scale(.96); background: var(--key-press); }
.key svg { width: 24px; height: 24px; vertical-align: middle; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.acts .btn { white-space: nowrap; }

/* Boutons */
.btn { min-height: 52px; border-radius: 16px; border: 1px solid transparent; padding: 0 18px; width: 100%; font-size: 16px; font-weight: 650; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .1s var(--ease); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.secondary { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.link { background: transparent; color: var(--accent); min-height: 44px; width: auto; padding: 0 4px; font-weight: 600; }
.btn.small { min-height: 40px; width: auto; font-size: 15px; padding: 0 14px; border-radius: 12px; }
.btn[aria-disabled="true"] { opacity: .45; }
.btn-row { display: flex; gap: 10px; }
.btn-row > * { flex: 1; }

/* Sections, listes */
.section { display: flex; flex-direction: column; gap: 10px; }
.sh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sh h2 { font-family: var(--font-fig); font-stretch: 85%; font-size: 21px; font-weight: 740; }
.sh span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hint { font-size: 14px; color: var(--muted); }
.rows { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-panel); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; align-items: center; padding: 12px 16px; border: 0; border-top: 1px solid var(--line); min-height: 56px; text-align: left; background: transparent; width: 100%; }
.rows > :first-child { border-top: 0; }
.row .name { font-size: 16px; font-weight: 520; min-width: 0; overflow-wrap: anywhere; }
.row .sub { font-size: 13px; color: var(--muted); grid-column: 1; min-width: 0; overflow-wrap: anywhere; }
.row .amt { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row .amt.in { color: var(--good); }
.row .amt.muted { color: var(--muted); font-weight: 500; }
.row .st { font-size: 13px; text-align: right; white-space: nowrap; color: var(--muted); }
.row .st.over { color: var(--bad); font-weight: 650; }
.row .st.near { color: var(--warn); font-weight: 650; }
.row .st.paid { color: var(--good); }
.row svg.chev { width: 16px; height: 16px; color: var(--faint); }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 3px; }
.bar i.near { background: var(--warn); }
.bar i.over { background: var(--bad); }
.bar u { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--muted); opacity: .6; text-decoration: none; }
.tag { font-size: 13px; color: var(--muted); }
.tag.todo { color: var(--warn); font-weight: 650; }
.tag.sugg { color: var(--accent); font-weight: 650; }
.note { font-size: 13px; color: var(--muted); font-style: italic; }
.daygroup { font-size: 13px; font-weight: 650; color: var(--muted); padding: 12px 4px 6px; }
.panel { background: var(--surface); border-radius: var(--r-panel); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.callout { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px 16px; min-height: 56px; border-radius: var(--r-panel); background: var(--surface); border: 0; width: 100%; text-align: left; font-size: 15px; }
.callout.warn { background: var(--warn-soft); }
.callout.bad { background: var(--bad-soft); }
.callout.accent { background: var(--accent-soft); }
.callout svg { width: 16px; height: 16px; color: var(--faint); }
.callout b { font-weight: 680; }

/* Le point : tri */
.fresh { display: flex; flex-direction: column; gap: 12px; }
.fresh .state { font-size: 15px; }
.fresh .state b { font-weight: 680; }
.tri { background: var(--surface); border-radius: var(--r-big); padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; touch-action: pan-y; }
.tri .prog { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-weight: 600; }
.tri .prog i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); margin-left: 12px; position: relative; overflow: hidden; }
.tri .prog i b { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
.tri .who { font-family: var(--font-fig); font-stretch: 82%; font-size: 30px; font-weight: 760; line-height: 1.05; overflow-wrap: anywhere; }
.tri .what { font-size: 15px; color: var(--muted); }
.tri .what b { color: var(--ink); font-weight: 680; }
.tri .guess { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--accent-soft); }
.tri .guess span { font-size: 14px; color: var(--muted); }
.tri .guess b { display: block; font-size: 17px; color: var(--ink); }
.tri .grid { display: flex; flex-wrap: wrap; gap: 8px; }
.tri .grid .cat { flex: 0 1 auto; }
.tri .grp { font-size: 12px; font-weight: 700; color: var(--muted); width: 100%; margin-top: 4px; }
.tri.leave { animation: slideout .18s ease-in forwards; }
.tri.enter { animation: slidein .22s var(--ease); }

/* Bilan */
.facts { display: flex; flex-direction: column; gap: 10px; }
.fact { background: var(--surface); border-radius: var(--r-panel); padding: 14px 16px; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: start; }
.fact .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); }
.fact .ic svg { width: 20px; height: 20px; }
.fact.warn .ic { background: var(--warn-soft); color: var(--warn); }
.fact.bad .ic { background: var(--bad-soft); color: var(--bad); }
.fact.good .ic { background: var(--good-soft); color: var(--good); }
.fact p { font-size: 15px; }
.fact p b { font-weight: 700; font-variant-numeric: tabular-nums; }
.fact .act { margin-top: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { min-height: 40px; border: 0; border-radius: 9px; background: transparent; font-size: 14px; font-weight: 650; color: var(--muted); padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }

/* Champs */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .flabel { font-size: 14px; font-weight: 650; }
.input, .field input[type="text"], .field input[type="search"], .field input[type="date"], .field input[type="month"], .field select, .field textarea {
  min-height: 46px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface-2); padding: 10px 12px; font-size: 16px; width: 100%; min-width: 0; }
.field textarea { min-height: 96px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.err { font-size: 14px; color: var(--bad); }
.money-in { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface-2); min-height: 46px; padding-right: 12px; }
.money-in input { width: 100%; min-width: 0; border: 0; background: transparent; padding: 10px 12px; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; outline: none; }
.money-in span { color: var(--muted); }
.money-in:focus-within { border-color: var(--accent); }
.money-in.invalid { border-color: var(--bad); }
.money-row { display: grid; grid-template-columns: minmax(0, 1fr) 136px; gap: 10px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--line); min-height: 58px; }
.rows > .money-row:first-child { border-top: 0; }
.money-row label { font-size: 16px; overflow-wrap: anywhere; }
.money-row label small { display: block; font-size: 13px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.switch span { font-size: 15px; }
.switch small { display: block; color: var(--muted); font-size: 13px; }
.switch input { appearance: none; -webkit-appearance: none; flex: none; width: 51px; height: 31px; border-radius: 16px; background: var(--line); position: relative; transition: background .2s; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s var(--ease); }
.switch input:checked { background: var(--good); }
.switch input:checked::after { transform: translateX(20px); }
.big-in { font-family: var(--font-fig); font-stretch: 75%; font-weight: 720; font-size: 40px; border: 0; border-bottom: 2px solid var(--line); background: transparent; width: 100%; padding: 0 0 4px; outline: none; font-variant-numeric: tabular-nums; }
.big-in:focus { border-color: var(--accent); }

/* Comparaisons et graphiques */
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; }
.hbar .k { font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.hbar .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hbar .v.neg { color: var(--bad); }
.hbar .track { grid-column: 1 / -1; height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.hbar .track i { display: block; height: 100%; border-radius: 5px; background: var(--bar); transition: width .3s var(--ease); }
.hbar.base .track i { background: var(--bar-2); }
.hbar.neg .track i { background: var(--bad); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--muted); stroke-width: 1; }
.chart .lbl { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); }
.chart .val { fill: var(--ink); font-size: 12px; font-weight: 700; font-family: var(--font-ui); }
.chart .colbar { fill: var(--bar); }
.chart .colbar.neg { fill: var(--bad); }
.chart .hit { fill: transparent; cursor: pointer; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-weight: 650; color: var(--muted); font-size: 13px; padding: 6px 0; }
.table th:not(:first-child), .table td:not(:first-child) { text-align: right; }
.table td { padding: 8px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.table td.neg { color: var(--bad); }
.table td.pos { color: var(--good); }
.table-wrap { overflow-x: auto; }
.summary { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 12px; font-size: 15px; margin: 0; }
.summary dt { color: var(--muted); min-width: 0; }
.summary dd { margin: 0; text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.summary .grp { grid-column: 1 / -1; font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 6px; }
.summary .total { color: var(--ink); font-weight: 700; border-top: 1px solid var(--line); padding-top: 8px; }
.summary dd.total { font-family: var(--font-fig); font-stretch: 75%; font-size: 22px; }

/* Barre d'onglets */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs ul { list-style: none; margin: 0 auto; padding: 0; max-width: 480px; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabs a { min-height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 650; position: relative; }
.tabs a svg { width: 25px; height: 25px; }
.tabs a[aria-current="page"] { color: var(--accent); }

<script>
(function () {
  "use strict";

  /* ================= Utilitaires ================= */
  const KEY = "fin-de-mois.v1";
  const APP_ID = "fin-de-mois";
  const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const MONTHS_S = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  const DAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  const fmt2 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
  const fmt0 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0, minimumFractionDigits: 0 });
  const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
  const eur = (n) => fmt2.format(round2(n));
  const eur0 = (n) => fmt0.format(Math.round(n));
  const sgn = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + eur(Math.abs(n));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const pad = (n) => String(n).padStart(2, "0");
  const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = () => isoOf(new Date());
  const ymOf = (iso) => String(iso).slice(0, 7);
  const ymNow = () => ymOf(todayISO());
  const ymShift = (ym, k) => { let [y, m] = ym.split("-").map(Number); m += k; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; };
  const ymDiff = (a, b) => { const [ya, ma] = a.split("-").map(Number); const [yb, mb] = b.split("-").map(Number); return (yb - ya) * 12 + (mb - ma); };
  const daysIn = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
  const monthName = (ym) => { const [y, m] = ym.split("-").map(Number); return `${MONTHS[m - 1]} ${y}`; };
  const monthShort = (ym) => MONTHS_S[Number(ym.slice(5)) - 1];
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const dayLabel = (iso) => { const [y, m, d] = iso.split("-").map(Number); const dt = new Date(y, m - 1, d); return `${cap(DAYS[dt.getDay()])} ${d} ${MONTHS[m - 1]}`; };
  const shortDate = (iso) => { const [, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]}`; };
  const reduced = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };

  function parseAmount(v) {
    if (typeof v === "number") return isFinite(v) ? v : NaN;
    let s = String(v ?? "").replace(/eur/gi, "").replace(/[\s  €]/g, "");
    if (!s) return NaN;
    if (s.includes(",") && s.includes(".")) {
      if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", ".");
      else s = s.replace(/,/g, "");
    } else s = s.replace(",", ".");
    if (!/^[+-]?\d*\.?\d+$/.test(s)) return NaN;
    return Number(s);
  }
  const amountText = (n) => (n ? String(round2(n)).replace(".", ",") : "");

  /* ================= Données ================= */
  function defaultCategories() {
    return [
      { id: "salaire", name: "Salaire", kind: "revenu", budget: 0, kw: [], active: true },
      { id: "loyer", name: "Loyer et charges", kind: "fixe", budget: 0, kw: [], active: true },
      { id: "edf", name: "EDF", kind: "fixe", budget: 0, kw: ["EDF"], active: true },
      { id: "sport", name: "Salle de sport", kind: "fixe", budget: 0, kw: [], active: true },
      { id: "gmf", name: "GMF", kind: "fixe", budget: 0, kw: ["Gmf"], active: true },
      { id: "revolut", name: "Revolut", kind: "fixe", budget: 0, kw: ["abonnement Metal"], active: true },
      { id: "voiture", name: "Voiture (LLD)", kind: "fixe", budget: 0, kw: [], active: false },
      { id: "nourriture", name: "Nourriture", kind: "enveloppe", budget: 0, kw: ["Intermarché"], active: true },
      { id: "essence", name: "Essence", kind: "enveloppe", budget: 0, kw: ["Total", "Esso"], active: true },
      { id: "sorties", name: "Sorties et loisirs", kind: "enveloppe", budget: 0, kw: [], active: true },
      { id: "especes", name: "Espèces", kind: "enveloppe", budget: 0, kw: ["Retrait d'espèces"], active: true },
    ];
  }

  let storageOK = true;
  let state = load();

  function validState(s) {
    return s && typeof s === "object" && Array.isArray(s.categories) && Array.isArray(s.tx) && s.settings && typeof s.settings === "object";
  }
  function migrate(s) {
    if (!Array.isArray(s.events)) s.events = [];
    if (!Array.isArray(s.goals)) s.goals = [];
    if (!Array.isArray(s.cars)) s.cars = [];
    if (typeof s.settings.goal !== "number") s.settings.goal = 0;
    if (typeof s.settings.alertPct !== "number") s.settings.alertPct = 0.8;
    if (typeof s.settings.estimate !== "boolean") s.settings.estimate = true;
    if (!Array.isArray(s.settings.ignoredSugg)) s.settings.ignoredSugg = [];
    s.v = 2;
    return s;
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return validState(s) ? migrate(s) : null;
    } catch (e) { storageOK = false; return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; }
    catch (e) { storageOK = false; }
    try { if (navigator.storage && navigator.storage.persist && !save._asked) { save._asked = true; navigator.storage.persist().catch(() => {}); } } catch (e) {}
  }

  const cat = (id) => (state ? state.categories.find((c) => c.id === id) : null);
  const KIND = { revenu: "Rentrées", fixe: "Charges fixes", enveloppe: "Enveloppes" };

  /* ================= Classement ================= */
  function ruleMatch(label) {
    const l = norm(label);
    let best = null, len = 0;
    for (const c of state.categories) for (const k of c.kw || []) {
      const nk = norm(k);
      if (nk && l.includes(nk) && nk.length > len) { best = c.id; len = nk.length; }
    }
    return best;
  }
  function classify(tx) {
    if (tx.manualCat !== undefined && tx.manualCat !== null && (tx.manualCat === "hors" || cat(tx.manualCat))) return tx.manualCat;
    const r = ruleMatch(tx.label);
    if (r) return r;
    if (tx.amount > 0) return "hors";
    return null;
  }

  // Suggestions : d'abord ce que tu as déjà classé, ensuite des mots courants
  const DICT = {
    nourriture: ["supermarche", "supermarket", "carrefour", "auchan", "leclerc", "lidl", "aldi", "franprix", "monoprix", "intermarche", "coccinelle", "super u", "hyper u", "boulangerie", "mie caline", "primeur", "prim o", "fruits", "picard", "biocoop", "netto", "grand frais", "epicerie", "boucherie", "g20", "spar", "proxi"],
    essence: ["totalenergies", "total", "esso", "shell", "avia", "carburant", "agip"],
    sorties: ["restaurant", "resto", "cafe", "brasserie", "pizz", "kebab", "burger", "mcdonald", "kfc", "uber eats", "deliveroo", "cinema", "bowling", "bistro", "sushi", "creperie"],
  };
  const wordStart = (hay, needle) => new RegExp("(^|[^a-z0-9])" + needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(hay);
  function suggest(tx) {
    const l = norm(tx.label);
    const first = l.split(/[^a-z0-9]+/).find((w) => w.length >= 4);
    if (first) {
      const other = state.tx.find((o) => o !== tx && o.amount < 0 && wordStart(norm(o.label), first) && (() => { const k = classify(o); return k && k !== "hors"; })());
      if (other) return { id: classify(other), why: "comme « " + other.label + " »" };
    }
    for (const [id, words] of Object.entries(DICT)) {
      if (!cat(id)) continue;
      if (words.some((w) => wordStart(l, w))) return { id, why: "mot courant" };
    }
    return null;
  }

  function usualDay(c) {
    let latest = null;
    for (const t of state.tx) if (classify(t) === c.id && t.amount < 0 && (!latest || t.date > latest)) latest = t.date;
    return latest ? Number(latest.slice(8, 10)) : null;
  }

  /* ================= Calculs ================= */
  // carMonthly : loyer d'une voiture simulée, ajouté au mois si la voiture du budget n'est pas encore comptée
  const LIVE = ["manuel", "applepay"];
  // Dernier jour couvert par un relevé Revolut importé
  function coverage() {
    let last = null;
    for (const t of state.tx) if (t.source === "revolut" && (!last || t.date > last)) last = t.date;
    return last;
  }
  // Mois complets (salaire reçu) : la base des moyennes
  function completeMonths(max = 3) {
    const months = [...new Set(state.tx.map((t) => ymOf(t.date)))].filter((ym) => ym < ymNow()).sort();
    return months.filter((ym) => computeMonth(ym, { raw: true }).lines.some((l) => l.c.kind === "revenu" && l.actual > 0)).slice(-max);
  }
  // Dépense courante moyenne par jour (enveloppes + non classé), hors charges fixes
  function avgDaily() {
    const ms = completeMonths();
    if (!ms.length) return null;
    const per = ms.map((ym) => { const m = computeMonth(ym, { raw: true }); const env = m.lines.filter((l) => l.c.kind === "enveloppe").reduce((a, l) => a + l.actual, 0); return (env + m.uncl) / daysIn(ym); });
    return round2(per.reduce((a, b) => a + b, 0) / per.length);
  }
  function unseen() {
    const ym = ymNow();
    const last = coverage();
    const avg = avgDaily();
    if (!last) return { last: null, avg, days: 0, est: 0, logged: 0 };
    const today = todayISO();
    if (last >= today) return { last, avg, days: 0, est: 0, logged: 0 };
    const start = last >= `${ym}-01` ? last : `${ymShift(ym, -1)}-${pad(daysIn(ymShift(ym, -1)))}`;
    const days = Math.max(0, Math.round((new Date(today) - new Date(start)) / 864e5));
    const logged = round2(state.tx.filter((t) => LIVE.includes(t.source) && t.date > last && ymOf(t.date) === ym && t.amount < 0 && (() => { const k = classify(t); return k !== "hors" && !(cat(k) && cat(k).kind === "fixe"); })()).reduce((a, t) => a - t.amount, 0));
    const est = avg === null || state.settings.estimate === false ? 0 : round2(Math.max(0, avg * days - logged));
    return { last, avg, days, est, logged };
  }

  function computeMonth(ym, opts = {}) {
    const now = ymNow();
    const mode = ym < now ? "past" : ym === now ? "current" : "future";
    const txs = state.tx.filter((t) => ymOf(t.date) === ym);
    const per = {}, has = {};
    let uncl = 0, unclCount = 0, hors = 0;
    for (const t of txs) {
      const k = classify(t);
      if (k === "hors") { hors += t.amount; continue; }
      if (k === null) { uncl += -t.amount; unclCount++; continue; }
      per[k] = (per[k] || 0) + t.amount; has[k] = true;
    }
    const lines = state.categories.map((c) => {
      const raw = per[c.id] || 0;
      const actual = round2(c.kind === "revenu" ? raw : -raw);
      const plan = c.active ? c.budget : 0;
      let counted, basis;
      if (mode === "past") { counted = actual; basis = "réel"; }
      else if (c.kind === "enveloppe") { counted = Math.max(actual, plan); basis = actual > plan ? "réel" : "prévu"; }
      else if (has[c.id]) { counted = actual; basis = "réel"; }
      else { counted = plan; basis = "prévu"; }
      return { c, actual, plan, counted: round2(counted), has: !!has[c.id], basis };
    });
    const events = mode === "past" ? [] : state.events.filter((e) => e.ym === ym && !e.done);
    const evIn = round2(events.filter((e) => e.type === "in").reduce((a, e) => a + e.amount, 0));
    const evOut = round2(events.filter((e) => e.type === "out").reduce((a, e) => a + e.amount, 0));
    const sum = (k) => round2(lines.filter((l) => l.c.kind === k).reduce((a, l) => a + l.counted, 0));
    const inc = round2(sum("revenu") + evIn);
    const fix = sum("fixe"), env = sum("enveloppe");
    const car = mode !== "past" && opts.carMonthly ? round2(opts.carMonthly) : 0;
    // Dépenses probablement faites mais pas encore importées : elles remplissent d'abord ce qui reste dans les enveloppes
    let est = null, estOver = 0;
    if (mode === "current" && !opts.raw) {
      est = unseen();
      const rooms = lines.filter((l) => l.c.kind === "enveloppe").reduce((a, l) => a + Math.max(0, l.plan - l.actual), 0);
      estOver = round2(Math.max(0, est.est - rooms));
    }
    const out = round2(fix + env + uncl + evOut + car + estOver);
    return { ym, mode, txs, lines, events, evIn, evOut, inc, fix, env, uncl: round2(uncl), unclCount, hors: round2(hors), car, est, estOver, out, end: round2(inc - out) };
  }

  function pace(m, l) {
    if (m.mode !== "current" || !(l.actual > 0)) return null;
    const day = new Date().getDate();
    if (day < 5) return null;
    return round2((l.actual / day) * daysIn(m.ym));
  }
  function budgetSuggestions() {
    const ms = completeMonths();
    if (!ms.length) return [];
    const months = ms.map((ym) => computeMonth(ym, { raw: true }));
    const spent = months.reduce((a, m) => a + m.lines.filter((l) => l.c.kind !== "revenu").reduce((x, l) => x + l.actual, 0) + m.uncl, 0);
    const uncl = months.reduce((a, m) => a + m.uncl, 0);
    budgetSuggestions.blocked = spent > 0 && uncl / spent > 0.2 ? { uncl: round2(uncl), share: uncl / spent } : null;
    if (budgetSuggestions.blocked) return [];
    const out = [];
    for (const c of state.categories) {
      if (c.kind === "revenu" || !c.active) continue;
      const vals = months.map((m) => m.lines.find((l) => l.c.id === c.id)).filter(Boolean);
      if (c.kind === "fixe" && vals.filter((l) => l.has).length < 2) continue;
      const avg = round2(vals.reduce((a, l) => a + l.actual, 0) / vals.length);
      if (c.kind === "enveloppe" && avg === 0) continue;
      const diff = round2(avg - c.budget);
      if (Math.abs(diff) < Math.max(10, c.budget * 0.1)) continue;
      const key = `${c.id}:${Math.round(avg)}`;

  /* ================= Import Revolut ================= */
  function parseCSV(text) {

    const sep = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === sep) { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }

    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }

  }
  const HEAD = {

  };
  function parseDate(s) {
    s = String(s || "").trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);
    if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    return null;
  }
  function importRevolut(text) {
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error("Le fichier ne contient aucune opération.");
    const head = rows[0].map(norm);
    const idx = {};
    for (const [k, names] of Object.entries(HEAD)) idx[k] = names.map((n) => head.indexOf(n)).find((i) => i >= 0);
    if (idx.label === undefined || idx.amount === undefined || idx.date === undefined)
      throw new Error("Ce fichier ne ressemble pas à un relevé Revolut : les colonnes Description, Montant et Date sont introuvables.");
    const known = new Set(state.tx.map((t) => t.key).filter(Boolean));
    const res = { read: 0, added: 0, dup: 0, reverted: 0, pending: 0, unreadable: 0, other: 0, merged: 0, months: new Set() };
    const added = [];
    for (const r of rows.slice(1)) {
      res.read++;
      const status = idx.status !== undefined ? norm(r[idx.status]) : "termine";
      const rawDate = (r[idx.date] || "").trim();
      const date = parseDate(rawDate);
      const amt = parseAmount(r[idx.amount]);
      const fee = idx.fee !== undefined && String(r[idx.fee] ?? "").trim() !== "" ? parseAmount(r[idx.fee]) : 0;
      if (["renvoye", "reverted", "annule", "declined", "refuse"].includes(status)) { res.reverted++; continue; }

      if (status !== "termine" && status !== "completed") { res.other++; continue; }

      const twin = state.tx.find((m) => LIVE.includes(m.source) && !m._used && Math.abs(m.amount - t.amount) < 0.005 && Math.abs((new Date(m.date) - new Date(t.date)) / 864e5) <= 3);

  // Une ligne du journal : 2026-10-08|14:32|Intermarché|12,50 €
  function addApplePay(date, time, label, amountRaw, known) {

    if (known.has(key)) return "dup";

  function importJournal(text) {

    if (from === to || reduced()) { el.textContent = eur0(to); return; }
    const t0 = performance.now(), dur = 420;
    const step = (t) => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); if (!document.body.contains(el)) return; el.textContent = eur0(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  function fixedPins(m, dim) {
    const pins = [];
    for (const l of m.lines) {
      if (l.c.kind !== "fixe" || (!l.c.active && !l.has)) continue;
      const day = l.has ? Number(m.txs.filter((t) => classify(t) === l.c.id).map((t) => t.date).sort().pop().slice(8)) : usualDay(l.c);
      pins.push({ day: day ? Math.min(day, dim) : null, paid: l.has, c: l.c, amount: l.has ? l.actual : l.plan });
    }
    return pins;
  }

  /* ---------- Pavé « Et si je paie » ---------- */
  function renderPad() {
    const envs = envCats();
    if (!padCat || (padCat !== "__autre" && !cat(padCat))) padCat = state.settings.lastPadCat && (state.settings.lastPadCat === "__autre" || cat(state.settings.lastPadCat)) ? state.settings.lastPadCat : (cat("sorties") ? "sorties" : envs[0] ? envs[0].id : "__autre");
    const chips = envs.map((c) => `<button class="cat" data-act="padCat" data-v="${esc(c.id)}" aria-pressed="${padCat === c.id}">${esc(c.name)}</button>`).join("") + `<button class="cat" data-act="padCat" data-v="__autre" aria-pressed="${padCat === "__autre"}">Autre</button>`;
    const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", ",", "0", "del"].map((k) => `<button class="key" data-act="key" data-v="${k}" aria-label="${k === "del" ? "Effacer" : k === "," ? "Virgule" : k}">${k === "del" ? ICON.del : k}</button>`).join("");
    return `<section class="pad" aria-label="Et si je paie">
      <p class="q">Et si je paie…</p>
      <div class="amt num" id="padAmt" aria-live="polite"></div>
      <div class="verdict" id="verdict" aria-live="polite"></div>
      <div class="cats" role="group" aria-label="Pour quoi">${chips}</div>
      <div class="keys">${keys}</div>
      <div class="acts"><button class="btn secondary" data-act="padClear">Juste pour voir</button><button class="btn dark" data-act="padPay" id="padPay">Je l'ai payé</button></div>
    </section>`;
  }

  // Simule une dépense d'aujourd'hui sans l'enregistrer
  function whatIf(amount, catId) {
    const tmp = { id: "__sim", date: todayISO(), label: "", amount: -round2(amount), source: "sim", manualCat: catId || undefined };
    state.tx.push(tmp);
    try { const m = computeMonth(ymNow()); return { m, f: freeToSpend(m) }; }
    finally { state.tx.pop(); }
  }

  function updatePad() {
    const amtEl = document.getElementById("padAmt"), vEl = document.getElementById("verdict");
    if (!amtEl) return;
    const a = parseAmount(typed || "0");
    amtEl.className = "amt num" + (typed ? "" : " blank");
    amtEl.innerHTML = `${typed ? esc(typed) : "0"}<span class="cur">€</span>`;
    const pay = document.getElementById("padPay");
    if (pay) pay.setAttribute("aria-disabled", String(!(a > 0)));
    if (!(a > 0)) { vEl.innerHTML = `<p class="v2">Tape un montant : tu vois ce qu'il te restera avant de payer.</p>`; return; }
    const before = freeToSpend(computeMonth(ymNow()));
    const catId = padCat === "__autre" ? null : padCat;
    const { m, f } = whatIf(a, catId);
    const dl = daysLeft();
    const c = catId ? cat(catId) : null;
    const line = c ? computeMonth(ymNow()).lines.find((l) => l.c.id === c.id) : null;
    const room = line ? Math.max(0, line.plan - line.actual) : 0;
    let v1, v2, cls;
    if (m.end < 0) { cls = "ko"; v1 = `Tu finirais le mois à <b>${eur0(m.end)}</b>`; v2 = `Dans le rouge de ${eur(-m.end)} si rien d'autre ne change.`; }
    else if (f.target > 0 && f.margin < 0) { cls = "ko"; v1 = `Il te resterait <b>${eur0(f.total)}</b>`; v2 = `Ça entame ton épargne de ${eur(Math.min(a, -f.margin))}. Fin du mois : ${eur0(m.end)}.`; }
    else if (c && c.id !== "sorties" && a <= room) { cls = "ok"; v1 = `Prévu dans ton budget ${esc(c.name)}`; v2 = `Il y restera ${eur(room - a)}. Tu peux toujours dépenser ${eur0(f.total)}, soit ${eur(f.total / dl)} par jour.`; }
    else { cls = f.total / dl < before.total / dl * 0.5 ? "mid" : "ok"; v1 = `Il te resterait <b>${eur0(f.total)}</b>`; v2 = `soit ${eur(f.total / dl)} par jour au lieu de ${eur(before.total / dl)}.${f.target > 0 ? " Épargne intacte." : ""}`; }
    vEl.innerHTML = `<p class="v1 ${cls}">${v1}</p><p class="v2">${v2}</p>`;
  }

  function padKey(k) {
    if (k === "del") typed = typed.slice(0, -1);
    else if (k === ",") { if (!typed.includes(",")) typed = (typed || "0") + ","; }
    else {
      const [i, d] = typed.split(",");
      if (d !== undefined && d.length >= 2) return;
      if (d === undefined && (i || "").replace(/^0+/, "").length >= 6) return;
      typed = typed === "0" ? k : typed + k;
    }
    updatePad();
  }

  function padPay() {
    const a = parseAmount(typed || "0");
    if (!(a > 0)) { toast("Tape d'abord un montant"); return; }
    const catId = padCat === "__autre" ? null : padCat;
    const tx = { id: uid(), date: todayISO(), label: catId ? cat(catId).name : "Dépense", amount: -round2(a), source: "manuel", manualCat: catId || null };
    state.tx.push(tx); sortTx();
    state.settings.lastPadCat = padCat;
    save(); typed = ""; render();
    toast(`Enregistré : ${eur(a)}${catId ? `, ${cat(catId).name}` : ""}`, () => { state.tx = state.tx.filter((t) => t.id !== tx.id); save(); render(); toast("Dépense annulée"); });
  }

  /* ---------- Ce mois-ci ---------- */
  function renderThisMonth(m) {
    const envs = m.lines.filter((l) => l.c.kind === "enveloppe" && (l.plan > 0 || l.actual !== 0));
    const pctA = state.settings.alertPct || 0.8;
    const dim = daysIn(m.ym), day = new Date().getDate();
    const rows = envs.map((l) => {
      const b = l.plan, over = b > 0 && l.actual > b, near = !over && b > 0 && l.actual >= b * pctA;
      const pc = pace(m, l);
      const pctW = b > 0 ? Math.min(100, (l.actual / b) * 100) : (l.actual > 0 ? 100 : 0);
      const st = b <= 0 ? `<span class="st">${eur(l.actual)}</span>` : over ? `<span class="st over">${eur(l.actual - b)} de trop</span>` : `<span class="st ${near || (pc && pc > b) ? "near" : ""}">reste ${eur0(b - l.actual)}</span>`;
      const sub = pc && b > 0 && pc > b * 1.05 ? `<span class="sub" style="color:var(--warn);font-weight:600">À ce rythme : ${eur0(pc)} pour ${eur0(b)}</span>` : `<span class="sub">${eur(l.actual)}${b > 0 ? ` sur ${eur0(b)}` : ""}</span>`;
      return `<div class="row"><span class="name">${esc(l.c.name)}</span>${st}<div class="bar" aria-hidden="true"><i class="${over ? "over" : near ? "near" : ""}" style="width:${pctW}%"></i>${b > 0 ? `<u style="left:${((day - 0.5) / dim) * 100}%"></u>` : ""}</div>${sub}</div>`;
    }).join("");
    const fixed = m.lines.filter((l) => l.c.kind === "fixe" && (l.c.active || l.has) && (l.plan > 0 || l.has));
    const paid = fixed.filter((l) => l.has).length;
    let html = `<section class="section"><div class="sh"><h2>Ce mois-ci</h2><span>le trait = aujourd'hui</span></div>`;
    html += rows ? `<div class="rows">${rows}</div>` : `<div class="empty"><b>Aucun budget du quotidien.</b><p>Indique dans Réglages ce que tu prévois pour les courses, l'essence, les sorties.</p></div>`;
    html += `<button class="callout" data-act="bills"><span><b>Factures : ${paid} payée${paid > 1 ? "s" : ""} sur ${fixed.length}</b>, ${eur0(m.fix)} au total ce mois-ci</span>${ICON.chev}</button>`;
    const n = state.tx.filter((t) => classify(t) === null).length;
    if (n) html += `<button class="callout warn" data-act="go" data-v="point"><span><b>${n} opération${n > 1 ? "s" : ""} à trier</b>. Tant qu'elles ne sont pas triées, les chiffres sont approximatifs.</span>${ICON.chev}</button>`;
    return html + `</section>`;
  }

  function howSheet() {
    const m = computeMonth(ymNow());
    const f = freeToSpend(m);
    const grp = (kind) => m.lines.filter((l) => l.c.kind === kind && (l.counted !== 0 || l.has)).map((l) => {
      let why;
      if (kind === "enveloppe") why = l.actual > l.plan ? "dépensé, au-delà du budget" : l.actual > 0 ? `budget, dont ${eur(l.actual)} dépensés` : "budget prévu";
      else why = l.has ? (kind === "revenu" ? "reçu" : "payée") : "à venir";
      return `<dt>${esc(l.c.name)} <span class="tag">(${why})</span></dt><dd>${eur(l.counted)}</dd>`;
    }).join("");
    openSheet(`<h2>Comment c'est calculé</h2>
      <p class="meta">Ce qui est passé compte pour son vrai montant, le reste pour ce que tu as prévu.</p>
      <dl class="summary"><span class="grp">${KIND_L.revenu}</span>${grp("revenu")}${m.events.filter((e) => e.type === "in").map((e) => `<dt>${esc(e.label)} <span class="tag">(prévu)</span></dt><dd>${eur(e.amount)}</dd>`).join("")}
      <span class="grp">${KIND_L.fixe}</span>${grp("fixe")}
      <span class="grp">${KIND_L.enveloppe}</span>${grp("enveloppe")}
      ${m.uncl || m.estOver || m.evOut ? `<span class="grp">Autres</span>` : ""}${m.uncl ? `<dt>À trier (${m.unclCount})</dt><dd>${eur(m.uncl)}</dd>` : ""}
      ${m.estOver ? `<dt>Dépenses probables pas encore importées</dt><dd>${eur(m.estOver)}</dd>` : ""}
      ${m.events.filter((e) => e.type === "out").map((e) => `<dt>${esc(e.label)} <span class="tag">(prévu)</span></dt><dd>${eur(e.amount)}</dd>`).join("")}
      <dt class="total">Fin du mois prévue</dt><dd class="total">${eur(m.end)}</dd>
      ${f.target > 0 ? `<dt>Épargne à protéger</dt><dd>− ${eur(f.target)}</dd>` : ""}
      ${f.room > 0 ? `<dt>Budget ${esc(f.roomName)} restant</dt><dd>+ ${eur(f.room)}</dd>` : ""}
      <dt class="total">Tu peux dépenser</dt><dd class="total">${eur(f.total)}</dd></dl>
      ${m.est && m.est.last ? `<p class="hint">Relevé importé jusqu'au ${shortDate(m.est.last)}.${m.est.days && m.est.avg !== null ? ` Depuis, environ ${eur0(m.est.est)} de dépenses probables d'après ta moyenne, déjà couvertes par tes budgets${m.estOver ? " en partie" : ""}.` : ""}</p>` : `<p class="hint">Aucun relevé importé : seuls tes montants prévus et tes saisies comptent.</p>`}
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Fermer</button></div>`, "Comment c'est calculé");
  }

  function billsSheet() {
    const m = computeMonth(ymNow());
    const pins = fixedPins(m, daysIn(m.ym)).filter((p) => p.amount > 0 || p.paid).sort((a, b) => (a.paid === b.paid ? (a.day || 99) - (b.day || 99) : a.paid ? 1 : -1));
    openSheet(`<h2>Factures de ${MONTHS[new Date().getMonth()]}</h2>
      <div class="rows" style="background:var(--surface-2)">${pins.map((p) => `<div class="row"><span class="name">${esc(p.c.name)}</span><span class="amt">${eur(p.amount)}</span>
        <span class="sub">${p.paid ? `Payée${p.c.budget > 0 && Math.abs(p.amount - p.c.budget) >= 0.01 ? `, prévu ${eur(p.c.budget)}` : ""}` : p.day ? `Vers le ${p.day}` : "Date pas encore connue"}</span><span class="st ${p.paid ? "paid" : ""}">${p.paid ? "payée" : "à venir"}</span></div>`).join("") || `<div class="row"><span class="name">Aucune facture prévue</span></div>`}</div>
      <p class="hint">Les dates viennent de tes relevés précédents. Les montants se changent dans Réglages, Budget.</p>
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Fermer</button></div>`, "Factures du mois");
  }

  /* ================= Le point ================= */
  function renderPoint() {
    const cov = coverage();
    const days = cov ? Math.round((new Date(todayISO()) - new Date(cov)) / 864e5) : null;
    const sub = cov ? `Relevé à jour au ${shortDate(cov)}${days > 0 ? `, il y a ${days} jour${days > 1 ? "s" : ""}` : ""}` : "Aucun relevé importé pour l'instant";
    let html = head("Le point", sub);
    html += `<section class="fresh">
      <button class="btn primary" data-act="importCsv">Importer le relevé Revolut</button>
      <button class="btn link" data-act="importJournal" style="align-self:center">Importer le journal Apple Pay</button></section>`;
    if (lastImport) html += importSummary(lastImport);
    html += renderTri();
    html += renderBilan();
    html += `<section class="section"><button class="callout" data-act="go" data-v="operations"><span><b>Toutes les opérations</b>, ${state.tx.length} au total. Rechercher, corriger, répartir.</span>${ICON.chev}</button></section>`;
    app.innerHTML = html;
  }

  function importSummary(r) {
    const lines = r.journal
      ? [["Paiements ajoutés", r.added], r.dup ? ["Déjà connus", r.dup] : null, r.unreadable ? ["Lignes illisibles", r.unreadable] : null]
      : [["Opérations ajoutées", r.added], r.dup ? ["Déjà importées", r.dup] : null, r.reverted ? ["Paiements annulés, ignorés", r.reverted] : null, r.pending ? ["En attente, à réimporter", r.pending] : null, r.unreadable || r.other ? ["Lignes illisibles", (r.unreadable || 0) + (r.other || 0)] : null, r.merged ? ["Saisies remplacées par le relevé", r.merged] : null];
    return `<section class="panel" aria-label="Import"><div class="sh"><h2>${r.journal ? "Journal Apple Pay importé" : "Relevé importé"}</h2><button class="btn link" data-act="closeImport">OK</button></div>
      <dl class="summary">${lines.filter(Boolean).map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl></section>`;
  }

  /* ---------- Tri, une opération à la fois ---------- */
  function triGroups() {
    return merchantGroups(state.tx.filter((t) => classify(t) === null)).filter((g) => !triSkip.has(g.key));
  }
  function renderTri() {
    const all = merchantGroups(state.tx.filter((t) => classify(t) === null));
    const groups = all.filter((g) => !triSkip.has(g.key));
    if (!all.length) return `<section class="section"><div class="sh"><h2>À trier</h2><span>rien</span></div><div class="callout" style="cursor:default"><span><b>Tout est trié.</b> Les prochains achats chez les mêmes commerces se classeront tout seuls.</span></div></section>`;
    if (!groups.length) return `<section class="section"><div class="sh"><h2>À trier</h2><span>${all.length} passé${all.length > 1 ? "s" : ""}</span></div><button class="callout" data-act="triReset"><span>Tu as passé ${all.length} commerce${all.length > 1 ? "s" : ""}. Reprendre le tri.</span>${ICON.chev}</button></section>`;
    const g = groups[0];
    const s = suggest(g.tx[0]);
    const doneN = state.tx.length ? 0 : 0;
    const total = all.length;
    const pos = total - groups.length + 1;
    const dates = g.tx.map((t) => t.date).sort().slice(-3).map(shortDate).join(", ");
    const chipsOf = (k) => state.categories.filter((c) => c.kind === k && (!s || c.id !== s.id)).map((c) => `<button class="cat" data-act="triPick" data-k="${esc(g.key)}" data-v="${esc(c.id)}">${esc(c.name)}</button>`).join("");
    const daily = chipsOf("enveloppe"), other = chipsOf("fixe") + chipsOf("revenu");
    const kinds = `<p class="grp">${KIND_L.enveloppe}</p>${daily}` + (other ? `<details class="more tri-more"><summary>Une facture ou un revenu</summary><div class="grid">${other}</div></details>` : "");
    void doneN;
    return `<section class="section"><div class="sh"><h2>À trier</h2><span>${eur0(all.reduce((a, x) => a + x.total, 0))} au total</span></div>
      <div class="tri enter" id="tri" data-k="${esc(g.key)}">
        <div class="prog"><span>${pos} sur ${total}</span><i><b style="width:${((pos - 1) / total) * 100}%"></b></i></div>
        <div><p class="who">${esc(g.label)}</p><p class="what"><b>${g.count} achat${g.count > 1 ? "s" : ""}, ${eur(g.total)}</b>, ${esc(dates)}</p></div>
        ${s ? `<div class="guess"><span>Sans doute<b>${esc(cat(s.id).name)}</b></span><button class="btn small dark" data-act="triPick" data-k="${esc(g.key)}" data-v="${esc(s.id)}">C'est ça</button></div>` : ""}
        <div class="grid" role="group" aria-label="Ranger dans">${kinds}</div>
        <div class="btn-row"><button class="btn secondary" data-act="triPick" data-k="${esc(g.key)}" data-v="hors">Ne pas compter</button><button class="btn secondary" data-act="triSkip" data-k="${esc(g.key)}">Plus tard</button></div>
        <p class="hint">Ton choix s'applique aux ${g.count > 1 ? `${g.count} achats` : "achats"} chez ce commerce, et aux prochains.</p>
      </div></section>`;
  }
  function triPick(key, v) {
    const n = applyGroup(key, v);
    save();
    const el = document.getElementById("tri");
    const after = () => { renderPoint(); const t = document.getElementById("tri"); if (t) t.scrollIntoView({ block: "nearest" }); };
    toast(v === "hors" ? `${n} achat${n > 1 ? "s" : ""} non compté${n > 1 ? "s" : ""}` : `${n} achat${n > 1 ? "s" : ""} rangé${n > 1 ? "s" : ""} dans ${catName(v)}`);
    if (el && !reduced()) { el.classList.remove("enter"); el.classList.add("leave"); setTimeout(after, 170); } else after();
    updateBadge();
  }

  /* ---------- Bilan en phrases ---------- */
  function spentByLabel(txs) {
    const g = new Map();
    for (const t of txs) {
      if (t.amount >= 0) continue;
      const k = classify(t);
      if (k === "hors" || (cat(k) && cat(k).kind === "fixe")) continue;
      const key = norm(t.label);
      if (!g.has(key)) g.set(key, { label: t.label, total: 0, n: 0 });
      const x = g.get(key); x.total = round2(x.total - t.amount); x.n++;
    }
    return [...g.values()].sort((a, b) => b.total - a.total);
  }
  function facts(ym) {
    const now = ymNow();
    const m = computeMonth(ym, ym < now ? { raw: true } : {});
    const out = [];
    const mName = MONTHS[Number(ym.slice(5)) - 1];
    const expTx = m.txs.filter((t) => t.amount < 0 && classify(t) !== "hors");
    if (ym < now) {
      const plan = planEnd();
      const d = round2(m.end - plan);
      out.push({ ic: "coins", cls: d >= 0 ? "good" : "warn", t: `En ${mName}, il t'est resté <b>${eur0(m.end)}</b>, ${d >= 0 ? `${eur0(d)} de mieux` : `${eur0(-d)} de moins`} que ton budget (${eur0(plan)}).` });
    } else {
      const since = new Date(); since.setDate(since.getDate() - 7);
      const sIso = isoOf(since);
      const week = round2(state.tx.filter((t) => t.date > sIso && t.date <= todayISO() && t.amount < 0 && classify(t) !== "hors" && !(cat(classify(t)) && cat(classify(t)).kind === "fixe")).reduce((a, t) => a - t.amount, 0));
      const avg = avgDaily();
      const cov = coverage();
      if (cov && cov < todayISO() && Math.round((new Date(todayISO()) - new Date(cov)) / 864e5) >= 3) out.push({ ic: "alert", cls: "warn", t: `Ton relevé s'arrête au <b>${shortDate(cov)}</b>. Importe-le pour que ce bilan soit juste.` });
      out.push({ ic: "cal", cls: "", t: `Ces 7 derniers jours : <b>${eur0(week)}</b> de dépenses enregistrées${avg !== null ? `, pour environ ${eur0(avg * 7)} une semaine normale` : ""}.` });
      for (const l of m.lines) {
        if (l.c.kind !== "enveloppe" || !(l.plan > 0)) continue;
        const pc = pace(m, l);
        if (l.actual > l.plan) out.push({ ic: "alert", cls: "bad", t: `<b>${esc(l.c.name)}</b> a déjà dépassé son budget de ${eur0(l.actual - l.plan)}.` });
        else if (pc && pc > l.plan * 1.05) out.push({ ic: "trend", cls: "warn", t: `À ce rythme, <b>${esc(l.c.name)}</b> finira à ${eur0(pc)} pour ${eur0(l.plan)} prévus.` });
      }
    }
    const top = spentByLabel(m.txs).slice(0, 3);
    if (top.length) out.push({ ic: "bag", cls: "", t: `Là où ça part le plus${ym < now ? "" : " ce mois-ci"} : ${top.map((x) => `<b>${esc(x.label)}</b> ${eur0(x.total)}${x.n > 1 ? ` (${x.n} fois)` : ""}`).join(", ")}.` });
    const small = expTx.filter((t) => -t.amount < 10 && !(cat(classify(t)) && cat(classify(t)).kind === "fixe"));
    if (small.length >= 8) out.push({ ic: "coins", cls: "", t: `<b>${small.length} petits achats</b> de moins de 10 € : ${eur0(small.reduce((a, t) => a - t.amount, 0))} au total.` });
    for (const l of m.lines) {
      if (l.c.kind !== "fixe") continue;
      const tx = m.txs.filter((t) => classify(t) === l.c.id && t.amount < 0);
      if (tx.length >= 2) out.push({ ic: "repeat", cls: "warn", t: `<b>${esc(l.c.name)}</b> a été prélevé ${tx.length} fois (${tx.map((t) => t.date).sort().map((d) => `le ${Number(d.slice(8))}`).join(", ")}) : ${eur(l.actual)} au lieu de ${eur(l.plan)}. À vérifier.` });
      else if (ym < now && l.c.active && l.plan > 0 && !tx.length) out.push({ ic: "alert", cls: "", t: `<b>${esc(l.c.name)}</b> n'apparaît pas dans le relevé de ${mName}. Payé ailleurs, ou à une autre date ?` });
    }
    const big = expTx.filter((t) => !(cat(classify(t)) && cat(classify(t)).kind === "fixe")).sort((a, b) => a.amount - b.amount)[0];
    if (big && -big.amount >= 50) out.push({ ic: "bag", cls: "", t: `Plus grosse dépense : <b>${esc(big.label)}</b>, ${eur(-big.amount)} le ${shortDate(big.date)}.` });
    if (m.unclCount) out.push({ ic: "alert", cls: "warn", t: `<b>${eur0(m.uncl)}</b> restent à trier sur ce mois : le bilan est encore approximatif.` });
    const bs = budgetSuggestions();
    if (bs.length) out.push({ ic: "trend", cls: "", t: `Tes budgets ne collent pas à ce que tu dépenses vraiment : ${bs.map((x) => `${esc(x.c.name)} ${eur0(x.c.budget)} → ${eur0(x.suggested)}`).join(", ")}.`, act: `<button class="btn small secondary act" data-act="go" data-v="budget">Ajuster mes budgets</button>` });
    return out;
  }
  function renderBilan() {
    const months = [...new Set(state.tx.map((t) => ymOf(t.date)))].filter((ym) => ym < ymNow()).sort();
    const choices = [ymNow()].concat(months.slice(-2).reverse());
    if (!bilanYM || !choices.includes(bilanYM)) bilanYM = ymNow();
    const fs = facts(bilanYM);
    const ICONS = { coins: ICON.coins, cal: ICON.cal, bag: ICON.bag, alert: ICON.alert, trend: ICON.trend, repeat: ICON.repeat };
    return `<section class="section"><div class="sh"><h2>Le bilan</h2></div>
      ${choices.length > 1 ? `<div class="seg" role="group" aria-label="Mois">${choices.map((ym) => `<button data-act="bilan" data-v="${ym}" aria-pressed="${bilanYM === ym}">${ym === ymNow() ? "Ce mois-ci" : cap(MONTHS[Number(ym.slice(5)) - 1])}</button>`).join("")}</div>` : ""}
      <div class="facts">${fs.length ? fs.map((x) => `<div class="fact ${x.cls}"><span class="ic">${ICONS[x.ic] || ICON.cal}</span><div><p>${x.t}</p>${x.act || ""}</div></div>`).join("") : `<div class="empty"><b>Rien à dire pour l'instant.</b><p>Importe ton relevé : le bilan se remplit tout seul.</p></div>`}</div></section>`;
  }

  /* ---------- Toutes les opérations ---------- */
  function renderOperations() {
    const m = computeMonth(viewYM, viewYM < ymNow() ? { raw: true } : {});
    const right = `<div class="mnav"><button class="iconbtn" data-act="prev" aria-label="Mois précédent">${ICON.prev}</button><button class="iconbtn" data-act="next" aria-label="Mois suivant" ${viewYM < ymNow() ? "" : "disabled"}>${ICON.next}</button></div>`;
    let html = head(cap(monthName(viewYM)), `${m.txs.length} opération${m.txs.length > 1 ? "s" : ""}`, { right });
    html += `<div class="field"><label for="opsQuery" class="sr">Rechercher</label><input type="search" id="opsQuery" placeholder="Rechercher un commerce, une note, un montant" value="${esc(opsQuery)}" autocomplete="off"></div>`;
    html += `<div class="seg" role="group" aria-label="Filtre"><button data-act="opsOnly" data-v="0" aria-pressed="${!opsOnly}">Toutes</button><button data-act="opsOnly" data-v="1" aria-pressed="${opsOnly}">À trier (${m.unclCount})</button></div>`;
    html += `<div id="opsList">${opsList(m)}</div>`;
    app.innerHTML = html;
  }
  function opsList(m) {
    let list = m.txs.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    if (opsOnly) list = list.filter((t) => classify(t) === null);
    const q = norm(opsQuery);
    if (q) { const qa = parseAmount(opsQuery); list = list.filter((t) => norm(t.label).includes(q) || norm(t.note).includes(q) || norm(catName(classify(t))).includes(q) || (isFinite(qa) && Math.abs(Math.abs(t.amount) - Math.abs(qa)) < 0.005)); }
    if (!list.length) return q ? `<p class="hint">Rien ne correspond à « ${esc(opsQuery)} » en ${monthName(m.ym)}.</p>` : `<div class="empty"><b>${opsOnly ? "Tout est trié pour ce mois." : `Aucune opération en ${monthName(m.ym)}.`}</b></div>`;
    let html = "", cur = "", block = "";
    const flush = () => { if (block) html += `<div><div class="daygroup">${dayLabel(cur)}</div><div class="rows">${block}</div></div>`; block = ""; };
    for (const t of list) {
      if (t.date !== cur) { flush(); cur = t.date; }
      const k = classify(t);
      let tag;
      if (k === null) { const s = suggest(t); tag = `<span class="tag todo">À trier</span>${s ? ` <span class="tag sugg">${esc(cat(s.id).name)} ?</span>` : ""}`; }
      else if (k === "hors") tag = `<span class="tag">Ignorée</span>`;
      else tag = `<span class="tag">${esc(cat(k).name)}${t.source === "manuel" ? ", saisie" : t.source === "applepay" ? ", Apple Pay" : ""}${t.orig ? ", modifiée" : ""}</span>`;
      block += `<button class="row" data-act="openTx" data-id="${esc(t.id)}"><span class="name">${esc(t.label || catName(k))}</span><span class="amt ${k === "hors" ? "muted" : t.amount > 0 ? "in" : ""}">${t.amount > 0 ? "+" : "−"}${eur(Math.abs(t.amount))}</span><span class="sub">${tag}${t.note ? `<br><span class="note">${esc(t.note)}</span>` : ""}</span></button>`;
    }
    flush();
    return html;
  }

  /* ================= Projets ================= */
  function renderProjets() {
    const m = computeMonth(ymNow());
    let html = head("Projets", "Ce que tes décisions changent sur les prochains mois");
    html += renderBuy();
    html += renderEpargne(m);
    html += renderVoiture(m);
    html += renderProchains();
    html += renderPrevu();

    updateBuy();

  function renderBuy() {
    const opts = Array.from({ length: 12 }, (_, i) => ymShift(ymNow(), i)).map((ym) => `<option value="${ym}" ${buy.ym === ym ? "selected" : ""}>${cap(MONTHS[Number(ym.slice(5)) - 1])}${ym.slice(0, 4) !== ymNow().slice(0, 4) ? " " + ym.slice(0, 4) : ""}</option>`).join("");
    return `<section class="panel" aria-label="Et si j'achète"><h2 style="font-family:var(--font-fig);font-stretch:85%;font-size:21px">Et si j'achète…</h2>
      <div class="grid2"><div class="field"><label for="buyAmt" class="sr">Montant</label><input class="big-in" id="buyAmt" inputmode="decimal" placeholder="0 €" value="${esc(buy.amount)}" autocomplete="off"></div>
        <div class="field"><label for="buyYm" class="sr">Mois</label><select id="buyYm" class="input">${opts}</select></div></div>
      <div id="buyRes" aria-live="polite"></div></section>`;
  }
  function updateBuy() {
    const box = document.getElementById("buyRes");
    if (!box) return;
    const a = parseAmount(buy.amount);
    if (!(a > 0)) { box.innerHTML = `<p class="hint">Un téléphone, un week-end, des meubles : tape le prix et choisis le mois, tu vois l'effet sur ton épargne.</p>`; return; }
    const base = projection(6, 0);
    const tmp = { id: "__buy", label: "Achat", type: "out", ym: buy.ym, amount: a, done: false };
    state.events.push(tmp);
    let withB, mB, mBase;
    try { withB = projection(6, 0); mB = computeMonth(buy.ym); } finally { state.events.pop(); }
    mBase = computeMonth(buy.ym);
    const idx = Math.max(0, ymDiff(ymNow(), buy.ym));
    const lastBase = base[5].cum, lastWith = withB[5].cum;
    const t = savingTarget();
    let msg;
    if (mB.end < 0) msg = `<p class="v1 ko" style="font-weight:650">${cap(MONTHS[Number(buy.ym.slice(5)) - 1])} finirait dans le rouge (${eur0(mB.end)}).</p>`;
    else if (t > 0 && mB.end < t) msg = `<p style="font-weight:650;color:var(--warn)">Faisable, mais ton épargne de ${MONTHS[Number(buy.ym.slice(5)) - 1]} tomberait à ${eur0(mB.end)} au lieu de ${eur0(t)}.</p>`;
    else msg = `<p style="font-weight:650;color:var(--good)">Faisable sans toucher à ton épargne.</p>`;
    box.innerHTML = `${msg}<dl class="summary" style="margin-top:8px"><dt>Fin de ${MONTHS[Number(buy.ym.slice(5)) - 1]}</dt><dd>${eur0(mB.end)} <span class="tag">au lieu de ${eur0(mBase.end)}</span></dd>
      ${idx <= 5 ? `<dt>De côté d'ici ${monthName(base[5].ym)}</dt><dd>${eur0(lastWith)} <span class="tag">au lieu de ${eur0(lastBase)}</span></dd>` : ""}</dl>
      <button class="btn secondary" data-act="buyAdd" style="margin-top:10px">L'ajouter à mes prévisions</button>`;
  }

  function renderEpargne(m) {
    const t = savingTarget();
    const goals = state.goals.map((g) => {
      const n = goalNeed(g);
      const pct = g.target > 0 ? Math.min(100, ((g.saved || 0) / g.target) * 100) : 0;
      return `<button class="row" data-act="editGoal" data-id="${esc(g.id)}"><span class="name">${esc(g.name)}</span><span class="amt">${eur0(g.saved || 0)} <span class="tag">/ ${eur0(g.target)}</span></span>
        <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div><span class="sub">${n.done ? "Atteint" : n.late ? `Date passée, il manque ${eur0(n.rest)}` : `${eur0(n.need)} par mois jusqu'en ${monthName(ymOf(g.date))}`}</span></button>`;
    }).join("");
    const ok = m.end >= t;
    return `<section class="section"><div class="sh"><h2>Épargne</h2><span>${t > 0 ? `${eur0(t)} par mois` : "aucun objectif"}</span></div>
      <div class="rows"><div class="money-row"><label for="goal">Chaque mois, quoi qu'il arrive<small>Ce montant est mis de côté avant de calculer ce que tu peux dépenser</small></label><div class="money-in"><input id="goal" inputmode="decimal" value="${esc(amountText(state.settings.goal))}" placeholder="0"><span aria-hidden="true">€</span></div></div>${goals}
        <button class="row" data-act="editGoal"><span class="name" style="color:var(--accent)">Ajouter un projet d'épargne</span>${ICON.chev}<span class="sub">Un voyage, un apport, un matelas de sécurité : montant et date</span></button></div>
      ${t > 0 ? `<p class="hint" style="color:${ok ? "var(--good)" : "var(--bad)"}">${ok ? `Ce mois-ci, c'est tenable : fin du mois prévue à ${eur0(m.end)}.` : `Ce mois-ci, il manque ${eur0(t - m.end)} pour tout mettre de côté.`}</p>` : ""}</section>`;
  }

  function renderVoiture(m) {
    const v = cat("voiture");
    const cars = state.cars;
    const full = cars.filter((c) => c.rent > 0 && c.months > 0);
    let inner = cars.map((c) => {
      const ok = c.rent > 0 && c.months > 0;
      const total = ok ? round2((c.deposit || 0) + c.rent * c.months) : null;
      const effect = v && v.active ? round2(c.rent - v.budget) : c.rent;
      return `<button class="row" data-act="editCar" data-id="${esc(c.id)}"><span class="name">${esc(c.name)}</span><span class="amt">${eur0(c.rent)}<span class="tag"> /mois</span></span>
        <span class="sub">${ok ? `${eur0(total / c.months)} par mois apport compris, ${eur0(total)} au total` : "Durée manquante pour le coût total"}. Avec elle, ce mois finirait à <b>${eur0(m.end - (effect || 0))}</b>.</span></button>`;
    }).join("");
    inner += `<button class="row" data-act="editCar"><span class="name" style="color:var(--accent)">Ajouter une offre</span>${ICON.chev}<span class="sub">Loyer, apport, durée : le vrai coût s'affiche</span></button>`;
    return `<section class="section"><div class="sh"><h2>Voiture</h2><span>${cars.length ? `${cars.length} offre${cars.length > 1 ? "s" : ""}` : ""}</span></div><div class="rows">${inner}</div>
      ${full.length >= 2 ? `<div class="panel"><div class="hbars">${hbars(full.map((c) => ({ k: c.name, v: ((c.deposit || 0) + c.rent * c.months) / c.months })).sort((a, b) => a.v - b.v))}</div><p class="hint">Coût moyen par mois, apport compris. Sans option d'achat ni frais de fin de contrat.</p></div>` : ""}</section>`;
  }

  function renderProchains() {
    const opts = carOptions();
    const p = projection(6, carMonthlyOf(projCar));
    return `<section class="section"><div class="sh"><h2>Les 6 prochains mois</h2><span>${eur0(p[5].cum)} de côté</span></div><div class="panel">
      ${opts.length ? `<div class="field"><label for="projCar">Avec une voiture</label><select id="projCar"><option value="">Sans changement</option>${opts.map((o) => `<option value="${esc(o.id)}" ${projCar === o.id ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select></div>` : ""}
      ${colChart("proj", p.map((x) => ({ k: monthShort(x.ym), v: x.end })), { label: "Reste prévu sur 6 mois", defaultSel: 0 })}
      <div class="table-wrap"><table class="table"><thead><tr><th>Mois</th><th>Reste</th><th>Cumul</th></tr></thead><tbody>${p.map((x) => `<tr><td>${cap(monthShort(x.ym))}${x.ev ? ` <span class="tag">(${sgn(x.ev)} prévu)</span>` : ""}</td><td class="${x.end < 0 ? "neg" : ""}">${eur0(x.end)}</td><td>${eur0(x.cum)}</td></tr>`).join("")}</tbody></table></div>
      <p class="hint">Le mois en cours compte tes vraies dépenses ; les suivants, ton budget et tes prévisions.</p></div></section>`;
  }

  function renderPrevu() {
    const list = state.events.filter((e) => e.ym >= ymNow()).sort((a, b) => (a.ym < b.ym ? -1 : 1));
    const rows = list.map((e) => `<button class="row" data-act="editEvent" data-id="${esc(e.id)}"><span class="name">${esc(e.label)}</span><span class="amt ${e.type === "in" ? "in" : ""} ${e.done ? "muted" : ""}">${e.type === "in" ? "+" : "−"}${eur(e.amount)}</span><span class="sub">${cap(monthName(e.ym))}${e.done ? ", arrivé" : ""}</span></button>`).join("");
    return `<section class="section"><div class="sh"><h2>Prévu</h2><span>hors dépenses habituelles</span></div><div class="rows">${rows}
      <button class="row" data-act="editEvent"><span class="name" style="color:var(--accent)">Ajouter une rentrée ou une dépense prévue</span>${ICON.chev}<span class="sub">Une prime, une facture annuelle, un cadeau</span></button></div></section>`;
  }

  /* ---------- Graphiques ---------- */
  function hbars(items) {
    const max = Math.max(1, ...items.map((i) => Math.abs(i.v)));
    return items.map((i) => `<div class="hbar ${i.base ? "base" : ""} ${i.v < 0 ? "neg" : ""}"><span class="k">${esc(i.k)}</span><span class="v ${i.v < 0 ? "neg" : ""}">${eur0(i.v)}</span><span class="track" aria-hidden="true"><i style="width:${Math.max(2, (Math.abs(i.v) / max) * 100)}%"></i></span></div>`).join("");
  }
  function niceStep(span) { const raw = span / 3; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p; }
  function colChart(id, data, opts = {}) {
    const W = 340, H = 170, padL = 4, padR = 4, padT = 24, padB = 22;
    const vals = data.map((d) => d.v), max = Math.max(0, ...vals), min = Math.min(0, ...vals), span = max - min || 1;
    const y = (v) => padT + ((max - v) / span) * (H - padT - padB);
    const n = data.length, slot = (W - padL - padR) / n, bw = Math.min(30, slot * 0.56);
    const sel = chartSel[id] ?? (opts.defaultSel ?? n - 1);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "")}">`;
    const step = niceStep(span);
    for (let g = Math.ceil(min / step) * step; g <= max + 0.001; g += step) s += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y(g)}" y2="${y(g)}"/>`;
    s += `<line class="base" x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}"/>`;
    data.forEach((d, i) => {
      const cx = padL + slot * i + slot / 2, x = cx - bw / 2, y0 = y(0), y1 = y(d.v), h = Math.abs(y1 - y0), r = Math.min(4, h);
      const cls = `colbar ${d.v < 0 ? "neg" : ""}`;
      if (d.v >= 0) s += `<path class="${cls}" d="M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 + r} V${y0} Z"/>`;
      else s += `<path class="${cls}" d="M${x},${y0} V${y1 - r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 - r} V${y0} Z"/>`;
      s += `<text class="lbl" x="${cx}" y="${H - 6}" text-anchor="middle">${esc(d.k)}</text>`;
      if (i === sel) s += `<text class="val" x="${Math.min(W - 30, Math.max(30, cx))}" y="${d.v >= 0 ? y1 - 6 : y1 + 14}" text-anchor="middle">${eur0(d.v)}</text>`;
      s += `<rect class="hit" x="${padL + slot * i}" y="0" width="${slot}" height="${H}" tabindex="0" role="button" aria-label="${esc(d.k)} : ${eur0(d.v)}" data-act="chartSel" data-chart="${id}" data-i="${i}"/>`;
    });
    return s + "</svg>";
  }

  /* ================= Réglages ================= */

  /* ================= Feuilles ================= */
  function openSheet(inner, label) {
    if (!sheetHost.innerHTML) lastFocus = document.activeElement;
    sheetHost.innerHTML = `<div class="scrim" data-act="closeSheet"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><span class="grab" aria-hidden="true"></span>${inner}</section></div>`;
    const f = sheetHost.querySelector(".sheet input:not([type=hidden]), .sheet select, .sheet button");
    if (f) f.focus({ preventScroll: true });
  }
  function closeSheet() {
    const s = sheetHost.querySelector(".scrim");
    if (!s) return;
    const done = () => { if (sheetHost.contains(s)) sheetHost.innerHTML = ""; if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus({ preventScroll: true }); };
    if (reduced()) return done();
    s.classList.add("closing"); setTimeout(done, 150);
  }
  function confirmSheet(title, text, okLabel, okAct, extra = "") {

  }

    const groups = order.map((kind) => {
      const list = state.categories.filter((c) => c.kind === kind);
      return list.length ? `<p class="grp">${KIND_L[kind]}</p>` + list.map((c) => `<label class="choice"><input type="radio" name="txCat" value="${esc(c.id)}" ${k === c.id || (s && s.id === c.id) ? "checked" : ""}>${esc(c.name)}${s && s.id === c.id ? `<span class="why">Suggéré</span>` : ""}</label>`).join("") : "";
    }).join("");
    const canRule = t.label && t.source !== "manuel";
    const same = canRule ? state.tx.filter((x) => x !== t && norm(x.label) === norm(t.label)).length : 0;
    openSheet(`<h2>${esc(t.label || "Sans libellé")}</h2><p class="meta">${dayLabel(t.date)}, <span class="num">${sgn(t.amount)}</span>${t.orig ? ` (relevé : ${sgn(t.orig.amount)})` : ""}</p>

        <div class="grid2"><div class="field"><label for="txAmt">Montant</label><div class="money-in"><input id="txAmt" inputmode="decimal" value="${esc(amountText(Math.abs(t.amount)))}"><span aria-hidden="true">€</span></div></div>
          <div class="field"><label for="txDate">Date</label><input type="date" id="txDate" value="${esc(t.date)}"></div></div>
        <div class="field"><label for="txLabel">Libellé</label><input type="text" id="txLabel" value="${esc(t.label)}"></div>
        <div class="field"><span class="flabel">Répartir une partie ailleurs</span><div class="grid2"><div class="money-in"><input id="txSplitAmt" inputmode="decimal" placeholder="0" aria-label="Part à déplacer"><span aria-hidden="true">€</span></div>
          <select class="input" id="txSplitCat" aria-label="Catégorie de la part">${state.categories.filter((c) => c.kind !== "revenu").map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select></div>

        ${t.orig ? `<button class="btn secondary" data-act="restoreTx" data-id="${esc(t.id)}">Revenir au montant du relevé</button>` : ""}</div></details>
      ${t.source === "manuel" || t.parent ? `<button class="btn danger" data-act="askDelTx" data-id="${esc(t.id)}">Supprimer</button>` : ""}
      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Annuler</button><button class="btn primary" data-act="saveTx" data-id="${esc(t.id)}">Enregistrer</button></div>`, "Opération");
  }

  function addRule(label, catId) {
    const kw = String(label).trim();
    for (const c of state.categories) c.kw = (c.kw || []).filter((k) => norm(k) !== norm(kw));
    cat(catId).kw.push(kw);
  }
  function applyGroup(key, v) {
    const list = state.tx.filter((t) => classify(t) === null && (norm(t.label) || "(sans libellé)") === key);
    if (!list.length) return 0;
    if (v === "hors") list.forEach((t) => (t.manualCat = "hors"));
    else if (list[0].source === "manuel" || !list[0].label) list.forEach((t) => (t.manualCat = v));
    else addRule(list[0].label, v);
    return list.length;
  }
  function merchantGroups(list) {
    const g = new Map();
    for (const t of list) {
      const k = norm(t.label) || "(sans libellé)";
      if (!g.has(k)) g.set(k, { key: k, label: t.label || "Sans libellé", count: 0, total: 0, tx: [] });
      const x = g.get(k); x.count++; x.total = round2(x.total - t.amount); x.tx.push(t);
    }
    return [...g.values()].sort((a, b) => b.total - a.total);
  }

      <div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Annuler</button><button class="btn primary" data-act="saveCar" data-id="${esc(c.id)}">Enregistrer</button></div>`, "Offre de voiture");
